[package]
name = "ferris_forge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
libc = "0.2.190"
open = "5.4.4"
regex = "1.13.1"
rmpv = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs"] }
