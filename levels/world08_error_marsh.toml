struct Config {
    name: String,
    players: u32,
    music: bool,
}

#[derive(Debug, PartialEq)]
enum ConfigError {
    BadLine(usize),
    MissingKey(String),
    BadNumber(String),
    BadBool(String),
}

fn parse_config(text: &str) -> Result<Config, ConfigError> {
    todo!()
}

fn main() {
    let text = "name = Crab Quest\nplayers = 4\nmusic = on";
    println!("{:?}", parse_config(text));
}
'''
solution = '''
#[derive(Debug, PartialEq)]
struct Config {
    name: String,
    players: u32,
    music: bool,
}

#[derive(Debug, PartialEq)]
enum ConfigError {
    BadLine(usize),
    MissingKey(String),
    BadNumber(String),
    BadBool(String),
}

fn parse_config(text: &str) -> Result<Config, ConfigError> {
    let mut name = None;
    let mut players = None;
    let mut music = None;
    for (i, line) in text.lines().enumerate() {
        let line = line.trim();
        if line.is_empty() || line.starts_with('#') {
            continue;
        }
        let Some((key, value)) = line.split_once('=') else {
            return Err(ConfigError::BadLine(i + 1));
        };
        let (key, value) = (key.trim(), value.trim());
        match key {
            "name" => name = Some(value.to_string()),
            "players" => {
                let n = value
                    .parse::<u32>()
                    .map_err(|_| ConfigError::BadNumber(value.to_string()))?;
                players = Some(n);
            }
            "music" => {
                music = Some(match value {
                    "on" => true,
                    "off" => false,
                    _ => return Err(ConfigError::BadBool(value.to_string())),
                });
            }
            _ => {}
        }
    }
    Ok(Config {
        name: name.ok_or(ConfigError::MissingKey("name".to_string()))?,
        players: players.ok_or(ConfigError::MissingKey("players".to_string()))?,
        music: music.unwrap_or(false),
    })
}

fn main() {
    let text = "name = Crab Quest\nplayers = 4\nmusic = on";
    println!("{:?}", parse_config(text));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn a_good_config() {
        let text = "# my game\n\nname = Crab Quest\nplayers = 4\nmusic = on\ncolor = red";
        assert_eq!(
            parse_config(text),
            Ok(Config { name: "Crab Quest".to_string(), players: 4, music: true })
        );
    }

    #[test]
    fn music_defaults_to_off() {
        let c = parse_config("name = A\nplayers = 1").unwrap();
        assert!(!c.music);
    }

    #[test]
    fn helpful_errors() {
        assert_eq!(parse_config("players = 2"), Err(ConfigError::MissingKey("name".to_string())));
        assert_eq!(parse_config("name = A"), Err(ConfigError::MissingKey("players".to_string())));
        assert_eq!(parse_config("name = A\nplayers = lots"), Err(ConfigError::BadNumber("lots".to_string())));
        assert_eq!(parse_config("name = A\nplayers = 2\nmusic = maybe"), Err(ConfigError::BadBool("maybe".to_string())));
        assert_eq!(parse_config("name = A\noops"), Err(ConfigError::BadLine(2)));
    }
}
'''
hints = [
    "Keep three `Option`s (name, players, music), fill them while looping over `text.lines().enumerate()`, then build the Config at the end.",
    "For each line: skip blanks/comments, `split_once('=')` (BadLine if None), trim both halves, then `match key`. At the end use `name.ok_or(ConfigError::MissingKey(\"name\".to_string()))?`.",
    "```rust\nlet Some((key, value)) = line.split_once('=') else {\n    return Err(ConfigError::BadLine(i + 1));\n};\nlet (key, value) = (key.trim(), value.trim());\nmatch key {\n    \"name\" => name = Some(value.to_string()),\n    \"players\" => players = Some(value.parse::<u32>().map_err(|_| ConfigError::BadNumber(value.to_string()))?),\n    \"music\" => music = Some(match value { \"on\" => true, \"off\" => false, _ => return Err(ConfigError::BadBool(value.to_string())) }),\n    _ => {}\n}\n```",
]
