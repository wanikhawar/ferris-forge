solution = '''
use std::f64::consts::PI;

trait Shape {
    fn area(&self) -> f64;
    fn name(&self) -> String;
    fn describe(&self) -> String {
        format!("{} with area {:.1}", self.name(), self.area())
    }
}

struct Circle {
    radius: f64,
}

struct Rect {
    width: f64,
    height: f64,
}

struct Triangle {
    base: f64,
    height: f64,
}

impl Shape for Circle {
    fn area(&self) -> f64 {
        PI * self.radius * self.radius
    }

    fn name(&self) -> String {
        "circle".to_string()
    }
}

impl Shape for Rect {
    fn area(&self) -> f64 {
        self.width * self.height
    }

    fn name(&self) -> String {
        "rect".to_string()
    }

    fn describe(&self) -> String {
        let name = if self.width == self.height { "square".to_string() } else { self.name() };
        format!("{} with area {:.1}", name, self.area())
    }
}

impl Shape for Triangle {
    fn area(&self) -> f64 {
        self.base * self.height / 2.0
    }

    fn name(&self) -> String {
        "triangle".to_string()
    }
}

fn largest<T: Shape>(shapes: &[T]) -> Option<&T> {
    let mut best: Option<&T> = None;
    for shape in shapes {
        match best {
            Some(b) if b.area() >= shape.area() => {}
            _ => best = Some(shape),
        }
    }
    best
}

fn compare(a: &impl Shape, b: &impl Shape) -> String {
    let how = if a.area() > b.area() {
        "is bigger than"
    } else if a.area() < b.area() {
        "is smaller than"
    } else {
        "is the same size as"
    };
    format!("{} {} {}", a.name(), how, b.name())
}

fn main() {
    let c = Circle { radius: 2.0 };
    let r = Rect { width: 2.0, height: 2.0 };
    println!("{}", c.describe());
    println!("{}", r.describe());
    println!("{}", compare(&c, &r));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn areas_and_names() {
        assert!((Circle { radius: 2.0 }.area() - 12.566).abs() < 0.001);
        assert_eq!(Rect { width: 3.0, height: 4.0 }.area(), 12.0);
        assert_eq!(Triangle { base: 3.0, height: 4.0 }.area(), 6.0);
        assert_eq!(Triangle { base: 1.0, height: 1.0 }.name(), "triangle");
    }

    #[test]
    fn descriptions() {
        assert_eq!(Circle { radius: 2.0 }.describe(), "circle with area 12.6");
        assert_eq!(Rect { width: 2.0, height: 2.0 }.describe(), "square with area 4.0");
        assert_eq!(Rect { width: 2.0, height: 3.0 }.describe(), "rect with area 6.0");
        assert_eq!(Triangle { base: 3.0, height: 4.0 }.describe(), "triangle with area 6.0");
    }

    #[test]
    fn largest_shape() {
        let circles = vec![Circle { radius: 1.0 }, Circle { radius: 3.0 }, Circle { radius: 2.0 }];
        assert_eq!(largest(&circles).unwrap().radius, 3.0);
        let none: Vec<Rect> = Vec::new();
        assert!(largest(&none).is_none());
    }

    #[test]
    fn comparing_different_shapes() {
        let c = Circle { radius: 1.0 };
        let r = Rect { width: 1.0, height: 1.0 };
        let t = Triangle { base: 2.0, height: 1.0 };
        assert_eq!(compare(&c, &r), "circle is bigger than rect");
        assert_eq!(compare(&t, &c), "triangle is smaller than circle");
        assert_eq!(compare(&r, &t), "rect is the same size as triangle");
    }
}
'''
