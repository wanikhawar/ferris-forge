goal = "Accept a connection from a browser and read its HTTP request, line by line, up to the blank line that ends it."
lesson = '''
The final project: a real **web server**, built from the standard library alone.

The web runs on two protocols:

- **TCP** carries the bytes: a browser *connects* to a server, and both sides read and write a stream.
- **HTTP** says what the bytes mean: requests and responses in a simple text format.

Listening for connections:

```rust
use std::net::TcpListener;

let listener = TcpListener::bind("127.0.0.1:7878").unwrap();

for stream in listener.incoming() {      // waits for each new connection
    let stream = stream.unwrap();        // a TcpStream
    handle_connection(stream);
}
```

`listener.accept()` takes just one connection: it returns `(stream, address)`.

An HTTP request is lines of text, ending with an **empty line**:

```text
GET / HTTP/1.1
Host: 127.0.0.1:7878
User-Agent: Mozilla/5.0 ...

```

Wrap the stream in a `BufReader` to read it line by line, and stop at the empty line:

```rust
let buf_reader = BufReader::new(&stream);
let request: Vec<String> = buf_reader
    .lines()
    .map(|result| result.unwrap())
    .take_while(|line| !line.is_empty())
    .collect();
```

Why stop there? The browser keeps the connection open, waiting for an answer. Reading "until the end" would wait forever.

(The game's server uses port 0, which means "any free port", and a pretend browser in a thread.)
'''
c_compare = '''
`TcpListener::bind` is `socket` + `bind` + `listen`, and `incoming()` is a loop around `accept`. The stream closes itself when it's dropped: no `close()` to forget.
'''
py_compare = '''
Like `socket.create_server(("127.0.0.1", 7878))` and `conn.makefile().readline()` in a loop, with errors as Results instead of exceptions.
'''
