solution = '''
use std::sync::{mpsc, Arc, Mutex};
use std::thread;

type Job = Box<dyn FnOnce() + Send + 'static>;

pub struct ThreadPool {
    workers: Vec<Worker>,
    sender: mpsc::Sender<Job>,
}

impl ThreadPool {
    /// Create a pool with `size` workers.
    ///
    /// # Panics
    ///
    /// Panics if `size` is zero.
    pub fn new(size: usize) -> ThreadPool {
        assert!(size > 0);

        let (sender, receiver) = mpsc::channel();
        let receiver = Arc::new(Mutex::new(receiver));

        let mut workers = Vec::with_capacity(size);
        for id in 0..size {
            workers.push(Worker::new(id, Arc::clone(&receiver)));
        }

        ThreadPool { workers, sender }
    }

    /// Run `f` on one of the workers.
    pub fn execute<F>(&self, f: F)
    where
        F: FnOnce() + Send + 'static,
    {
        let job = Box::new(f);
        self.sender.send(job).unwrap();
    }
}

struct Worker {
    id: usize,
    thread: thread::JoinHandle<()>,
}

impl Worker {
    /// Start a thread that keeps taking jobs from the receiver and running them.
    fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {
        let thread = thread::spawn(move || loop {
            let message = receiver.lock().unwrap().recv();
            match message {
                Ok(job) => job(),
                Err(_) => break,
            }
        });
        Worker { id, thread }
    }
}

fn main() {
    let pool = ThreadPool::new(2);
    let (tx, rx) = mpsc::channel();
    for i in 0..4 {
        let tx = tx.clone();
        pool.execute(move || tx.send(i * i).unwrap());
    }
    drop(tx);
    println!("{}", rx.iter().sum::<i32>());
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;
    use std::time::{Duration, Instant};

    #[test]
    fn hires_the_right_number_of_workers() {
        let pool = ThreadPool::new(4);
        assert_eq!(pool.workers.len(), 4);
        let ids: Vec<usize> = pool.workers.iter().map(|w| w.id).collect();
        assert_eq!(ids, vec![0, 1, 2, 3]);
    }

    #[test]
    #[should_panic]
    fn no_workers_is_a_mistake() {
        ThreadPool::new(0);
    }

    #[test]
    fn runs_every_job() {
        let pool = ThreadPool::new(3);
        let (tx, rx) = mpsc::channel();
        for i in 1..=8 {
            let tx = tx.clone();
            pool.execute(move || tx.send(i).unwrap());
        }
        drop(tx);
        let mut got: Vec<i32> = rx.iter().take(8).collect();
        got.sort();
        assert_eq!(got, (1..=8).collect::<Vec<_>>());
    }

    #[test]
    fn workers_run_side_by_side() {
        let pool = ThreadPool::new(4);
        let (tx, rx) = mpsc::channel();
        let start = Instant::now();
        for _ in 0..4 {
            let tx = tx.clone();
            pool.execute(move || {
                thread::sleep(Duration::from_millis(200));
                tx.send(()).unwrap();
            });
        }
        for _ in 0..4 {
            rx.recv_timeout(Duration::from_secs(2)).expect("a job never finished");
        }
        let took = start.elapsed();
        assert!(took < Duration::from_millis(500), "took {took:?}: 4 workers should run 4 jobs at once");
    }
}
