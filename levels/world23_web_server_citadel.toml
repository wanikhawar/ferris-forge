[[level]]
id = "23.5"
title = "Closing time"
kind = "fix"
book = ["21.3"]
xp = 65
goal = "Give the ThreadPool a clean shutdown: when it's dropped, it must finish the jobs already sent, stop every worker, and wait for them."
lesson = '''
When the pool is dropped, its worker threads should finish what they're doing and stop, and the drop should **wait** for them. Otherwise the program may exit halfway through answering a request.

The first attempt doesn't compile:

```rust
impl Drop for ThreadPool {
    fn drop(&mut self) {
        for worker in &mut self.workers {
            worker.thread.join().unwrap();   // error[E0507]: cannot move out of `worker.thread`
        }
    }
}
```

`join` takes the `JoinHandle` by value, but `drop` only has `&mut self`. Take the workers **out** of the Vec instead: `self.workers.drain(..)` hands them over one by one, by value.

Even then, the workers loop forever waiting for jobs, so `join` would wait forever. They need a signal to stop. **Dropping the sender** is that signal: once no sender is left, `recv()` returns `Err`, and the worker can `break` out of its loop:

```rust
pub struct ThreadPool {
    workers: Vec<Worker>,
    sender: Option<mpsc::Sender<Job>>,   // an Option, so drop can take it
}

fn drop(&mut self) {
    drop(self.sender.take());            // close the channel
    for worker in self.workers.drain(..) {
        worker.thread.join().unwrap();   // wait for each worker to finish
    }
}
```

In the worker:

```rust
match receiver.lock().unwrap().recv() {
    Ok(job) => job(),
    Err(_) => break,      // the pool is shutting down
}
```

Jobs already in the channel are still handed out before `recv` reports the end, so no work is lost.
'''
c_compare = '''
The pthreads version: set a "shutting down" flag, signal the condition variable, and `pthread_join` every worker. Here closing the channel is the flag, and Drop makes sure it happens.
'''
