solution = '''
use std::fs;
use std::io::{BufRead, BufReader, Write};
use std::net::{TcpListener, TcpStream};
use std::sync::{mpsc, Arc, Mutex};
use std::thread;
use std::time::Duration;

type Job = Box<dyn FnOnce() + Send + 'static>;

pub struct ThreadPool {
    workers: Vec<Worker>,
    sender: Option<mpsc::Sender<Job>>,
}

impl ThreadPool {
    pub fn new(size: usize) -> ThreadPool {
        assert!(size > 0);
        let (sender, receiver) = mpsc::channel();
        let receiver = Arc::new(Mutex::new(receiver));
        let mut workers = Vec::with_capacity(size);
        for id in 0..size {
            workers.push(Worker::new(id, Arc::clone(&receiver)));
        }
        ThreadPool { workers, sender: Some(sender) }
    }

    pub fn execute<F>(&self, f: F)
    where
        F: FnOnce() + Send + 'static,
    {
        self.sender.as_ref().unwrap().send(Box::new(f)).unwrap();
    }
}

impl Drop for ThreadPool {
    fn drop(&mut self) {
        drop(self.sender.take());
        for worker in self.workers.drain(..) {
            worker.thread.join().unwrap();
        }
    }
}

struct Worker {
    id: usize,
    thread: thread::JoinHandle<()>,
}

impl Worker {
    fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {
        let thread = thread::spawn(move || loop {
            let message = receiver.lock().unwrap().recv();
            match message {
                Ok(job) => job(),
                Err(_) => break,
            }
        });
        Worker { id, thread }
    }
}

/// The status line and file for a request line. /sleep waits 300 ms first.
fn route(request_line: &str) -> (&'static str, &'static str) {
    match request_line {
        "GET / HTTP/1.1" => ("HTTP/1.1 200 OK", "hello.html"),
        "GET /sleep HTTP/1.1" => {
            thread::sleep(Duration::from_millis(300));
            ("HTTP/1.1 200 OK", "hello.html")
        }
        _ => ("HTTP/1.1 404 NOT FOUND", "404.html"),
    }
}

/// Answer one browser.
fn handle_connection(mut stream: TcpStream) {
    let request_line = match BufReader::new(&stream).lines().next() {
        Some(Ok(line)) => line,
        _ => return,
    };
    let (status_line, filename) = route(&request_line);
    let contents = fs::read_to_string(filename).unwrap();
    let length = contents.len();
    let response = format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}");
    stream.write_all(response.as_bytes()).unwrap();
}

/// Answer the first `max_requests` connections with `workers` threads,
/// then shut down cleanly.
pub fn serve(listener: TcpListener, workers: usize, max_requests: usize) {
    let pool = ThreadPool::new(workers);
    for stream in listener.incoming().take(max_requests) {
        let stream = stream.unwrap();
        pool.execute(|| handle_connection(stream));
    }
}

fn main() {
    let listener = TcpListener::bind("127.0.0.1:0").unwrap();
    let address = listener.local_addr().unwrap();
    println!("Listening on http://{address}");
    let server = thread::spawn(move || serve(listener, 4, 1));

    // A pretend browser asks for the home page.
    let mut browser = TcpStream::connect(address).unwrap();
    browser.write_all(b"GET / HTTP/1.1\r\n\r\n").unwrap();
    let mut page = String::new();
    std::io::Read::read_to_string(&mut browser, &mut page).unwrap();
    println!("{page}");

    server.join().unwrap();
    println!("Shutting down.");
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;
    use std::io::Read;
    use std::net::SocketAddr;
    use std::time::Instant;

    fn start(workers: usize, max_requests: usize) -> (SocketAddr, thread::JoinHandle<()>) {
        let listener = TcpListener::bind("127.0.0.1:0").unwrap();
        let address = listener.local_addr().unwrap();
        let server = thread::spawn(move || serve(listener, workers, max_requests));
        (address, server)
    }

    fn get(address: SocketAddr, path: &str) -> String {
        let mut browser = TcpStream::connect(address).unwrap();
        browser.set_read_timeout(Some(Duration::from_secs(3))).unwrap();
        browser
            .write_all(format!("GET {path} HTTP/1.1\r\nHost: citadel\r\n\r\n").as_bytes())
            .unwrap();
        let mut page = String::new();
        browser.read_to_string(&mut page).unwrap();
        page
    }

    fn expected(status: &str, file: &str) -> String {
        let contents = fs::read_to_string(file).unwrap();
        format!("{status}\r\nContent-Length: {}\r\n\r\n{contents}", contents.len())
    }

    #[test]
    #[should_panic]
    fn a_pool_needs_workers() {
        ThreadPool::new(0);
    }

    #[test]
    fn routes() {
        let (address, server) = start(2, 2);
        assert_eq!(get(address, "/"), expected("HTTP/1.1 200 OK", "hello.html"));
        assert_eq!(get(address, "/vault"), expected("HTTP/1.1 404 NOT FOUND", "404.html"));
        server.join().unwrap();
    }

    #[test]
    fn slow_pages_dont_block_fast_ones() {
        let (address, server) = start(4, 4);
        let sleepers: Vec<_> = (0..3).map(|_| thread::spawn(move || get(address, "/sleep"))).collect();
        thread::sleep(Duration::from_millis(50));
        let start = Instant::now();
        let home = get(address, "/");
        let took = start.elapsed();
        assert_eq!(home, expected("HTTP/1.1 200 OK", "hello.html"));
        assert!(took < Duration::from_millis(200), "/ took {took:?}: it waited for the slow pages");
        for s in sleepers {
            assert_eq!(s.join().unwrap(), expected("HTTP/1.1 200 OK", "hello.html"));
        }
        server.join().unwrap();
    }

    #[test]
    fn graceful_shutdown() {
        let (address, server) = start(2, 2);
        let a = thread::spawn(move || get(address, "/sleep"));
        let b = thread::spawn(move || get(address, "/sleep"));
        let start = Instant::now();
        server.join().unwrap();
        assert!(
            start.elapsed() >= Duration::from_millis(250),
            "serve returned before the slow requests were answered"
        );
        assert!(a.join().unwrap().starts_with("HTTP/1.1 200 OK"));
        assert!(b.join().unwrap().starts_with("HTTP/1.1 200 OK"));
    }
}
