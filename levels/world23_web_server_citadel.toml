solution = '''
use std::fs;
use std::io::{BufRead, BufReader, Read, Write};
use std::net::{TcpListener, TcpStream};
use std::thread;

/// A full HTTP response: status line, Content-Length header, empty line, body.
fn response(status_line: &str, contents: &str) -> String {
    let length = contents.len();
    format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}")
}

/// Which status line and file answer this request line.
fn route(request_line: &str) -> (&'static str, &'static str) {
    if request_line == "GET / HTTP/1.1" {
        ("HTTP/1.1 200 OK", "hello.html")
    } else {
        ("HTTP/1.1 404 NOT FOUND", "404.html")
    }
}

/// Read the request line, pick the page, and send the response.
fn handle_connection(mut stream: TcpStream) {
    let request_line = BufReader::new(&stream).lines().next().unwrap().unwrap();
    let (status_line, filename) = route(&request_line);
    let contents = fs::read_to_string(filename).unwrap();
    stream.write_all(response(status_line, &contents).as_bytes()).unwrap();
}

fn main() {
    let listener = TcpListener::bind("127.0.0.1:0").unwrap();
    let address = listener.local_addr().unwrap();
    thread::spawn(move || {
        let (stream, _) = listener.accept().unwrap();
        handle_connection(stream);
    });

    let mut browser = TcpStream::connect(address).unwrap();
    browser.write_all(b"GET / HTTP/1.1\r\n\r\n").unwrap();
    let mut page = String::new();
    browser.read_to_string(&mut page).unwrap();
    println!("{page}");
}
'''
