id = "23.3"
title = "The slow customer"
kind = "quiz"
book = ["21.2"]
xp = 20
goal = "The server handles one connection at a time. Someone opens /sleep, which takes 5 seconds; a moment later, you open /. How long do you wait?"
lesson = '''
Our server handles connections in a simple loop:

```rust
for stream in listener.incoming() {
    handle_connection(stream.unwrap());   // must finish before the next one starts
}
```

Let's add a slow page, to stand in for any request that takes a while:

```rust
match &request_line[..] {
    "GET / HTTP/1.1" => ("HTTP/1.1 200 OK", "hello.html"),
    "GET /sleep HTTP/1.1" => {
        thread::sleep(Duration::from_secs(5));
        ("HTTP/1.1 200 OK", "hello.html")
    }
    _ => ("HTTP/1.1 404 NOT FOUND", "404.html"),
}
```

Then open `/sleep` in one browser tab, and `/` in another right after.

Ways out, from the book:

- **A thread per request**: simple, but a flood of requests creates a flood of threads and can bring the server down.
- **A thread pool**: a fixed number of worker threads wait for jobs. Requests queue up, and up to N are handled at once. That's what we'll build.
- Others: fork/join, single-threaded async I/O, multithreaded async I/O (Chapter 17).
'''
c_compare = '''
The classic iterative server from network programming books, before you add `fork()` or `pthread_create` per connection, or a worker pool.
'''
py_compare = '''
Like Python's plain `socketserver.TCPServer`, which handles one request at a time, versus `ThreadingTCPServer`.
'''
choices = [
    "Almost no time: the two requests don't affect each other",
    "About 5 seconds: / waits in line until /sleep has been answered",
    "About 10 seconds: each request now takes 5 seconds",
    "Forever: the server deadlocks",
]
answer = 1
explanation = "The loop handles one connection at a time. Your `/` request waits in the listener's queue until `/sleep` finishes its 5 seconds, and is then answered right away. One slow request blocks everyone behind it."

[[level]]
id = "23.4"
title = "Hiring workers"
kind = "fill"
book = ["21.2"]
xp = 70
goal = "Build a ThreadPool: a fixed number of worker threads that take jobs from a shared channel and run them."
lesson = '''
A **thread pool** starts its threads once, up front. Each **worker** waits for a job, runs it, and waits for the next.

```rust
let pool = ThreadPool::new(4);
for stream in listener.incoming() {
    let stream = stream.unwrap();
    pool.execute(|| handle_connection(stream));
}
```

How it fits together:

```text
              execute(job)
ThreadPool ───── sender ─────> channel ──> Arc<Mutex<Receiver>>
                                              │       │       │
                                          Worker 0 Worker 1 Worker 2
```

- A **job** is a closure, boxed so different closures fit in one channel: `type Job = Box<dyn FnOnce() + Send + 'static>;`. `FnOnce`: it runs once. `Send`: it moves to another thread. `'static`: it may not borrow anything temporary.
- There's only **one** receiver, shared by all workers: `Arc<Mutex<mpsc::Receiver<Job>>>`. A worker locks it to take the next job.
- **`execute`** boxes the closure and sends it.

Each worker's thread loops forever:

```rust
let thread = thread::spawn(move || loop {
    let job = receiver.lock().unwrap().recv().unwrap();
    job();
});
```

Careful: `let job = ...;` releases the lock at the end of that statement, **before** the job runs, so other workers can take jobs meanwhile.

`ThreadPool::new(0)` makes no sense, so it should panic (with `assert!`).
'''
c_compare = '''
The classic pthreads worker pool: a queue protected by a mutex, and workers that block on it. The channel replaces the queue and condition variable.
'''
py_compare = '''
This is what `concurrent.futures.ThreadPoolExecutor` does inside: a fixed set of threads taking callables from a shared queue.
'''
check = "tests"
