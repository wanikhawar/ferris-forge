lesson = '''
**Final boss!** Everything from this island, in one program.

1. **`ThreadPool`**: `new` (panics on 0), `execute`, and a `Drop` that closes the channel and joins every worker.
2. **`route(request_line)`** → `(status line, file name)`:
   - `GET / HTTP/1.1` → `HTTP/1.1 200 OK`, `hello.html`
   - `GET /sleep HTTP/1.1` → the same, but **sleep 300 ms first** (a slow page)
   - anything else → `HTTP/1.1 404 NOT FOUND`, `404.html`
3. **`handle_connection(stream)`**: read the request line, route it, read the file, and write the response (status line, `Content-Length`, empty line, body).
4. **`serve(listener, workers, max_requests)`**: make a pool, hand each of the first `max_requests` connections to it (`listener.incoming().take(n)`), and then return, after **every** request has been answered. (That's the pool's Drop, at the end of the function.)

The tests act as browsers. While three `/sleep` requests are being handled, a request for `/` must be answered right away, and `serve` must not return until every answer has been sent.

When it all passes, you've built a real web server from scratch, with only the standard library. You're a Rustacean! 🦀
'''
