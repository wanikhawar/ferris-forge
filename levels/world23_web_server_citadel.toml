use std::io::{BufRead, BufReader, Write};
use std::net::{TcpListener, TcpStream};
use std::thread;

/// Every line of the HTTP request, up to (not including) the empty line that ends it.
fn read_request(stream: &TcpStream) -> Vec<String> {
    BufReader::new(stream)
        .lines()
        .map(|result| result.unwrap())
        .take_while(|line| !line.is_empty())
        .collect()
}

/// Wait for one connection and return its request lines.
fn accept_one(listener: &TcpListener) -> Vec<String> {
    let (stream, _address) = listener.accept().unwrap();
    read_request(&stream)
}

fn main() {
    let listener = TcpListener::bind("127.0.0.1:0").unwrap();
    let address = listener.local_addr().unwrap();

    // A pretend browser.
    thread::spawn(move || {
        let mut browser = TcpStream::connect(address).unwrap();
        browser.write_all(b"GET / HTTP/1.1\r\nHost: citadel\r\n\r\n").unwrap();
    });

    println!("{:#?}", accept_one(&listener));
}
'''
