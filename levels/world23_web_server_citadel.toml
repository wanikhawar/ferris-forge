lesson = '''
An HTTP **response** looks like this:

```text
HTTP/1.1 200 OK\r\n                    <- status line
Content-Length: 120\r\n                <- headers
\r\n                                   <- empty line
<!DOCTYPE html>...                     <- the body
```

Lines end with `\r\n` (carriage return + line feed). `Content-Length` is the size of the body **in bytes**, so the browser knows where it ends.

```rust
let status_line = "HTTP/1.1 200 OK";
let contents = fs::read_to_string("hello.html").unwrap();
let length = contents.len();

let response = format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}");
stream.write_all(response.as_bytes()).unwrap();
```

**Routing**: look at the first line of the request to choose what to send back. Only the exact request `GET / HTTP/1.1` gets the home page; anything else gets a "404 not found" page:

```rust
let (status_line, filename) = if request_line == "GET / HTTP/1.1" {
    ("HTTP/1.1 200 OK", "hello.html")
} else {
    ("HTTP/1.1 404 NOT FOUND", "404.html")
};
```

`hello.html` and `404.html` are next to your program.
'''
