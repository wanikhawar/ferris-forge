            pool.execute(move || {
                thread::sleep(Duration::from_millis(50));
                done.fetch_add(1, Ordering::SeqCst);
            });
        }
        drop(pool);
        assert_eq!(done.load(Ordering::SeqCst), 6, "dropping the pool must wait for every job");
    }

    #[test]
    fn workers_really_stop() {
        let pool = ThreadPool::new(2);
        let (tx, rx) = mpsc::channel();
        let handle = thread::spawn(move || {
            drop(pool);
            tx.send(()).unwrap();
        });
        rx.recv_timeout(Duration::from_secs(2))
            .expect("drop never finished: do the workers know when to stop?");
        handle.join().unwrap();
    }
