    "share: make `n` clones and collect them, for example `(0..n).map(|_| Rc::clone(map)).collect()`. prepend: `Cons(value, Rc::clone(tail))`.",
    "```rust\nfn share(map: &Rc<String>, n: usize) -> Vec<Rc<String>> {\n    (0..n).map(|_| Rc::clone(map)).collect()\n}\n\nfn owners(map: &Rc<String>) -> usize {\n    Rc::strong_count(map)\n}\n\nfn prepend(value: i32, tail: &Rc<List>) -> List {\n    Cons(value, Rc::clone(tail))\n}\n```",
]

[[level]]
id = "17.5"
title = "Change it anyway: RefCell"
kind = "fix"
book = ["15.5"]
xp = 55
goal = "The fake messenger in the tests needs to record messages through a &self method. Fix it with RefCell, and fix the shared bank account too."
lesson = '''
Sometimes a value must be changed through a shared `&` reference. The classic case: a **mock** object in a test. The trait says `fn send(&self, msg: &str)`, but the mock wants to record every message in a Vec, which means changing itself.

**`RefCell<T>`** allows this. It moves the borrowing rules from compile time to **run time**:

```rust
use std::cell::RefCell;

struct MockMessenger {
    sent: RefCell<Vec<String>>,
}

impl Messenger for MockMessenger {
    fn send(&self, msg: &str) {
        self.sent.borrow_mut().push(String::from(msg));   // fine through &self
    }
}

// later: mock.sent.borrow().len()
```

| Method | Gives | Like |
|---|---|---|
| `.borrow()` | `Ref<T>` | `&T` |
| `.borrow_mut()` | `RefMut<T>` | `&mut T` |

The rules are the same (many readers **or** one writer), but they're checked while the program runs. Break them, and it **panics** with `already borrowed`. This is called **interior mutability**.

Combine it with `Rc` to get data with **several owners that can all change it**:

```rust
let account = Rc::new(RefCell::new(100));
let partner = Rc::clone(&account);
*partner.borrow_mut() += 50;     // account sees 150 too
```
'''
c_compare = '''
A bit like casting away `const`, but safe: instead of trusting you, the RefCell keeps a borrow count and panics if two writers would ever overlap.
'''
py_compare = '''
In Python, any method can change `self`. Rust needs `&mut self` for that, unless the field is a RefCell that checks the rules at runtime.
'''
check = "tests"
starter = '''
use std::cell::RefCell;
use std::rc::Rc;

pub trait Messenger {
    fn send(&self, msg: &str);
}

pub struct LimitTracker<'a, T: Messenger> {
    messenger: &'a T,
    value: usize,
    max: usize,
}

impl<'a, T: Messenger> LimitTracker<'a, T> {
    pub fn new(messenger: &'a T, max: usize) -> LimitTracker<'a, T> {
        LimitTracker { messenger, value: 0, max }
    }

    pub fn set_value(&mut self, value: usize) {
        self.value = value;
        let percent = self.value as f64 / self.max as f64;
        if percent >= 1.0 {
            self.messenger.send("Error: You are over your quota!");
        } else if percent >= 0.9 {
            self.messenger.send("Urgent warning: You've used up over 90% of your quota!");
        } else if percent >= 0.75 {
            self.messenger.send("Warning: You've used up over 75% of your quota!");
        }
    }
}

/// A fake messenger for the tests: it just remembers what was sent.
pub struct MockMessenger {
    pub sent_messages: Vec<String>,
}

impl MockMessenger {
    pub fn new() -> MockMessenger {
        MockMessenger { sent_messages: vec![] }
    }
}

impl Messenger for MockMessenger {
    fn send(&self, message: &str) {
        self.sent_messages.push(String::from(message));
    }
}

/// Two partners share one bank account. Both can pay in.
pub fn joint_account(start: i32) -> (Rc<i32>, Rc<i32>) {
    let account = Rc::new(start);
    let partner = Rc::clone(&account);
    (account, partner)
}

pub fn deposit(account: &Rc<i32>, amount: i32) {
    *account += amount;
}

fn main() {
    let mock = MockMessenger::new();
    let mut tracker = LimitTracker::new(&mock, 100);
    tracker.set_value(80);
    println!("{:?}", mock.sent_messages);
}
'''
solution = '''
use std::cell::RefCell;
use std::rc::Rc;

pub trait Messenger {
    fn send(&self, msg: &str);
}

pub struct LimitTracker<'a, T: Messenger> {
    messenger: &'a T,
    value: usize,
    max: usize,
}

impl<'a, T: Messenger> LimitTracker<'a, T> {
    pub fn new(messenger: &'a T, max: usize) -> LimitTracker<'a, T> {
        LimitTracker { messenger, value: 0, max }
    }

    pub fn set_value(&mut self, value: usize) {
        self.value = value;
        let percent = self.value as f64 / self.max as f64;
        if percent >= 1.0 {
            self.messenger.send("Error: You are over your quota!");
        } else if percent >= 0.9 {
            self.messenger.send("Urgent warning: You've used up over 90% of your quota!");
        } else if percent >= 0.75 {
            self.messenger.send("Warning: You've used up over 75% of your quota!");
        }
    }
}

/// A fake messenger for the tests: it just remembers what was sent.
pub struct MockMessenger {
    pub sent_messages: RefCell<Vec<String>>,
}

impl MockMessenger {
    pub fn new() -> MockMessenger {
        MockMessenger { sent_messages: RefCell::new(vec![]) }
    }
}

impl Messenger for MockMessenger {
    fn send(&self, message: &str) {
        self.sent_messages.borrow_mut().push(String::from(message));
    }
}

/// Two partners share one bank account. Both can pay in.
pub fn joint_account(start: i32) -> (Rc<RefCell<i32>>, Rc<RefCell<i32>>) {
    let account = Rc::new(RefCell::new(start));
    let partner = Rc::clone(&account);
    (account, partner)
}

pub fn deposit(account: &Rc<RefCell<i32>>, amount: i32) {
    *account.borrow_mut() += amount;
}

fn main() {
    let mock = MockMessenger::new();
    let mut tracker = LimitTracker::new(&mock, 100);
    tracker.set_value(80);
    println!("{:?}", mock.sent_messages.borrow());
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    #[test]
    fn sends_an_over_75_percent_warning() {
        let mock = MockMessenger::new();
        let mut tracker = LimitTracker::new(&mock, 100);
        tracker.set_value(80);
        assert_eq!(mock.sent_messages.borrow().len(), 1);
        assert!(mock.sent_messages.borrow()[0].contains("75%"));
    }

    #[test]
    fn no_message_when_low() {
        let mock = MockMessenger::new();
        let mut tracker = LimitTracker::new(&mock, 100);
        tracker.set_value(10);
        assert!(mock.sent_messages.borrow().is_empty());
    }

    #[test]
    fn partners_share_the_money() {
        let (mine, theirs) = joint_account(100);
        deposit(&mine, 20);
        deposit(&theirs, 30);
        assert_eq!(*mine.borrow(), 150);
        assert_eq!(*theirs.borrow(), 150);
    }
}
'''
hints = [
    "`send` only gets `&self`, so `sent_messages` can't be pushed to. Wrap the Vec in a `RefCell`. The account has the same problem: an `Rc<i32>` is read-only.",
    "Field type `RefCell<Vec<String>>`, made with `RefCell::new(vec![])`, and push with `self.sent_messages.borrow_mut().push(...)`. For the account, use `Rc<RefCell<i32>>` everywhere and add with `*account.borrow_mut() += amount`. (main then prints `mock.sent_messages.borrow()`.)",
    "```rust\npub struct MockMessenger {\n    pub sent_messages: RefCell<Vec<String>>,\n}\n\nfn send(&self, message: &str) {\n    self.sent_messages.borrow_mut().push(String::from(message));\n}\n\npub fn joint_account(start: i32) -> (Rc<RefCell<i32>>, Rc<RefCell<i32>>) {\n    let account = Rc::new(RefCell::new(start));\n    let partner = Rc::clone(&account);\n    (account, partner)\n}\n\npub fn deposit(account: &Rc<RefCell<i32>>, amount: i32) {\n    *account.borrow_mut() += amount;\n}\n```",
]

[[level]]
id = "17.6"
title = "Round and round"
kind = "predict"
book = ["15.6"]
xp = 30
goal = "A Weak pointer watches the treasure. What does it see before and after the treasure is dropped?"
lesson = '''
`Rc` frees a value when its count reaches zero. But what if two values point at **each other** with `Rc`?

```text
a ──Rc──> b
^         │
└───Rc────┘
```

Each keeps the other's count above zero, so neither is ever freed: a **memory leak**. Rust's safety rules don't prevent leaks (leaking isn't undefined behavior), so you have to design them away.

The tool for that is **`Weak<T>`**: a pointer that **doesn't own** the value and doesn't keep it alive.

```rust
use std::rc::{Rc, Weak};

let strong = Rc::new(5);
let weak: Weak<i32> = Rc::downgrade(&strong);   // weak count + 1, strong count unchanged

match weak.upgrade() {          // Option<Rc<i32>>
    Some(rc) => println!("still here: {rc}"),
    None => println!("it's gone"),
}
```

Because the value might already be gone, `upgrade` returns an `Option`. Use `Rc` for "owns", and `Weak` for "knows about", like a child pointing back at its parent.
'''
c_compare = '''
Like a pointer that knows when its target has been freed: instead of dangling, `upgrade()` just returns None.
'''
py_compare = '''
The same idea as Python's `weakref.ref(obj)`, which returns None once the object is gone.
'''
starter = '''
use std::rc::{Rc, Weak};

fn main() {
    let treasure = Rc::new(String::from("gold"));
    let watcher: Weak<String> = Rc::downgrade(&treasure);

    println!("strong {} weak {}", Rc::strong_count(&treasure), Rc::weak_count(&treasure));
    println!("{:?}", watcher.upgrade());

    drop(treasure);
    println!("{:?}", watcher.upgrade());
}
'''
choices = [
    "strong 2 weak 0 / Some(\"gold\") / Some(\"gold\")",
    "strong 1 weak 1 / Some(\"gold\") / Some(\"gold\")",
    "strong 1 weak 1 / Some(\"gold\") / None",
    "It doesn't compile: treasure is dropped while watcher still points to it",
]
answer = 2
expected_output = '''
strong 1 weak 1
Some("gold")
None
'''
explanation = "`Rc::downgrade` adds a weak reference, not an owner, so the counts are 1 and 1. Dropping `treasure` removes the only owner, so the String is freed even though `watcher` still exists, and `upgrade()` now returns `None`."

[[level]]
id = "17.7"
title = "BOSS: The family tree"
kind = "boss"
book = ["15.1", "15.4", "15.5", "15.6"]
xp = 120
goal = '''Build a tree where parents own their children (Rc) and children know their parent (Weak),
without any memory leaks.'''
lesson = '''
**Boss fight!** A tree where you can walk **down** (parent to children) and **up** (child to parent).

```rust
struct Node {
    value: i32,
    parent: RefCell<Weak<Node>>,
    children: RefCell<Vec<Rc<Node>>>,
}
```

Why each piece:

- **`Rc<Node>`**: a node can be owned by its parent and by your variables at the same time.
- **`children: Vec<Rc<Node>>`**: a parent **owns** its children.
- **`parent: Weak<Node>`**: a child only **knows** its parent. If it owned it, parent and child would keep each other alive forever.
- **`RefCell`** around both: we change the links after the nodes are made, through shared `Rc`s.

Write:

1. `Node::new(value)` → an `Rc<Node>` with no parent and no children (`Weak::new()` is an empty Weak).
2. `add_child(parent, child)`: set the child's parent (`Rc::downgrade`) and push the child into the parent's children.
3. `parent_value(node)` → the parent's value, or `None` for the root.
4. `ancestors(node)` → the values of the parent, grandparent, ... up to the root.
5. `total(node)` → the sum of a node's value and all its descendants'.

The tests also check the counts: adding a child must not add a **strong** owner to the parent.
