solution = '''
use std::cell::RefCell;
use std::rc::{Rc, Weak};

#[derive(Debug)]
struct Node {
    value: i32,
    parent: RefCell<Weak<Node>>,
    children: RefCell<Vec<Rc<Node>>>,
}

impl Node {
    fn new(value: i32) -> Rc<Node> {
        Rc::new(Node {
            value,
            parent: RefCell::new(Weak::new()),
            children: RefCell::new(vec![]),
        })
    }
}

/// Make `child` a child of `parent`, and `parent` the parent of `child`.
fn add_child(parent: &Rc<Node>, child: Rc<Node>) {
    *child.parent.borrow_mut() = Rc::downgrade(parent);
    parent.children.borrow_mut().push(child);
}

/// The value of this node's parent, if it has one.
fn parent_value(node: &Node) -> Option<i32> {
    node.parent.borrow().upgrade().map(|p| p.value)
}

/// The values from the parent up to the root: [parent, grandparent, ...].
fn ancestors(node: &Node) -> Vec<i32> {
    let mut values = Vec::new();
    let mut current = node.parent.borrow().upgrade();
    while let Some(p) = current {
        values.push(p.value);
        current = p.parent.borrow().upgrade();
    }
    values
}

/// This node's value plus the values of all its children, grandchildren, ...
fn total(node: &Node) -> i32 {
    node.value + node.children.borrow().iter().map(|c| total(c)).sum::<i32>()
}

fn main() {
    let grandma = Node::new(1);
    let mom = Node::new(2);
    let me = Node::new(3);
    add_child(&grandma, Rc::clone(&mom));
    add_child(&mom, Rc::clone(&me));
    println!("my ancestors: {:?}", ancestors(&me));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    #[test]
    fn a_new_node_is_alone() {
        let n = Node::new(7);
        assert_eq!(n.value, 7);
        assert_eq!(parent_value(&n), None);
        assert!(n.children.borrow().is_empty());
        assert!(ancestors(&n).is_empty());
    }

    #[test]
    fn three_generations() {
        let grandma = Node::new(1);
        let mom = Node::new(2);
        let aunt = Node::new(4);
        let me = Node::new(3);
        add_child(&grandma, Rc::clone(&mom));
        add_child(&grandma, Rc::clone(&aunt));
        add_child(&mom, Rc::clone(&me));

        assert_eq!(parent_value(&me), Some(2));
        assert_eq!(parent_value(&aunt), Some(1));
        assert_eq!(ancestors(&me), vec![2, 1]);
        assert_eq!(grandma.children.borrow().len(), 2);
        assert_eq!(total(&grandma), 10);
        assert_eq!(total(&mom), 5);
    }

    #[test]
    fn no_cycles() {
        let parent = Node::new(1);
        let child = Node::new(2);
        add_child(&parent, Rc::clone(&child));
        assert_eq!(Rc::strong_count(&parent), 1, "children must not own their parent");
        assert_eq!(Rc::weak_count(&parent), 1, "the child should point back with a Weak");
        assert_eq!(Rc::strong_count(&child), 2, "owned by the parent and by `child`");
    }

    #[test]
    fn orphans_lose_their_parent() {
        let child = Node::new(2);
        {
            let parent = Node::new(1);
            add_child(&parent, Rc::clone(&child));
            assert_eq!(parent_value(&child), Some(1));
        }
        assert_eq!(parent_value(&child), None, "the parent was dropped");
    }
}
