[[level]]
id = "17.1"
title = "Box it up"
kind = "fill"
book = ["15.1"]
xp = 45
goal = "Make the trail list compile by boxing the rest of the list, then write sum and len."
lesson = '''
A **`Box<T>`** puts a value on the **heap** and keeps a small pointer to it on the stack:

```rust
let b = Box::new(5);
println!("b = {b}");    // a Box is used just like the value inside
```

When the Box goes out of scope, the value on the heap is freed too.

Boxes are essential for **recursive types**: types that contain themselves. Here's a list of numbers, where each item holds the rest of the list:

```rust
enum List {
    Cons(i32, List),   // error[E0072]: recursive type has infinite size
    Nil,
}
```

To know how big a `List` is, Rust needs to know how big a `List` is... forever. A `Box` breaks the loop, because a pointer always has the same size, however big the thing it points to:

```rust
enum List {
    Cons(i32, Box<List>),
    Nil,
}

use List::{Cons, Nil};
let list = Cons(1, Box::new(Cons(2, Box::new(Cons(3, Box::new(Nil))))));
```

Walking a list is a natural fit for recursion and `match`:

```rust
match self {
    Cons(value, rest) => ... rest.something() ...,
    Nil => ...,
}
```
'''
c_compare = '''
This is the classic linked list: `struct Node { int value; struct Node *next; }`. A Box is the `next` pointer, except it can never be dangling, and the memory is freed automatically.
'''
py_compare = '''
In Python, every object already lives on the heap behind a reference, so recursive classes just work. Rust stores values inline unless you ask for a Box.
'''
check = "tests"
starter = '''
#[derive(Debug)]
enum List {
    // TODO: this type is infinitely big. Box the rest of the list.
    Cons(i32, List),
    Nil,
}

use List::{Cons, Nil};

impl List {
    /// Adds up every number in the list.
    fn sum(&self) -> i32 {
        todo!()
    }

    /// How many numbers are in the list.
    fn len(&self) -> usize {
        todo!()
    }
}

fn main() {
    let trail = Cons(1, Box::new(Cons(2, Box::new(Cons(3, Box::new(Nil))))));
    println!("{trail:?} adds up to {}", trail.sum());
}
'''
solution = '''
#[derive(Debug)]
enum List {
    Cons(i32, Box<List>),
    Nil,
}

use List::{Cons, Nil};

impl List {
    /// Adds up every number in the list.
    fn sum(&self) -> i32 {
        match self {
            Cons(value, rest) => value + rest.sum(),
            Nil => 0,
        }
    }

    /// How many numbers are in the list.
    fn len(&self) -> usize {
        match self {
            Cons(_, rest) => 1 + rest.len(),
            Nil => 0,
        }
    }
}

fn main() {
    let trail = Cons(1, Box::new(Cons(2, Box::new(Cons(3, Box::new(Nil))))));
    println!("{trail:?} adds up to {}", trail.sum());
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    #[test]
    fn sums_and_lengths() {
        let list = Cons(1, Box::new(Cons(2, Box::new(Cons(3, Box::new(Nil))))));
        assert_eq!(list.sum(), 6);
        assert_eq!(list.len(), 3);
        assert_eq!(Nil.sum(), 0);
        assert_eq!(Nil.len(), 0);
    }

    #[test]
    fn a_long_trail() {
        let mut list = Nil;
        for n in 1..=100 {
            list = Cons(n, Box::new(list));
        }
        assert_eq!(list.sum(), 5050);
        assert_eq!(list.len(), 100);
    }
}
'''
hints = [
    "First the type: `Cons(i32, Box<List>)`. Then sum and len are both a `match self` with a `Cons` arm and a `Nil` arm.",
    "In the Cons arm, the Box can be used like the List inside it: `rest.sum()` works directly. sum is `value + rest.sum()`, and len is `1 + rest.len()`. Nil gives 0.",
    "```rust\nfn sum(&self) -> i32 {\n    match self {\n        Cons(value, rest) => value + rest.sum(),\n        Nil => 0,\n    }\n}\n\nfn len(&self) -> usize {\n    match self {\n        Cons(_, rest) => 1 + rest.len(),\n        Nil => 0,\n    }\n}\n```",
]

[[level]]
id = "17.2"
title = "Act like a reference"
kind = "predict"
book = ["15.2"]
xp = 25
goal = "MyBox prints a line every time it is dereferenced. What does this print?"
lesson = '''
What makes a smart pointer act like a reference? The **`Deref`** trait. Implement it, and `*` works on your type:

```rust
use std::ops::Deref;

struct MyBox<T>(T);

impl<T> Deref for MyBox<T> {
    type Target = T;
    fn deref(&self) -> &T {
        &self.0
    }
}
```

Writing `*y` on a `MyBox` really means `*(y.deref())`.

Rust also does **deref coercion**: when you pass `&MyBox<String>` where a `&str` is wanted, it calls `deref` as many times as needed:

```text
&MyBox<String>  --MyBox's deref-->  &String  --String's deref-->  &str
```

That's why you can pass `&String` to a function that takes `&str`. It all happens at compile time, so it costs nothing while the program runs.

(There's also `DerefMut` for `&mut`, used the same way.)
'''
c_compare = '''
Like overloading `operator*` in C++. C has no way to make your own pointer types act like real pointers.
'''
py_compare = '''
A bit like a proxy object that forwards to the value it wraps, but resolved by the compiler, not at runtime.
'''
starter = '''
use std::ops::Deref;

struct MyBox<T>(T);

impl<T> MyBox<T> {
    fn new(x: T) -> MyBox<T> {
        MyBox(x)
    }
}

impl<T> Deref for MyBox<T> {
    type Target = T;

    fn deref(&self) -> &T {
        println!("deref!");
        &self.0
    }
}

fn hello(name: &str) {
    println!("Hello, {name}!");
}

fn main() {
    let y = MyBox::new(5);
    println!("{}", *y + 1);

    let m = MyBox::new(String::from("Ferris"));
    hello(&m);
}
'''
choices = [
    "6 / Hello, Ferris!",
    "deref! / 6 / deref! / Hello, Ferris!",
    "deref! / 6 / deref! / deref! / Hello, Ferris!",
    "It doesn't compile: hello wants a &str, not a &MyBox<String>",
]
answer = 1
expected_output = '''
deref!
6
deref!
Hello, Ferris!
'''
explanation = "`*y` calls MyBox's `deref` once, so `deref!` prints before `6`. For `hello(&m)`, deref coercion turns `&MyBox<String>` into `&String` (MyBox's deref, printing once more) and then into `&str` using String's own deref, which prints nothing."

[[level]]
id = "17.3"
title = "Cleaning up: Drop"
kind = "predict"
book = ["15.3"]
xp = 25
goal = "Each flag announces when it's lowered. In what order do the lines print?"
lesson = '''
The **`Drop`** trait lets you run code when a value goes out of scope:

```rust
impl Drop for Flag {
    fn drop(&mut self) {
        println!("lowering {}", self.0);
    }
}
```

Rust calls `drop` for you, automatically:

- at the end of the scope (the closing `}`) where the value lives,
- in **reverse order** of creation: the last variable made is the first one dropped.

You may **not** call `x.drop()` yourself (error E0040), because Rust would then drop it a second time at the end of the scope. To get rid of a value early, call **`std::mem::drop(x)`** (just `drop(x)`, it's in the prelude): it takes ownership, so the value can't be used again.

This is how `Box` frees memory, how files close, and how locks unlock.
'''
c_compare = '''
Like C++ destructors (RAII). In C you'd call `free` or `fclose` yourself, and forgetting it is a leak.
'''
py_compare = '''
Similar to `__del__` or a `with` block's `__exit__`, but it runs at a known moment, exactly when the scope ends.
'''
starter = '''
struct Flag(&'static str);

impl Drop for Flag {
    fn drop(&mut self) {
        println!("lowering {}", self.0);
    }
}

fn main() {
    let _red = Flag("red");
    let blue = Flag("blue");
    {
        let _green = Flag("green");
        println!("inner done");
    }
    drop(blue);
    println!("end of main");
}
'''
choices = [
    "inner done / end of main / lowering red / lowering blue / lowering green",
    "inner done / lowering green / lowering blue / end of main / lowering red",
    "inner done / lowering green / end of main / lowering blue / lowering red",
    "It doesn't compile: you can't call drop yourself",
]
answer = 1
expected_output = '''
inner done
lowering green
lowering blue
end of main
lowering red
'''
explanation = "`green` is dropped at the end of its inner block. `drop(blue)` lowers blue right away (calling `std::mem::drop` is allowed; only `blue.drop()` isn't). `red` lives until the end of `main`."

[[level]]
id = "17.4"
title = "Shared treasure: Rc"
kind = "fill"
book = ["15.4"]
xp = 50
goal = "Share one map between several owners with Rc, and build two lists that share the same tail."
lesson = '''
Normally every value has exactly **one** owner. But sometimes data really has several: think of a node in a graph that many edges point to. Who should free it?

**`Rc<T>`** (reference counted) allows several owners. It counts them, and frees the value when the last owner is gone:

```rust
use std::rc::Rc;

let a = Rc::new(String::from("map"));
let b = Rc::clone(&a);               // a second owner: count is 2
println!("{}", Rc::strong_count(&a));  // 2
```

`Rc::clone` doesn't copy the data: it just adds one to the count. That's why the convention is `Rc::clone(&a)` rather than `a.clone()`: it makes the cheap clones easy to tell apart from expensive deep copies.

Two lists that share a tail:

```text
b: 3 ─┐
      ├─> a: 5 -> 10 -> Nil
c: 4 ─┘
```

```rust
enum List {
    Cons(i32, Rc<List>),
    Nil,
}
```

An `Rc` gives **shared (read-only)** access to the value. It's also only for one thread. (The next levels deal with both.)
'''
c_compare = '''
Manual reference counting, like `retain`/`release`, but the count goes up and down by itself, so you can't forget either one.
'''
py_compare = '''
Python counts references on every object automatically (`sys.getrefcount`). In Rust you opt into counting only where you need it.
'''
check = "tests"
starter = '''
use std::rc::Rc;

/// Hand out `n` more owners of the same map (don't copy the String!).
fn share(map: &Rc<String>, n: usize) -> Vec<Rc<String>> {
    todo!()
}

/// How many owners the map has right now.
fn owners(map: &Rc<String>) -> usize {
    todo!()
}

#[derive(Debug)]
