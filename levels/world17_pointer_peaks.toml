    Cons(i32, Rc<List>),
    Nil,
}

use List::{Cons, Nil};

/// A new list: `value`, followed by the shared `tail`.
fn prepend(value: i32, tail: &Rc<List>) -> List {
    todo!()
}

fn sum(list: &List) -> i32 {
    match list {
        Cons(value, rest) => value + sum(rest),
        Nil => 0,
    }
}

fn main() {
    let map = Rc::new(String::from("X marks the spot"));
    let copies = share(&map, 2);
    println!("{} owners of {}", owners(&map), copies[0]);
}
'''
solution = '''
use std::rc::Rc;

/// Hand out `n` more owners of the same map (don't copy the String!).
fn share(map: &Rc<String>, n: usize) -> Vec<Rc<String>> {
    (0..n).map(|_| Rc::clone(map)).collect()
}

/// How many owners the map has right now.
fn owners(map: &Rc<String>) -> usize {
    Rc::strong_count(map)
}

#[derive(Debug)]
enum List {
    Cons(i32, Rc<List>),
    Nil,
}

use List::{Cons, Nil};

/// A new list: `value`, followed by the shared `tail`.
fn prepend(value: i32, tail: &Rc<List>) -> List {
    Cons(value, Rc::clone(tail))
}

fn sum(list: &List) -> i32 {
    match list {
        Cons(value, rest) => value + sum(rest),
        Nil => 0,
    }
}

fn main() {
    let map = Rc::new(String::from("X marks the spot"));
    let copies = share(&map, 2);
    println!("{} owners of {}", owners(&map), copies[0]);
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    #[test]
    fn sharing_the_map() {
        let map = Rc::new(String::from("X marks the spot"));
        assert_eq!(owners(&map), 1);
        let copies = share(&map, 3);
        assert_eq!(copies.len(), 3);
        assert_eq!(owners(&map), 4);
        assert!(copies.iter().all(|c| Rc::ptr_eq(c, &map)), "the copies must be the same map, not new Strings");
        drop(copies);
        assert_eq!(owners(&map), 1);
    }

    #[test]
    fn shared_tails() {
        let a = Rc::new(Cons(5, Rc::new(Cons(10, Rc::new(Nil)))));
        let b = prepend(3, &a);
        let c = prepend(4, &a);
        assert_eq!(Rc::strong_count(&a), 3);
        assert_eq!(sum(&b), 18);
        assert_eq!(sum(&c), 19);
        drop(b);
        assert_eq!(Rc::strong_count(&a), 2);
    }
}
'''
hints = [
