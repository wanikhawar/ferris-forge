[[level]]
id = "19.5"
title = "Safe to send?"
kind = "predict"
book = ["16.4"]
xp = 30
goal = "Ten threads share a counter through an Rc. Does this compile? If so, what does it print?"
lesson = '''
How does Rust know that `Rc` can't go to another thread but `Arc` can? Two **marker traits**, with no methods at all:

| Trait | Means | Not for |
|---|---|---|
| **`Send`** | ownership can move to another thread | `Rc<T>` (two threads could change the count at once) |
| **`Sync`** | `&T` can be shared between threads | `RefCell<T>`, `Cell<T>` |

You almost never implement them. The compiler does it **automatically**: a type made only of `Send` parts is `Send`, and the same for `Sync`.

`thread::spawn` requires its closure (and everything it captures) to be `Send`. So if something unsafe to share slips into a thread, you get a **compile error**, not a rare bug that shows up once a week in production.

Implementing them by hand needs `unsafe`, because then *you* promise the compiler it's safe.
'''
c_compare = '''
In C, nothing stops you from passing a non-thread-safe struct to `pthread_create`. Rust checks every value that crosses into a thread.
'''
py_compare = '''
Python lets any object go to any thread and relies on the GIL. Rust checks at compile time that each type is safe to send or share.
'''
starter = '''
use std::rc::Rc;
use std::sync::Mutex;
use std::thread;

fn main() {
    let counter = Rc::new(Mutex::new(0));
    let mut handles = vec![];

    for _ in 0..10 {
        let counter = Rc::clone(&counter);
        let handle = thread::spawn(move || {
            *counter.lock().unwrap() += 1;
        });
        handles.push(handle);
    }

    for handle in handles {
        handle.join().unwrap();
    }
    println!("Result: {}", *counter.lock().unwrap());
}
'''
choices = [
    "Result: 10",
    "A number between 1 and 10: the threads race on the counter",
    "It doesn't compile: Rc<Mutex<i32>> cannot be sent between threads safely",
    "It doesn't compile: a Mutex can't be put inside an Rc",
]
answer = 2
compile_fails = true
explanation = "`Rc` is not `Send`: its reference count isn't updated atomically, so two threads cloning or dropping it at once could corrupt it. `thread::spawn` requires everything the closure captures to be `Send`, so this is error E0277. Swap `Rc` for `Arc` and it prints `Result: 10`."

[[level]]
id = "19.6"
title = "BOSS: The parallel downloader"
kind = "boss"
book = ["16.1", "16.2", "16.3"]
