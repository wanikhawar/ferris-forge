solution = '''
use std::thread;

/// Add up the first half on one new thread and the second half on another, then
/// combine the two results.
fn sum_in_halves(numbers: Vec<u64>) -> u64 {
    let middle = numbers.len() / 2;
    let first: Vec<u64> = numbers[..middle].to_vec();
    let second: Vec<u64> = numbers[middle..].to_vec();
    let a = thread::spawn(move || first.iter().sum::<u64>());
    let b = thread::spawn(move || second.iter().sum::<u64>());
    a.join().unwrap() + b.join().unwrap()
}

/// Start one thread per name. Each thread returns "Hello from <name>!".
/// Return the greetings in the same order as the names.
fn greet_all(names: Vec<String>) -> Vec<String> {
    let handles: Vec<_> = names
        .into_iter()
        .map(|name| thread::spawn(move || format!("Hello from {name}!")))
        .collect();
    handles.into_iter().map(|h| h.join().unwrap()).collect()
}

fn main() {
    println!("{}", sum_in_halves((1..=10).collect()));
}
'''
