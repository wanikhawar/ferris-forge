goal = "Send messages between threads through channels: one sender first, then several."
lesson = '''
> Do not communicate by sharing memory; instead, share memory by communicating.

A **channel** is a one-way pipe between threads. `mpsc` stands for *multiple producer, single consumer*: many senders, one receiver.

```rust
use std::sync::mpsc;

let (tx, rx) = mpsc::channel();

thread::spawn(move || {
    tx.send(String::from("hi")).unwrap();   // the String moves into the channel
});

let msg = rx.recv().unwrap();               // waits for a message
```

- `send` **moves** the value: the sending thread can't use it afterwards. No sharing, no races.
- `recv()` waits for the next message. It returns `Err` once **every sender is gone** and the channel is empty.
- The receiver is also an iterator: `for msg in rx { ... }` runs until all senders are dropped.

More producers? Clone the sender: `let tx2 = tx.clone();`.

⚠ A loop over `rx` only ends when **every** `tx` is dropped, including the original one in `main`. If you clone it for each thread, `drop(tx)` the original yourself, or the loop waits forever.
'''
c_compare = '''
Like a thread-safe queue (a pipe between threads) with the locking built in, and ownership of each message handed over with it.
'''
py_compare = '''
Like `queue.Queue` between threads, except the channel knows when every sender is gone and ends the loop by itself.
'''
