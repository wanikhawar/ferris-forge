[[level]]
id = "19.4"
title = "Sharing across threads"
kind = "fill"
book = ["16.3"]
xp = 60
goal = "Count with many threads at once using Arc<Mutex<T>>, and tally words from several threads into one shared HashMap."
lesson = '''
To share a `Mutex` between threads, each thread needs to **own** a handle to it. Several owners sounds like `Rc`... but `Rc` isn't safe across threads: its count isn't updated atomically.

**`Arc<T>`** (atomically reference counted) is the thread-safe `Rc`:

```rust
use std::sync::{Arc, Mutex};
use std::thread;

let counter = Arc::new(Mutex::new(0));
let mut handles = vec![];

for _ in 0..10 {
    let counter = Arc::clone(&counter);       // one owner per thread
    let handle = thread::spawn(move || {
        let mut num = counter.lock().unwrap();
        *num += 1;
    });
    handles.push(handle);
}

for handle in handles {
    handle.join().unwrap();
}
println!("Result: {}", *counter.lock().unwrap());   // 10
```

| Single thread | Many threads |
|---|---|
| `Rc<T>` | `Arc<T>` |
| `RefCell<T>` | `Mutex<T>` |

`Arc<Mutex<T>>` is to threads what `Rc<RefCell<T>>` is to one thread.
'''
c_compare = '''
Like a heap-allocated struct with a `pthread_mutex_t` and an atomic refcount, freed by the last thread to let go. Rust builds that for you, and won't compile code that touches the data without the lock.
'''
py_compare = '''
Python objects are shared between threads by default and protected (partly) by the GIL. Rust makes sharing explicit: `Arc` for owning, `Mutex` for changing.
'''
check = "tests"
starter = '''
