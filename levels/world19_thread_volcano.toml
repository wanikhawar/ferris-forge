solution = '''
use std::sync::mpsc;
use std::thread;

/// A helper thread sends each word in capitals through a channel.
/// Collect what arrives, in order.
fn shout_through_channel(words: Vec<String>) -> Vec<String> {
    let (tx, rx) = mpsc::channel();
    thread::spawn(move || {
        for word in words {
            tx.send(word.to_uppercase()).unwrap();
        }
    });
    rx.iter().collect()
}

/// Start `workers` threads. Worker number i (0, 1, 2, ...) sends i * 10.
/// Add up everything that arrives.
fn total_from_workers(workers: u32) -> u32 {
    let (tx, rx) = mpsc::channel();
    for i in 0..workers {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send(i * 10).unwrap();
        });
    }
    drop(tx);
    rx.iter().sum()
}

fn main() {
    println!("{:?}", shout_through_channel(vec!["hi".to_string(), "there".to_string()]));
}
'''
tests = '''
