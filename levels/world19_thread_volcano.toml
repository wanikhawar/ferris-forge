solution = '''
use std::collections::HashMap;
use std::sync::{Arc, Mutex};
use std::thread;

/// Start `threads` threads; each adds 1 to a shared counter `per_thread` times.
/// Wait for them all and return the final count.
fn count_with_threads(threads: usize, per_thread: usize) -> usize {
    let counter = Arc::new(Mutex::new(0));
    let mut handles = vec![];
    for _ in 0..threads {
        let counter = Arc::clone(&counter);
        handles.push(thread::spawn(move || {
            for _ in 0..per_thread {
                *counter.lock().unwrap() += 1;
            }
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }
    *counter.lock().unwrap()
}

/// One thread per line of text. Each thread counts the words in its line into
/// ONE shared HashMap. Return the finished map.
fn tally_words(lines: Vec<&'static str>) -> HashMap<String, usize> {
    let tally = Arc::new(Mutex::new(HashMap::new()));
    let handles: Vec<_> = lines
        .into_iter()
        .map(|line| {
            let tally = Arc::clone(&tally);
            thread::spawn(move || {
                for word in line.split_whitespace() {
                    *tally.lock().unwrap().entry(word.to_string()).or_insert(0) += 1;
                }
            })
        })
        .collect();
    for handle in handles {
        handle.join().unwrap();
    }
    let map = tally.lock().unwrap().clone();
    map
}

fn main() {
    println!("{}", count_with_threads(10, 100));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
