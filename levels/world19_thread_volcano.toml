solution = '''
use std::sync::mpsc;
use std::sync::{Arc, Mutex};
use std::thread;
use std::time::Duration;

/// Pretend to download a page: slow, like a real network request.
fn fetch(url: &str) -> String {
    thread::sleep(Duration::from_millis(150));
    match url {
        "station/north" => "ash level low wind calm".to_string(),
        "station/south" => "lava flow steady".to_string(),
        "station/east" => "all quiet".to_string(),
        "station/west" => "small tremor felt near the old crater rim".to_string(),
        "station/peak" => "steam vent active".to_string(),
        _ => String::new(),
    }
}

/// Fetch every URL using `workers` threads at once.
/// Returns (url, number of words on the page), sorted by url.
fn download_all(urls: Vec<&'static str>, workers: usize) -> Vec<(String, usize)> {
    let queue = Arc::new(Mutex::new(urls));
    let (tx, rx) = mpsc::channel();
    let mut handles = Vec::new();
    for _ in 0..workers {
        let queue = Arc::clone(&queue);
        let tx = tx.clone();
        handles.push(thread::spawn(move || loop {
            let next = queue.lock().unwrap().pop();
            let Some(url) = next else { break };
            let words = fetch(url).split_whitespace().count();
            tx.send((url.to_string(), words)).unwrap();
        }));
    }
    drop(tx);
    let mut results: Vec<(String, usize)> = rx.iter().collect();
    for handle in handles {
        handle.join().unwrap();
    }
    results.sort();
    results
}

/// The URL whose page has the most words.
fn busiest(results: &[(String, usize)]) -> Option<String> {
    results.iter().max_by_key(|(_, words)| *words).map(|(url, _)| url.clone())
}

fn main() {
    let results = download_all(vec!["station/north", "station/south", "station/east"], 3);
    println!("{results:?}");
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;
    use std::time::Instant;

    const ALL: [&str; 6] = [
        "station/north", "station/south", "station/east",
        "station/west", "station/peak", "station/lost",
    ];

    #[test]
    fn gets_everything_once() {
        let results = download_all(ALL.to_vec(), 3);
        let expected: Vec<(String, usize)> = vec![
            ("station/east".into(), 2),
            ("station/lost".into(), 0),
            ("station/north".into(), 5),
            ("station/peak".into(), 3),
            ("station/south".into(), 3),
            ("station/west".into(), 8),
        ];
        assert_eq!(results, expected);
    }

    #[test]
    fn workers_run_in_parallel() {
        let start = Instant::now();
        let results = download_all(ALL.to_vec(), 3);
        let took = start.elapsed();
        assert_eq!(results.len(), 6);
        assert!(
            took < Duration::from_millis(600),
            "took {took:?}: one by one would take 900 ms, 3 workers should need about 300 ms"
        );
    }

    #[test]
    fn one_worker_still_works() {
        let results = download_all(vec!["station/east", "station/peak"], 1);
        assert_eq!(results, vec![("station/east".into(), 2), ("station/peak".into(), 3)]);
    }

    #[test]
    fn the_busiest_station() {
        let results = vec![("a".to_string(), 2), ("b".to_string(), 9), ("c".to_string(), 4)];
        assert_eq!(busiest(&results), Some("b".to_string()));
        assert_eq!(busiest(&[]), None);
    }
}
