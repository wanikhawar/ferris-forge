        assert_eq!(sum_in_halves(vec![7]), 7);
        assert_eq!(sum_in_halves(vec![]), 0);
        assert_eq!(sum_in_halves((1..=100_000).collect()), 5_000_050_000);
    }

    #[test]
    fn greetings_in_order() {
        let names: Vec<String> = ["Ferris", "Corro", "Bonnie"].iter().map(|s| s.to_string()).collect();
        assert_eq!(
            greet_all(names),
            vec!["Hello from Ferris!", "Hello from Corro!", "Hello from Bonnie!"]
        );
    }
}
