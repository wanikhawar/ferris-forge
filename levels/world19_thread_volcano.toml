and gather the results. Six slow pages must be done in well under the time of one-by-one.'''
lesson = '''
**Boss fight!** The volcano observatory has to fetch readings from six stations. Each fetch is slow (the `fetch` function waits 150 ms, like a network request). Doing them one by one takes almost a second. Do them **in parallel**.

Write **`download_all(urls, workers)`**:

1. Start `workers` threads.
2. Hand out the URLs so every URL is fetched **exactly once**. A good way: a shared queue of work, `Arc<Mutex<Vec<&str>>>` (or `VecDeque`), that each worker `pop`s from until it's empty.
3. Each worker fetches its page and counts its words, and **sends** `(url, word_count)` back through a **channel**.
4. Gather everything from the channel and return it **sorted by URL**.

Also write **`busiest(results)`**: the URL with the most words (`None` if there are no results).

Watch out for:

- Holding a lock while fetching. `let url = queue.lock().unwrap().pop();` releases the lock at the end of the line; a `while let Some(url) = queue.lock().unwrap().pop()` keeps it for the whole loop body!
- Forgetting to `drop` the original sender, so the gathering loop never ends.
'''
c_compare = '''
The classic worker-pool pattern: a locked queue of jobs and a queue of results. In Rust the compiler checks that every shared piece is protected.
'''
py_compare = '''
Like `concurrent.futures.ThreadPoolExecutor(max_workers=3).map(fetch, urls)`, built by hand from threads, a lock and a queue.
'''
