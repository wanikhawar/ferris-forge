        let words = vec!["hot".to_string(), "lava".to_string(), "ahead".to_string()];
        assert_eq!(shout_through_channel(words), vec!["HOT", "LAVA", "AHEAD"]);
        assert!(shout_through_channel(vec![]).is_empty());
    }

    #[test]
    fn many_senders() {
        assert_eq!(total_from_workers(4), 60);
        assert_eq!(total_from_workers(1), 0);
        assert_eq!(total_from_workers(10), 450);
    }
}
