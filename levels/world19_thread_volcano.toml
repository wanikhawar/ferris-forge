hints = [
    "Put the URLs in an `Arc<Mutex<Vec<&str>>>` and make a channel. Start `workers` threads, each with its own `Arc::clone` of the queue and its own `tx.clone()`.",
    "Each worker loops: `let next = queue.lock().unwrap().pop();` (the lock is released at the end of that line), stop when it's None, otherwise fetch, count with `split_whitespace().count()`, and send `(url.to_string(), count)`. After starting the workers, `drop(tx)`, collect `rx.iter()`, and sort.",
    "```rust\nlet queue = Arc::new(Mutex::new(urls));\nlet (tx, rx) = mpsc::channel();\nfor _ in 0..workers {\n    let queue = Arc::clone(&queue);\n    let tx = tx.clone();\n    thread::spawn(move || loop {\n        let next = queue.lock().unwrap().pop();\n        let Some(url) = next else { break };\n        let words = fetch(url).split_whitespace().count();\n        tx.send((url.to_string(), words)).unwrap();\n    });\n}\ndrop(tx);\nlet mut results: Vec<(String, usize)> = rx.iter().collect();\nresults.sort();\nresults\n```",
