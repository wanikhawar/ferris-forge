goal = "Split the work across threads: add up each half of a list on its own thread, and greet everyone from their own thread."
lesson = '''
A **thread** runs code at the same time as the rest of your program. Start one with `thread::spawn` and a closure:

```rust
use std::thread;

let handle = thread::spawn(|| {
    println!("hi from the new thread");
    42                                   // the thread's result
});

let answer = handle.join().unwrap();     // wait for it to finish: 42
```

- `spawn` returns a **`JoinHandle`**. Calling **`join`** waits for the thread and gives back its result (in a `Result`, which is `Err` if the thread panicked).
- If `main` ends first, every other thread is stopped, finished or not.
- Threads run in an **unpredictable order**. Never rely on one finishing before another unless you `join` it.

A thread may outlive the function that started it, so it can't borrow that function's local variables. Use **`move`** to give the closure ownership of what it uses:

```rust
let v = vec![1, 2, 3];
let handle = thread::spawn(move || v.iter().sum::<i32>());   // v moves into the thread
```
'''
c_compare = '''
`thread::spawn` + `join` is `pthread_create` + `pthread_join`, but the result comes back typed (no `void*`), and the compiler stops you from sharing a local that could disappear.
'''
py_compare = '''
Like `threading.Thread(target=...).start()` and `.join()`, except Rust threads run truly in parallel (no GIL) and can return a value directly.
'''
