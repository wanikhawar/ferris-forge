[[level]]
id = "19.3"
title = "One at a time, please"
kind = "fix"
book = ["16.3"]
xp = 45
goal = '''This program freezes forever. Fix it so it prints:
score = 15'''
lesson = '''
Sometimes threads really do need the same data. A **`Mutex<T>`** (mutual exclusion) guards it, so only one thread at a time can get in:

```rust
use std::sync::Mutex;

let m = Mutex::new(5);
{
    let mut num = m.lock().unwrap();   // wait for the lock, then get access
    *num = 6;
}                                      // num goes out of scope: the lock is released
println!("m = {m:?}");
```

- `lock()` waits until no one else holds the lock, and returns a **`MutexGuard`**, which works like a `&mut` to the data.
- The lock is released when the guard is **dropped**, at the end of its scope (or with `drop(guard)`).
- `lock()` returns a `Result`: it's `Err` if another thread panicked while holding the lock.

The classic bug: asking for a lock you're still holding. The second `lock()` waits for the first guard to be dropped... which never happens. That's a **deadlock**, and Rust can't detect it at compile time.
'''
c_compare = '''
`lock()` is `pthread_mutex_lock`, but the unlock is automatic when the guard goes away, and the data can only be reached through the lock: you can't forget to take it.
'''
py_compare = '''
Like `with lock:`. The difference: in Rust the data lives *inside* the Mutex, so touching it without the lock doesn't compile.
'''
check = "output"
expected_output = "score = 15"
starter = '''
use std::sync::Mutex;

fn main() {
    let score = Mutex::new(0);

    let mut first = score.lock().unwrap();
    *first += 10;

    let mut second = score.lock().unwrap();
    *second += 5;

    println!("score = {}", *score.lock().unwrap());
}
'''
solution = '''
use std::sync::Mutex;

fn main() {
    let score = Mutex::new(0);

    {
        let mut first = score.lock().unwrap();
        *first += 10;
    }

    {
        let mut second = score.lock().unwrap();
        *second += 5;
    }

    println!("score = {}", *score.lock().unwrap());
}
'''
