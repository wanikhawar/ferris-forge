    #[test]
    fn counting() {
        assert_eq!(count_with_threads(10, 1), 10);
        assert_eq!(count_with_threads(8, 1000), 8000);
        assert_eq!(count_with_threads(0, 5), 0);
    }

    #[test]
    fn tallying() {
        let t = tally_words(vec!["lava is hot", "hot hot lava", "run"]);
        assert_eq!(t["hot"], 3);
        assert_eq!(t["lava"], 2);
        assert_eq!(t["is"], 1);
        assert_eq!(t["run"], 1);
        assert_eq!(t.len(), 4);
    }
}
'''
