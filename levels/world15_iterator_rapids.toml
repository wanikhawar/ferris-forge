[[level]]
id = "15.1"
title = "Little functions: closures"
kind = "fill"
book = ["13.1"]
xp = 45
goal = "Use closures to pick a shirt, sort words by length, and apply a function twice."
lesson = '''
A **closure** is a small function without a name, written with bars around its parameters:

```rust
let add_one = |x: i32| x + 1;          // types are usually inferred
let shout = |s: &str| { let up = s.to_uppercase(); up + "!" };
println!("{}", add_one(5));            // 6
```

Unlike a normal `fn`, a closure can use variables from **around** it:

```rust
let bonus = 10;
let add_bonus = |x| x + bonus;   // captures bonus
```

Many standard methods take closures:

```rust
preference.unwrap_or_else(|| self.most_stocked())   // only runs if it's None
words.sort_by_key(|w| w.len())                     // sort by what the closure returns
```

To take a closure as a parameter, use a trait bound: `f: impl Fn(i32) -> i32`.
'''
c_compare = '''
A function pointer plus a `void*` context argument, rolled into one value, with types checked by the compiler.
'''
py_compare = '''
Like `lambda`, but a closure can contain whole blocks of code, not just one expression.
'''
check = "tests"
starter = '''
