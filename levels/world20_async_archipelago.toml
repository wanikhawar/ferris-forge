solution = '''
mod runtime;

use runtime::{block_on, join_all, race, sleep, Either};
use std::future::Future;
use std::time::Duration;

/// Pretend to download a page: waits `ms` milliseconds, then returns the name in capitals.
async fn fetch(name: &str, ms: u64) -> String {
    sleep(Duration::from_millis(ms)).await;
    name.to_uppercase()
}

/// Fetch every (name, ms) page at the same time. Results in the same order as `pages`.
async fn fetch_all(pages: &[(&str, u64)]) -> Vec<String> {
    join_all(pages.iter().map(|(name, ms)| fetch(name, *ms))).await
}

/// Race two fetches; return the text of whichever finishes first.
async fn fastest(a: (&str, u64), b: (&str, u64)) -> String {
    match race(fetch(a.0, a.1), fetch(b.0, b.1)).await {
        Either::Left(page) | Either::Right(page) => page,
    }
}

/// Ok(output) if `future` finishes within `max`, otherwise Err(max).
async fn timeout<F: Future>(future: F, max: Duration) -> Result<F::Output, Duration> {
    match race(future, sleep(max)).await {
        Either::Left(output) => Ok(output),
        Either::Right(()) => Err(max),
    }
}

fn main() {
    let pages = block_on(fetch_all(&[("crab", 30), ("rust", 10)]));
    println!("{pages:?}");
}
