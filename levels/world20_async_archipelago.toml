`join` handles two futures. For a whole list of them, use **`join_all`**: it runs every future at the same time and returns their outputs **in the original order**:

```rust
use runtime::join_all;

let futures = names.iter().map(|name| fetch(name));   // a future per name
let pages: Vec<String> = join_all(futures).await;
```

Sometimes you only need the **first** one to finish. **`race`** runs two futures and returns as soon as one is done; the loser is dropped (cancelled). Since the two might have different output types, the winner comes wrapped in an `Either`:

```rust
use runtime::{race, Either};

match race(fetch("a"), fetch("b")).await {
    Either::Left(page) => println!("a won: {page}"),
    Either::Right(page) => println!("b won: {page}"),
}
```

These small pieces combine into new tools. A **timeout** is just a race between the work and a timer:

```text
race(the_work, sleep(max))
  work finished first  -> Ok(its output)
  timer finished first -> Err(max)
```

Writing `timeout` yourself is exactly what the book does in "Building Our Own Async Abstractions".
