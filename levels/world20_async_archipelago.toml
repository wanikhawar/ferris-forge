kind = "quiz"
book = ["17.6"]
xp = 25
goal = "One job resizes 1,000 photos. Another keeps 10,000 mostly idle chat connections open. Which tool fits which job?"
lesson = '''
Threads and async both do "many things at once", but they shine at different work.

**Threads** are run by the operating system. Each one has its own stack (often megabytes) and can run on its own CPU core. They're great for **CPU-heavy** work that keeps a core busy: number crunching, image processing, compression.

**Async tasks** are run by your runtime, switched at every `.await`. A task is small (often just a few hundred bytes), so you can have hundreds of thousands. They're great for **I/O-heavy** work that mostly **waits**: network servers, many connections, timers.

| Work | Mostly... | Fits |
|---|---|---|
| Resizing photos | computing | threads (one per core) |
| A chat server | waiting for messages | async tasks (one per connection) |

They also combine well: real runtimes like tokio run async tasks **on a pool of threads**, and can hand blocking or CPU-heavy work to a separate thread (`spawn_blocking`). A thread can send results to async code through a channel, and the other way around.

One warning: a long computation inside an async task never reaches an `.await`, so it **blocks** every other task on that thread until it's done.
'''
