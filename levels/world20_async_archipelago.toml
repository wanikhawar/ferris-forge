    fn ms(n: u64) -> Duration {
        Duration::from_millis(n)
    }

    #[test]
    fn one_with_a_limit() {
        assert_eq!(block_on(download_with_limit("crab.rs", ms(200))), Ok("<page crab.rs>".to_string()));
        assert_eq!(block_on(download_with_limit("nope.net", ms(200))), Err("not found: nope.net".to_string()));
        let start = Instant::now();
        assert_eq!(block_on(download_with_limit("slow.io", ms(50))), Err("timed out: slow.io".to_string()));
        assert!(start.elapsed() < ms(300), "it should give up after the limit");
    }

    #[test]
    fn all_at_once() {
        let start = Instant::now();
        let results = block_on(fetch_all(&["crab.rs", "slow.io", "nope.net", "ferris.dev"], ms(200)));
        let took = start.elapsed();
        assert_eq!(
            results,
            vec![
                Ok("<page crab.rs>".to_string()),
                Err("timed out: slow.io".to_string()),
                Err("not found: nope.net".to_string()),
                Ok("<page ferris.dev>".to_string()),
            ]
        );
        assert!(took < ms(300), "took {took:?}: one by one takes 350 ms; at once, about 200 ms");
    }

    #[test]
    fn progress_in_finishing_order() {
        let urls = ["ferris.dev", "slow.io", "crab.rs", "nope.net", "rust-lang.org"];
        let (results, finished) = block_on(fetch_with_progress(&urls, ms(200)));
        assert_eq!(results.len(), 5);
        assert_eq!(results[2], Ok("<page crab.rs>".to_string()));
        assert_eq!(results[1], Err("timed out: slow.io".to_string()));
        assert_eq!(finished, vec!["nope.net", "crab.rs", "rust-lang.org", "ferris.dev", "slow.io"]);
    }

    #[test]
    fn reporting() {
        let results = vec![Ok("a".to_string()), Err("b".to_string()), Ok("c".to_string())];
        assert_eq!(report(&results), "2 ok, 1 failed");
        assert_eq!(report(&[]), "0 ok, 0 failed");
    }
}
