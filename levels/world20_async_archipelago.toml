solution = '''
mod runtime;

use runtime::{block_on, channel, join, sleep, stream_from_iter, StreamExt};
use std::time::Duration;

/// Go through the numbers as a stream (`stream_from_iter`), with
/// `while let Some(n) = stream.next().await`. Keep the even ones, doubled.
async fn evens_doubled(numbers: Vec<i32>) -> Vec<i32> {
    let mut stream = stream_from_iter(numbers);
    let mut result = Vec::new();
    while let Some(n) = stream.next().await {
        if n % 2 == 0 {
            result.push(n * 2);
        }
    }
    result
}

/// A producer sends "tick 1", "tick 2", ... "tick n" through a channel, sleeping
/// `gap` after each one. A consumer collects every message until the channel closes.
/// Run both at the same time with join, and return what the consumer collected.
async fn ticks(n: u32, gap: Duration) -> Vec<String> {
    let (tx, mut rx) = channel();

    let producer = async move {
        for i in 1..=n {
            tx.send(format!("tick {i}")).unwrap();
            sleep(gap).await;
        }
    };

    let consumer = async {
        let mut got = Vec::new();
        while let Some(msg) = rx.next().await {
            got.push(msg);
        }
        got
    };

    let ((), got) = join(producer, consumer).await;
    got
}

fn main() {
    println!("{:?}", block_on(evens_doubled(vec![1, 2, 3, 4])));
}
