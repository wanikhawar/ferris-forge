lesson = '''
A future gives you **one** value later. A **stream** gives you **many** values, one after another, over time: messages from a chat, lines from a network connection, clicks.

A stream is the async version of an iterator. Instead of a `for` loop, you `await` each item:

```rust
use runtime::{stream_from_iter, StreamExt};

let mut stream = stream_from_iter(vec![1, 2, 3]);
while let Some(value) = stream.next().await {
    println!("got {value}");
}
```

`next()` comes from the **`StreamExt`** trait, so it must be imported. It returns `None` when the stream ends.

An async **channel** connects two pieces of async code. Its receiver is a stream:

```rust
use runtime::channel;

let (tx, mut rx) = channel();

let producer = async move {           // move: the producer owns tx...
    tx.send("hello").unwrap();
    sleep(Duration::from_millis(10)).await;
};                                    // ...so tx is dropped when it's done

let consumer = async {
    while let Some(msg) = rx.next().await {   // None once every sender is gone
        println!("{msg}");
    }
};

join(producer, consumer).await;
```

⚠ Forget the `move`, and `tx` lives on in the outer function. The channel never closes, and the consumer waits forever.
'''
