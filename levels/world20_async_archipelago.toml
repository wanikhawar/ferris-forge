xp = 55
goal = "Cook the pasta and the soup at the same time with join, and write an async block that doubles a number later."
lesson = '''
Awaiting one future after another runs them **one after another**:

```rust
cook("pasta").await;    // all of the pasta...
cook("soup").await;     // ...then all of the soup
```

To run them **at the same time**, hand both futures to **`join`**. It drives both, and whenever one is waiting (say, for a timer), it works on the other. It finishes when both are done, and gives back both results:

```rust
use runtime::join;

let (pasta, soup) = join(cook("pasta"), cook("soup")).await;
```

This is **concurrency on a single thread**: no new threads, just smart switching at every `.await`.

**Async blocks** make a future out of a few lines of code, right where you need it:

```rust
let later = async move {
    sleep(Duration::from_millis(10)).await;
    x * 2
};
```

Like closures, they borrow what they use, unless you write `async move` to take ownership.

`runtime::sleep(duration)` is the async version of `thread::sleep`: it pauses only this future, not the whole thread.
'''
c_compare = '''
Like an event loop with `select`/`poll` that switches between tasks whenever one would block, except you write plain straight-line code and the compiler builds the state machine.
'''
py_compare = '''
`join(a, b).await` is `await asyncio.gather(a, b)`, and an async block is like an inline coroutine.
'''
