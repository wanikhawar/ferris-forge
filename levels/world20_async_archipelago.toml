goal = "A hand-written future says Pending twice before it's ready. What does this print?"
lesson = '''
What *is* a future? Anything that implements the **`Future`** trait:

```rust
pub trait Future {
    type Output;
    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;
}

pub enum Poll<T> {
    Ready(T),
    Pending,
}
```

The runtime calls **`poll`** to make progress:

- **`Poll::Ready(value)`**: done, here's the result.
- **`Poll::Pending`**: not yet. Before returning `Pending`, the future arranges for **`cx.waker()`** to be called when it's worth polling again (when data arrives, a timer fires...). The runtime then polls it again.

`.await` is just this loop, written for you. An `async fn` compiles into a state machine that implements `Future`, with one state for each `.await`.

**`Pin`**: that state machine may contain references to its own fields. Moving it in memory would break them. `Pin<&mut Self>` promises the future won't be moved again once polling has started. Most types don't care (they're `Unpin`); that's why `runtime.rs` uses `pin!` before polling.

**Streams** are the same idea with `poll_next`, returning `Poll<Option<Item>>`. Ferris' `runtime.rs` is about 250 lines built from exactly these pieces: `block_on` polls in a loop and sleeps until a waker fires, and `sleep` starts a timer that calls the waker.
'''
c_compare = '''
A future is a state machine struct plus a "step" function, the kind of thing you'd hand-write in C for a non-blocking network server. The waker is the callback that says "step me again".
'''
py_compare = '''
Python coroutines are driven by `send()`, and `await` yields back to the event loop. Rust's `poll` + `Waker` is the same idea, but the runtime only polls again after a wake-up.
'''
