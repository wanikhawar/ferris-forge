solution = '''
mod runtime;

use runtime::{block_on, join, sleep};
use std::cell::RefCell;
use std::future::Future;
use std::time::Duration;

/// Writes "<dish> 1", "<dish> 2", ... into the log, pausing `pause_ms` before each step.
async fn cook(dish: &str, steps: u32, pause_ms: u64, log: &RefCell<Vec<String>>) {
    for step in 1..=steps {
        sleep(Duration::from_millis(pause_ms)).await;
        log.borrow_mut().push(format!("{dish} {step}"));
    }
}

/// Cook pasta (3 steps, 30 ms each) and soup (2 steps, 75 ms each) AT THE SAME TIME.
async fn dinner(log: &RefCell<Vec<String>>) {
    join(cook("pasta", 3, 30, log), cook("soup", 2, 75, log)).await;
}

fn double_later(x: u32) -> impl Future<Output = u32> {
    async move {
        sleep(Duration::from_millis(10)).await;
        x * 2
    }
}

fn main() {
    let log = RefCell::new(Vec::new());
    block_on(dinner(&log));
    println!("{:?}", log.borrow());
    println!("{}", block_on(double_later(21)));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;
    use std::time::Instant;

    #[test]
    fn both_dishes_at_once() {
        let log = RefCell::new(Vec::new());
        let start = Instant::now();
        block_on(dinner(&log));
        let took = start.elapsed();
        assert_eq!(*log.borrow(), ["pasta 1", "pasta 2", "soup 1", "pasta 3", "soup 2"]);
        assert!(took < Duration::from_millis(220), "took {took:?}: one after the other takes 240 ms");
    }

    #[test]
    fn doubling_later() {
        let start = Instant::now();
        assert_eq!(block_on(double_later(21)), 42);
        assert_eq!(block_on(double_later(0)), 0);
        assert!(start.elapsed() >= Duration::from_millis(20), "each one should sleep 10 ms first");
    }
}
'''
