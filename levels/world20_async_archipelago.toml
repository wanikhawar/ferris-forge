solution = '''
mod runtime;

use runtime::{block_on, channel, join, join_all, race, sleep, Either, StreamExt};
use std::time::Duration;

/// How long each island takes to answer, in milliseconds (None: no such island).
fn latency(url: &str) -> Option<u64> {
    match url {
        "crab.rs" => Some(40),
        "rust-lang.org" => Some(70),
        "ferris.dev" => Some(100),
        "slow.io" => Some(1000),
        _ => None,
    }
}

/// Download one page (already written for you).
async fn download(url: &str) -> Result<String, String> {
    match latency(url) {
        Some(ms) => {
            sleep(Duration::from_millis(ms)).await;
            Ok(format!("<page {url}>"))
        }
        None => {
            sleep(Duration::from_millis(10)).await;
            Err(format!("not found: {url}"))
        }
    }
}

/// Download, giving up after `limit` with Err("timed out: <url>").
async fn download_with_limit(url: &str, limit: Duration) -> Result<String, String> {
    match race(download(url), sleep(limit)).await {
        Either::Left(result) => result,
        Either::Right(()) => Err(format!("timed out: {url}")),
    }
}

/// Download every url at the same time, each with the limit. Same order as `urls`.
async fn fetch_all(urls: &[&str], limit: Duration) -> Vec<Result<String, String>> {
    join_all(urls.iter().map(|url| download_with_limit(url, limit))).await
}

/// Like fetch_all, but each download sends its url through a channel as soon as it
/// finishes. Returns (results in `urls` order, urls in the order they finished).
async fn fetch_with_progress(
    urls: &[&str],
    limit: Duration,
) -> (Vec<Result<String, String>>, Vec<String>) {
    let (tx, mut rx) = channel();

    let downloads = async move {
        let downloads = urls.iter().map(|url| {
            let tx = tx.clone();
            async move {
                let result = download_with_limit(url, limit).await;
                tx.send(url.to_string()).unwrap();
                result
            }
        });
        join_all(downloads).await
    };

    let listener = async {
        let mut finished = Vec::new();
        while let Some(url) = rx.next().await {
            finished.push(url);
        }
        finished
    };

    join(downloads, listener).await
}

/// "<ok> ok, <failed> failed"
fn report(results: &[Result<String, String>]) -> String {
    let ok = results.iter().filter(|r| r.is_ok()).count();
    format!("{ok} ok, {} failed", results.len() - ok)
}

fn main() {
    let results = block_on(fetch_all(&["crab.rs", "slow.io"], Duration::from_millis(200)));
    println!("{results:?}");
}
'''
