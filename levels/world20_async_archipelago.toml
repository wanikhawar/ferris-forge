[[level]]
id = "20.1"
title = "Promises of later"
kind = "predict"
book = ["17.1"]
xp = 30
goal = "Two orders are taken before anything is awaited. In what order do the lines print?"
lesson = '''
Some work is mostly **waiting**: for the network, a file, a timer. Instead of blocking a whole thread while it waits, **async** code can step aside and let other work run.

An **`async fn`** doesn't run when you call it. It returns a **future**: a value that *will* produce a result once something drives it to the end.

```rust
async fn cook(dish: &str) -> String {
    format!("{dish} is ready")
}

let order = cook("soup");     // nothing happens yet: `order` is a future
let meal = order.await;       // now it runs, and `meal` is the String
```

- **`.await`** runs a future until it's done, pausing the surrounding async code whenever the future has to wait.
- `.await` only works **inside** `async` code. Something has to drive the outermost future: an **async runtime**. `main` can't be `async` on its own.

Real programs use a runtime crate like **tokio** (the book uses its own `trpl`). This island can't download crates, so Ferris wrote a tiny one: `mod runtime;` loads **`runtime.rs`**, which sits next to your code. Its `block_on(future)` runs a future to the end:

```rust
mod runtime;
use runtime::block_on;

fn main() {
    let meal = block_on(cook("soup"));
}
```

Futures are **lazy**: until it's awaited, a future does nothing at all.
'''
c_compare = '''
No C equivalent is built in. Think of a future as a struct holding the state of a paused function, plus a `poll` function that resumes it; the compiler writes both for you.
'''
py_compare = '''
Very close to Python's `async def` / `await`, and `block_on` is `asyncio.run`. Like a Python coroutine, calling an async fn does nothing until it's awaited.
'''
starter = '''
mod runtime;

use runtime::block_on;

async fn cook(dish: &str) -> String {
    println!("cooking {dish}");
    format!("{dish} is ready")
}

fn main() {
    let soup = cook("soup");
    let pie = cook("pie");
    println!("two orders taken");

    block_on(async {
        println!("{}", pie.await);
        println!("{}", soup.await);
    });
}
'''
choices = [
    "cooking soup / cooking pie / two orders taken / pie is ready / soup is ready",
    "two orders taken / cooking soup / cooking pie / pie is ready / soup is ready",
    "two orders taken / cooking pie / pie is ready / cooking soup / soup is ready",
    "two orders taken / pie is ready / soup is ready",
]
answer = 2
expected_output = '''
two orders taken
cooking pie
pie is ready
cooking soup
soup is ready
'''
explanation = "Calling `cook` only builds a future, so nothing is printed until it's awaited. `pie` is awaited first, so its body runs (and prints) first; `soup` runs only when it is awaited after that."

