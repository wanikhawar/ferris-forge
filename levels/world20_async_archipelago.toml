async fn cook(dish: &str, steps: u32, pause_ms: u64, log: &RefCell<Vec<String>>) {
    for step in 1..=steps {
        sleep(Duration::from_millis(pause_ms)).await;
        log.borrow_mut().push(format!("{dish} {step}"));
