'''
solution = '''
//! # Art
//!
//! A library for modeling artistic concepts: mixing the RYB primary colors
//! into secondary colors.

pub use self::kinds::PrimaryColor;
pub use self::kinds::SecondaryColor;
pub use self::utils::mix;

pub mod kinds {
    /// The primary colors according to the RYB color model.
    #[derive(Debug, PartialEq, Clone, Copy)]
    pub enum PrimaryColor {
        Red,
        Yellow,
        Blue,
    }

    /// The secondary colors according to the RYB color model.
    #[derive(Debug, PartialEq, Clone, Copy)]
    pub enum SecondaryColor {
        Orange,
        Green,
        Purple,
    }
}

pub mod utils {
    use crate::kinds::*;

    /// Combines two different primary colors into the secondary color between
    /// them. Mixing a color with itself gives `None`.
    ///
    /// # Examples
    ///
    /// ```
    /// use art::{mix, PrimaryColor, SecondaryColor};
    ///
    /// assert_eq!(mix(PrimaryColor::Red, PrimaryColor::Yellow), Some(SecondaryColor::Orange));
    /// ```
    pub fn mix(c1: PrimaryColor, c2: PrimaryColor) -> Option<SecondaryColor> {
        use PrimaryColor::*;
        match (c1, c2) {
            (Red, Yellow) | (Yellow, Red) => Some(SecondaryColor::Orange),
            (Yellow, Blue) | (Blue, Yellow) => Some(SecondaryColor::Green),
            (Red, Blue) | (Blue, Red) => Some(SecondaryColor::Purple),
            _ => None,
        }
    }
}

fn main() {
    use kinds::PrimaryColor::*;
    println!("{:?}", utils::mix(Red, Yellow));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    const SOURCE: &str = include_str!("main.rs");

    fn docs_above(item: &str) -> String {
        let lines: Vec<&str> = SOURCE.lines().collect();
        let at = lines
            .iter()
            .position(|l| l.trim_start().starts_with(item))
            .unwrap_or_else(|| panic!("couldn't find `{item}`"));
        let mut docs: Vec<&str> = lines[..at]
            .iter()
            .rev()
            .map(|l| l.trim())
            .take_while(|l| l.starts_with("///") || l.starts_with("#["))
            .filter(|l| l.starts_with("///"))
            .collect();
        docs.reverse();
        docs.join("\n")
    }

    #[test]
    fn a_flat_public_api() {
        use crate::{mix, PrimaryColor, SecondaryColor};
        assert_eq!(mix(PrimaryColor::Red, PrimaryColor::Yellow), Some(SecondaryColor::Orange));
    }

    #[test]
    fn mixing() {
        use crate::kinds::PrimaryColor::*;
        use crate::kinds::SecondaryColor::*;
        use crate::utils::mix;
        assert_eq!(mix(Red, Yellow), Some(Orange));
        assert_eq!(mix(Yellow, Red), Some(Orange));
        assert_eq!(mix(Yellow, Blue), Some(Green));
        assert_eq!(mix(Blue, Red), Some(Purple));
        assert_eq!(mix(Blue, Blue), None);
    }

    #[test]
    fn documented() {
        let first = SOURCE.lines().find(|l| !l.trim().is_empty()).unwrap_or("");
        assert!(first.starts_with("//!"), "start the file with //! crate docs");
        assert!(!first.contains("TODO"), "replace the TODO with real crate docs");
        let docs = docs_above("pub fn mix");
        assert!(docs.contains("# Examples"), "mix needs /// docs with an # Examples section");
        assert!(docs.contains("```"), "the example needs a code block");
    }
}
'''
hints = [
    "Three jobs: write the `match` in mix, add the docs (`//!` at the top, `///` above `pub fn mix`), and add three `pub use` lines at the top level.",
    "mix: match on the pair `(c1, c2)`, e.g. `(Red, Yellow) | (Yellow, Red) => Some(SecondaryColor::Orange)`, and `_ => None` for the rest. Re-exports: `pub use self::kinds::PrimaryColor;` and the same for `SecondaryColor` and `self::utils::mix`.",
    "```rust\npub use self::kinds::PrimaryColor;\npub use self::kinds::SecondaryColor;\npub use self::utils::mix;\n\n// in utils:\npub fn mix(c1: PrimaryColor, c2: PrimaryColor) -> Option<SecondaryColor> {\n    use PrimaryColor::*;\n    match (c1, c2) {\n        (Red, Yellow) | (Yellow, Red) => Some(SecondaryColor::Orange),\n        (Yellow, Blue) | (Blue, Yellow) => Some(SecondaryColor::Green),\n        (Red, Blue) | (Blue, Red) => Some(SecondaryColor::Purple),\n        _ => None,\n    }\n}\n```",
]
