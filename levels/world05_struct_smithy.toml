[[level]]
id = "5.1"
title = "Forging your first struct"
kind = "fill"
book = ["5.1"]
xp = 40
goal = "Define the Crab struct so the program prints: Ferris has 8 legs"
lesson = '''
A **struct** groups related values under one name:

```rust
struct Player {
    name: String,
    score: u32,
}

let p = Player { name: String::from("Ana"), score: 7 };
println!("{}", p.name);   // fields are read with a dot
```

Each field has a name and a type. Struct names use `CamelCase`.
'''
c_compare = '''
Almost the same as a C `struct`, but no `typedef` dance, and the struct **owns** its `String` (it frees it when the struct is dropped).
'''
py_compare = '''
Like a Python `@dataclass`, but the field types are checked at compile time.
'''
check = "output"
expected_output = "Ferris has 8 legs"
starter = '''
// TODO: define a struct called Crab with two fields:
//   name: String
//   legs: u32

fn main() {
    let ferris = Crab { name: String::from("Ferris"), legs: 8 };
    println!("{} has {} legs", ferris.name, ferris.legs);
}
'''
solution = '''
struct Crab {
    name: String,
    legs: u32,
}

fn main() {
    let ferris = Crab { name: String::from("Ferris"), legs: 8 };
    println!("{} has {} legs", ferris.name, ferris.legs);
}
'''
