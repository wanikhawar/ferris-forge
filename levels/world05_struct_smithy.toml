struct Rectangle {
    width: u32,
    height: u32,
}

impl Rectangle {
    fn new(width: u32, height: u32) -> Self {
        todo!()
    }

    fn square(size: u32) -> Self {
        todo!()
    }
}

fn main() {
    println!("{:?}", Rectangle::square(3));
}
'''
solution = '''
#[derive(Debug, PartialEq)]
struct Rectangle {
    width: u32,
    height: u32,
}

impl Rectangle {
    fn new(width: u32, height: u32) -> Self {
        Self { width, height }
    }

    fn square(size: u32) -> Self {
        Self::new(size, size)
    }
}

fn main() {
    println!("{:?}", Rectangle::square(3));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn new_rectangle() {
        assert_eq!(Rectangle::new(2, 5), Rectangle { width: 2, height: 5 });
    }

    #[test]
    fn square() {
        assert_eq!(Rectangle::square(3), Rectangle { width: 3, height: 3 });
    }
}
'''
hints = [
    "Each function builds and returns a new Rectangle.",
    "In new, use field init shorthand: `Self { width, height }`. square can call `Self::new`.",
    "`Self { width, height }` in new, and `Self::new(size, size)` in square.",
]

[[level]]
id = "5.8"
title = "BOSS: The character sheet"
kind = "boss"
book = ["5.1", "5.2", "5.3"]
xp = 100
goal = '''Build a Hero with methods:
new, take_damage, heal, level_up, is_alive and describe.'''
lesson = '''
**Boss fight!** Forge a hero:

- `Hero::new(name)` starts at level 1 with 10 out of 10 HP.
- `take_damage(n)` lowers HP, but never below 0. Use `self.hp.saturating_sub(n)`.
- `heal(n)` raises HP, but never above `max_hp`. Use `.min(...)`.
- `level_up()`: level + 1, max_hp + 5, and HP refills to full.
- `is_alive()`: HP above 0.
- `describe()` returns text like `Ferris (lvl 2) 15/15 HP` (use `format!`).

Pick `&self` or `&mut self` for each method.
'''
c_compare = '''
`saturating_sub` stops at 0 instead of wrapping around to 4 billion like C's unsigned subtraction.
'''
py_compare = '''
A Python class with methods, but each method's `self` says whether it changes the hero.
'''
check = "tests"
starter = '''
struct Hero {
    name: String,
    level: u32,
    hp: u32,
    max_hp: u32,
}

impl Hero {
    fn new(name: &str) -> Self {
        todo!()
    }
    fn take_damage(&mut self, amount: u32) {
        todo!()
    }
    fn heal(&mut self, amount: u32) {
        todo!()
    }
    fn level_up(&mut self) {
        todo!()
    }
    fn is_alive(&self) -> bool {
        todo!()
    }
    fn describe(&self) -> String {
        todo!()
    }
}

fn main() {
    let mut ferris = Hero::new("Ferris");
    ferris.take_damage(4);
    ferris.level_up();
    println!("{}", ferris.describe());
}
'''
solution = '''
struct Hero {
    name: String,
    level: u32,
    hp: u32,
    max_hp: u32,
}

impl Hero {
    fn new(name: &str) -> Self {
        Self { name: name.to_string(), level: 1, hp: 10, max_hp: 10 }
    }
    fn take_damage(&mut self, amount: u32) {
        self.hp = self.hp.saturating_sub(amount);
    }
    fn heal(&mut self, amount: u32) {
        self.hp = (self.hp + amount).min(self.max_hp);
    }
    fn level_up(&mut self) {
        self.level += 1;
        self.max_hp += 5;
        self.hp = self.max_hp;
    }
    fn is_alive(&self) -> bool {
        self.hp > 0
    }
    fn describe(&self) -> String {
        format!("{} (lvl {}) {}/{} HP", self.name, self.level, self.hp, self.max_hp)
    }
}

fn main() {
    let mut ferris = Hero::new("Ferris");
    ferris.take_damage(4);
    ferris.level_up();
    println!("{}", ferris.describe());
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn starts_fresh() {
        let h = Hero::new("Ferris");
        assert_eq!(h.describe(), "Ferris (lvl 1) 10/10 HP");
        assert!(h.is_alive());
    }

    #[test]
    fn damage_never_goes_below_zero() {
        let mut h = Hero::new("Ferris");
        h.take_damage(25);
        assert_eq!(h.hp, 0);
        assert!(!h.is_alive());
    }

    #[test]
    fn healing_is_capped() {
        let mut h = Hero::new("Ferris");
        h.take_damage(6);
        h.heal(100);
        assert_eq!(h.hp, 10);
    }

    #[test]
    fn leveling_up_refills_hp() {
        let mut h = Hero::new("Ferris");
        h.take_damage(9);
        h.level_up();
        assert_eq!(h.describe(), "Ferris (lvl 2) 15/15 HP");
    }
}
'''
hints = [
    "Do `new` and `describe` first, then the methods that change the hero (`&mut self`).",
    "new: `Self { name: name.to_string(), level: 1, hp: 10, max_hp: 10 }`. take_damage: `saturating_sub`. heal: add, then `.min(self.max_hp)`.",
    "```rust\nfn take_damage(&mut self, amount: u32) { self.hp = self.hp.saturating_sub(amount); }\nfn heal(&mut self, amount: u32) { self.hp = (self.hp + amount).min(self.max_hp); }\nfn level_up(&mut self) { self.level += 1; self.max_hp += 5; self.hp = self.max_hp; }\nfn is_alive(&self) -> bool { self.hp > 0 }\nfn describe(&self) -> String { format!(\"{} (lvl {}) {}/{} HP\", self.name, self.level, self.hp, self.max_hp) }\n```",
]
