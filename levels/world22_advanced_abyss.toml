    "make_pipeline: make a `Vec<Box<dyn Fn(i32) -> i32>>`, `match *step` and push `Box::new(|x| x * 2)` and friends. run_pipeline: `pipeline.iter().fold(start, |value, step| step(value))`.",
    "```rust\nfn statuses(n: u32) -> Vec<Status> {\n    let mut list: Vec<Status> = (0..n).map(Status::Value).collect();\n    list.push(Status::Stop);\n    list\n}\n\nfn make_adder(n: i32) -> impl Fn(i32) -> i32 {\n    move |x| x + n\n}\n\nfn make_pipeline(steps: &[&str]) -> Vec<Box<dyn Fn(i32) -> i32>> {\n    let mut pipeline: Vec<Box<dyn Fn(i32) -> i32>> = Vec::new();\n    for step in steps {\n        match *step {\n            \"double\" => pipeline.push(Box::new(|x| x * 2)),\n            \"inc\" => pipeline.push(Box::new(|x| x + 1)),\n            \"square\" => pipeline.push(Box::new(|x| x * x)),\n            _ => {}\n        }\n    }\n    pipeline\n}\n```",
]

[[level]]
id = "22.6"
title = "Code that writes code"
kind = "fill"
book = ["20.5"]
xp = 60
goal = "Write three macros with macro_rules!: square!, maximum! (any number of arguments) and hashmap! { key => value, ... }."
lesson = '''
A **macro** is code that writes code. It runs at compile time, and its output is compiled like the rest of your program. You've used many: `println!`, `vec!`, `assert_eq!`.

**Declarative macros** (`macro_rules!`) work like a `match` on **code**: each arm has a pattern and the code it turns into.

```rust
macro_rules! square {
    ($x:expr) => {
        $x * $x
    };
}
```

`$x:expr` matches any expression and names it `$x`. Other fragment kinds: `ident` (a name), `ty` (a type), `tt` (any single token tree), `literal`, `pat`...

**Repetition**: `$( ... ),*` matches zero or more, separated by commas (`+` for one or more), and the same `$( ... )*` in the output repeats the code once per match:

```rust
macro_rules! my_vec {
    ( $( $x:expr ),* ) => {
        {
            let mut temp_vec = Vec::new();
            $( temp_vec.push($x); )*
            temp_vec
        }
    };
}
```

A macro can call itself, which is how you handle "the first one, then the rest":

```rust
($first:expr, $($rest:expr),+) => { ... maximum!($($rest),+) ... };
```

Macros must be defined **above** the code that uses them.

**Procedural macros** are Rust functions that take code as tokens and return new code. They live in their own crate, in three kinds: **custom derive** (`#[derive(HelloMacro)]`), **attribute-like** (`#[route(GET, "/")]`) and **function-like** (`sql!(SELECT * FROM posts)`).
'''
c_compare = '''
Like C's preprocessor macros, but they work on the syntax tree instead of on text: `square!(a + 1)` really is `(a + 1) * (a + 1)`, with no surprise from operator precedence.
'''
py_compare = '''
Python has no macros. The nearest things are decorators (a bit like attribute macros) and code generation, but Rust macros run at compile time.
'''
check = "tests"
starter = '''
use std::collections::HashMap;

// TODO: square!(x) => x * x
// TODO: maximum!(a, b, c, ...) => the largest of one or more values
// TODO: hashmap!{ k1 => v1, k2 => v2, ... } => a HashMap with those entries

fn main() {
    println!("{}", square!(7));
}
'''
solution = '''
use std::collections::HashMap;

macro_rules! square {
    ($x:expr) => {
        $x * $x
    };
}

macro_rules! maximum {
    ($x:expr) => {
        $x
    };
    ($first:expr, $($rest:expr),+) => {{
        let rest = maximum!($($rest),+);
        if $first > rest { $first } else { rest }
    }};
}

macro_rules! hashmap {
    ($($key:expr => $value:expr),* $(,)?) => {{
        let mut map = HashMap::new();
        $( map.insert($key, $value); )*
        map
    }};
}

fn main() {
    println!("{}", square!(7));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    #[test]
    fn squares() {
        assert_eq!(square!(7), 49);
        assert_eq!(square!(2 + 1), 9, "the expression is matched as a whole: (2 + 1) * (2 + 1)");
        assert_eq!(square!(1.5), 2.25);
    }

    #[test]
    fn maximums() {
        assert_eq!(maximum!(3), 3);
        assert_eq!(maximum!(3, 9), 9);
        assert_eq!(maximum!(4, 8, 1, 6), 8);
        assert_eq!(maximum!("crab", "abyss"), "crab");
    }

    #[test]
    fn hashmaps() {
        let depths: HashMap<&str, u32> = hashmap! { "reef" => 20, "trench" => 11000 };
        assert_eq!(depths.len(), 2);
        assert_eq!(depths["trench"], 11000);
        let empty: HashMap<String, i32> = hashmap! {};
        assert!(empty.is_empty());
    }
}
'''
