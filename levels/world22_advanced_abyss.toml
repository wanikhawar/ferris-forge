[[level]]
id = "22.7"
title = "BOSS: Build your own vec!"
kind = "boss"
book = ["20.5"]
xp = 120
goal = '''Write my_vec!, a full copy of vec!: empty, a list (with or without a trailing comma), and [value; count].
Lists must reserve exactly the right capacity, using your own count! macro.'''
lesson = '''
**Boss fight!** The standard `vec!` has three forms. Rebuild all of them as `my_vec!`:

```rust
let a: Vec<i32> = my_vec![];          // empty
let b = my_vec![1, 2, 3];             // a list
let c = my_vec![1, 2, 3,];            // a trailing comma is fine
let d = my_vec![0; 5];                // five zeros
```

Rules:

1. **Lists reserve exactly the right space** up front: `Vec::with_capacity(n)`, then push. To know `n` at compile time, write a helper macro **`count!`** that counts token trees: `count!(a b c)` is `3`, `count!()` is `0`. The classic trick is recursion: one, plus the count of the rest.
2. **`[value; count]`**: evaluate `value` only **once**, then clone it to fill the Vec (like `vec!`). `v.resize(count, value)` does exactly that.
3. Each list element is evaluated exactly once, in order.
4. It must work with any expressions, including other `my_vec!`s.

The order of the arms matters: the first matching arm wins. Since `$x:expr` would also match the start of `0; 5`, put the `;` arm before the list arm.

Optional repetition `$(,)?` matches zero or one trailing comma.
'''
c_compare = '''
Like writing an array-initializer macro in C, but with real pattern matching, recursion, and hygiene: names inside the macro can't clash with the caller's variables.
'''
py_compare = '''
Python builds lists at runtime with `[1, 2, 3]` or `[0] * 5`. `my_vec!` decides what code to generate at compile time, so `count!` costs nothing when the program runs.
'''
check = "tests"
starter = '''
// TODO: count!(a b c) counts the token trees it is given (here, 3)

// TODO: my_vec![] / my_vec![a, b, c] / my_vec![a, b, c,] / my_vec![value; count]

fn main() {
    let v: Vec<i32> = my_vec![1, 2, 3];
    println!("{v:?}");
}
'''
solution = '''
macro_rules! count {
    () => { 0usize };
    ($head:tt $($tail:tt)*) => { 1usize + count!($($tail)*) };
}

macro_rules! my_vec {
    () => {
        Vec::new()
    };
    ($value:expr; $n:expr) => {{
        let mut v = Vec::new();
        v.resize($n, $value);
        v
    }};
    ($($x:expr),+ $(,)?) => {{
        let mut v = Vec::with_capacity(count!($($x)*));
        $( v.push($x); )+
        v
    }};
}

fn main() {
    let v: Vec<i32> = my_vec![1, 2, 3];
    println!("{v:?}");
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use std::cell::Cell;

    #[test]
    fn counting() {
        assert_eq!(count!(), 0);
        assert_eq!(count!(a), 1);
        assert_eq!(count!(a b c), 3);
        assert_eq!(count!(x y z w v), 5);
    }

    #[test]
    fn empty_and_lists() {
        let empty: Vec<i32> = my_vec![];
        assert!(empty.is_empty());
        assert_eq!(my_vec![1, 2, 3], vec![1, 2, 3]);
        assert_eq!(my_vec![1, 2, 3,], vec![1, 2, 3]);
        assert_eq!(my_vec![1 + 1, 2 * 3], vec![2, 6]);
        assert_eq!(my_vec!["deep"], vec!["deep"]);
    }

    #[test]
    fn exact_capacity() {
        let v = my_vec![10, 20, 30, 40, 50];
        assert_eq!(v.capacity(), 5, "reserve exactly count!(...) slots");
    }

    #[test]
    fn repeated_values() {
        assert_eq!(my_vec![0; 4], vec![0, 0, 0, 0]);
        assert_eq!(my_vec![String::from("ab"); 2], vec!["ab".to_string(), "ab".to_string()]);
        let none: Vec<u8> = my_vec![7; 0];
        assert!(none.is_empty());
    }

    #[test]
    fn evaluated_once_in_order() {
        let calls = Cell::new(0);
        let next = || {
            calls.set(calls.get() + 1);
            calls.get()
        };
        assert_eq!(my_vec![next(); 3], vec![1, 1, 1]);
        assert_eq!(calls.get(), 1, "the value in [value; n] must be evaluated once");
        assert_eq!(my_vec![next(), next(), next()], vec![2, 3, 4]);
    }

    #[test]
    fn nested() {
        let grid = my_vec![my_vec![1], my_vec![2, 3]];
        assert_eq!(grid, vec![vec![1], vec![2, 3]]);
    }
}
'''
