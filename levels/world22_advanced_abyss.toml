solution = '''
use std::fmt;
use std::ops::Add;

#[derive(Debug, Copy, Clone, PartialEq)]
struct Point {
    x: i32,
    y: i32,
}

impl Add for Point {
    type Output = Point;

    fn add(self, other: Point) -> Point {
        Point { x: self.x + other.x, y: self.y + other.y }
    }
}

#[derive(Debug, PartialEq)]
struct Millimeters(u32);

#[derive(Debug, PartialEq)]
struct Meters(u32);

impl Add<Meters> for Millimeters {
    type Output = Millimeters;

    fn add(self, other: Meters) -> Millimeters {
        Millimeters(self.0 + other.0 * 1000)
    }
}

struct Wrapper(Vec<String>);

impl fmt::Display for Wrapper {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "[{}]", self.0.join(", "))
    }
}

trait OutlinePrint: fmt::Display {
    /// The value inside a box of stars.
    fn outline_print(&self) -> String {
        let text = self.to_string();
        let len = text.len();
        let edge = "*".repeat(len + 4);
        let blank = format!("*{}*", " ".repeat(len + 2));
        format!("{edge}\n{blank}\n* {text} *\n{blank}\n{edge}")
    }
}

impl fmt::Display for Point {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "({}, {})", self.x, self.y)
    }
}

impl OutlinePrint for Point {}

trait Pilot {
    fn fly(&self) -> String;
}

trait Wizard {
    fn fly(&self) -> String;
}

struct Human;

impl Pilot for Human {
    fn fly(&self) -> String {
        String::from("This is your captain speaking.")
    }
}

impl Wizard for Human {
    fn fly(&self) -> String {
        String::from("Up!")
    }
}

impl Human {
    fn fly(&self) -> String {
        String::from("*waving arms furiously*")
    }
}

/// What the person says when flying as a PILOT.
fn pilot_announcement(person: &Human) -> String {
    Pilot::fly(person)
}

fn main() {
    println!("{}", pilot_announcement(&Human));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    #[test]
    fn adding_points() {
        assert_eq!(Point { x: 1, y: 0 } + Point { x: 2, y: 3 }, Point { x: 3, y: 3 });
    }

    #[test]
    fn adding_lengths() {
        assert_eq!(Millimeters(500) + Meters(2), Millimeters(2500));
    }

    #[test]
    fn newtype_display() {
        let w = Wrapper(vec![String::from("hello"), String::from("world")]);
        assert_eq!(w.to_string(), "[hello, world]");
    }

    #[test]
    fn outlined_point() {
        assert_eq!(Point { x: 1, y: 3 }.to_string(), "(1, 3)");
        assert_eq!(
            Point { x: 1, y: 3 }.outline_print(),
            "**********\n*        *\n* (1, 3) *\n*        *\n**********"
        );
    }

    #[test]
    fn the_pilot_speaks() {
        assert_eq!(pilot_announcement(&Human), "This is your captain speaking.");
        assert_eq!(Human.fly(), "*waving arms furiously*");
    }
}
'''
hints = [
    "Five small pieces: `impl Add for Point`, `impl Add<Meters> for Millimeters`, `impl fmt::Display for Wrapper`, `impl fmt::Display for Point` plus an empty `impl OutlinePrint for Point {}`, and a different call in pilot_announcement.",
    "Each `Add` impl needs `type Output = ...;` and `fn add(self, other: ...) -> ...`. A meter is 1000 millimeters. The Display impls use `write!(f, ...)`. pilot_announcement must call the Pilot version: `Pilot::fly(person)`.",
    "```rust\nimpl Add<Meters> for Millimeters {\n    type Output = Millimeters;\n\n    fn add(self, other: Meters) -> Millimeters {\n        Millimeters(self.0 + other.0 * 1000)\n    }\n}\n\nimpl fmt::Display for Wrapper {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        write!(f, \"[{}]\", self.0.join(\", \"))\n    }\n}\n\nimpl OutlinePrint for Point {}\n\nfn pilot_announcement(person: &Human) -> String {\n    Pilot::fly(person)\n}\n```",
]

[[level]]
id = "22.4"
title = "Strange types"
kind = "predict"
book = ["20.3"]
xp = 30
goal = "A type alias, a match arm that never returns, and the size of a &str. What does this print?"
lesson = '''
**Type aliases** give an existing type a second name:

```rust
type Kilometers = i32;
type Thunk = Box<dyn Fn() + Send + 'static>;   // great for long types
```

An alias is **the same type**, not a new one: a `Kilometers` and an `i32` can be added together. (If you want the compiler to keep them apart, use a newtype, `struct Kilometers(i32)`, instead.)

**The never type `!`** is the type of expressions that never finish: `panic!`, `loop` without `break`, `continue`, `return`, `process::exit`. Since a `!` value can never exist, it fits in **any** type. That's why this works, although the arms look different:

```rust
let guess: u32 = match guess.trim().parse() {
    Ok(num) => num,       // u32
    Err(_) => continue,   // ! : never produces a value, so it's fine
};
```

**Dynamically sized types** (DSTs) like `str`, `[T]` and `dyn Trait` have no size known at compile time, so they always live behind a pointer: `&str`, `Box<dyn Trait>`. Such a pointer is **fat**: two words, the address plus the length (or plus the vtable).

Generic functions assume `T: Sized` by default. To also accept DSTs, write `T: ?Sized` ("maybe sized") and take a `&T`.
'''
c_compare = '''
A type alias is `typedef`. A `&str` is like passing a `char*` together with its length, which C makes you do by hand.
'''
py_compare = '''
Like `Kilometers = int` (a `TypeAlias`): just another name. `!` is like a function annotated `-> NoReturn`.
'''
starter = '''
type Meters = u32;

fn main() {
    let depth: u32 = 40;
    let more: Meters = 2;
    println!("{}", depth + more);

    let readings = ["7", "deep", "30"];
    let mut total = 0;
    for r in readings {
        let n: u32 = match r.parse() {
            Ok(n) => n,
            Err(_) => continue,
        };
        total += n;
    }
    println!("{total}");

    let word: &str = "abyss";
    println!("{}", std::mem::size_of_val(&word) == 2 * std::mem::size_of::<usize>());
}
'''
choices = [
    "It doesn't compile: Meters and u32 are different types",
    "It doesn't compile: the match arms have different types (u32 and continue)",
    "42 / 37 / false",
    "42 / 37 / true",
]
answer = 3
expected_output = '''
42
37
true
'''
explanation = "`Meters` is only another name for `u32`, so they add up to 42. `continue` has the never type `!`, which fits where a `u32` is expected, so \"deep\" is just skipped: 7 + 30 = 37. A `&str` is a fat pointer, address plus length: two `usize`s."

[[level]]
id = "22.5"
title = "Functions as values"
kind = "fill"
book = ["20.4"]
xp = 55
goal = "Pass functions as fn pointers, use function names and enum variants in map, and return closures: one alone, and a whole pipeline of different ones."
lesson = '''
Functions are values too. Their type is a **function pointer**, `fn`:

```rust
fn add_one(x: i32) -> i32 { x + 1 }

fn do_twice(f: fn(i32) -> i32, arg: i32) -> i32 {
    f(arg) + f(arg)
}

do_twice(add_one, 5);   // 12
```

`fn` is a type (not a trait like `Fn`), and it implements all three closure traits, so you can pass a function anywhere a closure is expected. That makes some `map` calls very short:

```rust
let strings: Vec<String> = numbers.iter().map(ToString::to_string).collect();

enum Status { Value(u32), Stop }
let statuses: Vec<Status> = (0u32..20).map(Status::Value).collect();   // a variant is a function too
```

**Returning closures.** Every closure has its own unnamed type, so you can't write it. Return `impl Fn`:

```rust
fn make_adder(n: i32) -> impl Fn(i32) -> i32 {
    move |x| x + n
}
```

But `impl Fn` is still **one** specific type. If a function might return *different* closures, or you want several in a `Vec`, box them as trait objects:

```rust
let steps: Vec<Box<dyn Fn(i32) -> i32>> = vec![Box::new(|x| x * 2), Box::new(move |x| x + n)];
```
'''
c_compare = '''
`fn(i32) -> i32` is `int (*)(int)`. Returning a closure that captures `n` is what C does with a function pointer plus a heap-allocated context struct.
'''
py_compare = '''
Functions are first-class in Python too. Returning `move |x| x + n` is like returning `lambda x: x + n`, but the captured `n` is copied in, not looked up later.
'''
check = "tests"
starter = '''
fn add_one(x: i32) -> i32 {
    x + 1
}

/// Call f on arg twice and add the two results.
fn do_twice(f: fn(i32) -> i32, arg: i32) -> i32 {
    todo!()
}

/// Every number as a String (try .map(ToString::to_string)).
fn to_strings(numbers: &[i32]) -> Vec<String> {
    todo!()
}

#[derive(Debug, PartialEq)]
enum Status {
    Value(u32),
    Stop,
}

/// Status::Value(0), Status::Value(1), ... up to (not including) n, then Status::Stop.
fn statuses(n: u32) -> Vec<Status> {
    todo!()
}

/// A closure that adds n to its argument.
fn make_adder(n: i32) -> impl Fn(i32) -> i32 {
    |x| x
}

/// One closure per step name: "double" (x * 2), "inc" (x + 1), "square" (x * x).
/// Unknown names are skipped.
fn make_pipeline(steps: &[&str]) -> Vec<Box<dyn Fn(i32) -> i32>> {
    todo!()
}

/// Feed `start` through every step, in order.
fn run_pipeline(pipeline: &[Box<dyn Fn(i32) -> i32>], start: i32) -> i32 {
    todo!()
}

fn main() {
    println!("{}", do_twice(add_one, 5));
}
'''
solution = '''
fn add_one(x: i32) -> i32 {
    x + 1
}

/// Call f on arg twice and add the two results.
fn do_twice(f: fn(i32) -> i32, arg: i32) -> i32 {
    f(arg) + f(arg)
}

/// Every number as a String (try .map(ToString::to_string)).
fn to_strings(numbers: &[i32]) -> Vec<String> {
    numbers.iter().map(ToString::to_string).collect()
}

#[derive(Debug, PartialEq)]
enum Status {
    Value(u32),
    Stop,
}

/// Status::Value(0), Status::Value(1), ... up to (not including) n, then Status::Stop.
fn statuses(n: u32) -> Vec<Status> {
    let mut list: Vec<Status> = (0..n).map(Status::Value).collect();
    list.push(Status::Stop);
    list
}

/// A closure that adds n to its argument.
fn make_adder(n: i32) -> impl Fn(i32) -> i32 {
    move |x| x + n
}

/// One closure per step name: "double" (x * 2), "inc" (x + 1), "square" (x * x).
/// Unknown names are skipped.
fn make_pipeline(steps: &[&str]) -> Vec<Box<dyn Fn(i32) -> i32>> {
    let mut pipeline: Vec<Box<dyn Fn(i32) -> i32>> = Vec::new();
    for step in steps {
        match *step {
            "double" => pipeline.push(Box::new(|x| x * 2)),
            "inc" => pipeline.push(Box::new(|x| x + 1)),
            "square" => pipeline.push(Box::new(|x| x * x)),
            _ => {}
        }
    }
    pipeline
}

/// Feed `start` through every step, in order.
fn run_pipeline(pipeline: &[Box<dyn Fn(i32) -> i32>], start: i32) -> i32 {
    pipeline.iter().fold(start, |value, step| step(value))
}

fn main() {
    println!("{}", do_twice(add_one, 5));
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    fn triple(x: i32) -> i32 {
        x * 3
    }

    #[test]
    fn function_pointers() {
        assert_eq!(do_twice(add_one, 5), 12);
        assert_eq!(do_twice(triple, 2), 12);
        assert_eq!(do_twice(|x| x - 1, 1), 0);
    }

    #[test]
    fn functions_in_map() {
        assert_eq!(to_strings(&[1, 22, -3]), vec!["1", "22", "-3"]);
        assert_eq!(statuses(3), vec![Status::Value(0), Status::Value(1), Status::Value(2), Status::Stop]);
        assert_eq!(statuses(0), vec![Status::Stop]);
    }

    #[test]
    fn returned_closures() {
        let add_five = make_adder(5);
        assert_eq!(add_five(10), 15);
        assert_eq!(make_adder(-1)(1), 0);
    }

    #[test]
    fn pipelines() {
        let p = make_pipeline(&["inc", "double", "square"]);
        assert_eq!(p.len(), 3);
        assert_eq!(run_pipeline(&p, 2), 36);
        let q = make_pipeline(&["square", "nope", "inc"]);
        assert_eq!(q.len(), 2);
        assert_eq!(run_pipeline(&q, 3), 10);
        assert_eq!(run_pipeline(&make_pipeline(&[]), 7), 7);
    }
}
'''
hints = [
