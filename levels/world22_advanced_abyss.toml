[[level]]
id = "22.1"
title = "Here be dragons: unsafe"
kind = "predict"
book = ["20.1"]
xp = 30
goal = "Two raw pointers to the same variable, one of them mutable, and a call into C. Does it compile? What does it print?"
lesson = '''
The borrow checker is careful: it rejects some programs that are actually fine. And some things, like talking to hardware or calling C code, can't be checked at all. For those, there's **`unsafe`**.

An `unsafe` block unlocks five **superpowers**:

1. Dereference a **raw pointer**.
2. Call an **unsafe function** (including C functions).
3. Read or write a **mutable static** variable.
4. Implement an **unsafe trait**.
5. Read the fields of a **union**.

Nothing else changes: the borrow checker still checks references inside `unsafe`. You're just promising the compiler that *you* have checked these five things.

**Raw pointers** (`*const T` and `*mut T`) are C pointers: they may be null, dangling or aliased, and they ignore the borrowing rules. Making one is safe; **using** one (`*ptr`) needs `unsafe`:

```rust
let mut num = 5;
let r1 = &raw const num;   // *const i32
let r2 = &raw mut num;     // *mut i32: both at once is allowed
unsafe {
    println!("{}", *r1);
}
```

**Calling C**: declare the foreign functions in an `unsafe extern "C"` block. The compiler can't check C code, so every call is `unsafe`:

```rust
unsafe extern "C" {
    fn abs(input: i32) -> i32;
}
```

Good Rust keeps `unsafe` blocks small and hides them behind **safe functions** (like the standard library's `split_at_mut`), so the rest of the program can't misuse them.
'''
c_compare = '''
An `unsafe` block is a small region of C rules inside Rust: raw pointers work exactly like C pointers there, and `extern "C"` declares the C functions you call.
'''
py_compare = '''
Like calling C from Python with `ctypes`: possible and sometimes necessary, but mistakes can crash the whole program instead of raising an exception.
'''
starter = '''
unsafe extern "C" {
    fn abs(input: i32) -> i32;
}

fn main() {
    let mut depth = 5;
    let reader = &raw const depth;
    let writer = &raw mut depth;

    unsafe {
        *writer += 1;
        println!("reader sees {}", *reader);
        println!("abs(-3) = {}", abs(-3));
    }
}
'''
choices = [
    "It doesn't compile: depth is borrowed mutably and immutably at the same time",
    "reader sees 5 / abs(-3) = 3",
    "reader sees 6 / abs(-3) = 3",
    "It doesn't compile: Rust can't call C functions",
]
answer = 2
expected_output = '''
reader sees 6
abs(-3) = 3
'''
explanation = "Raw pointers aren't references, so the borrowing rules don't apply: having a `*const` and a `*mut` to `depth` at once is allowed. Both point to the same place, so the reader sees the change to 6. `abs` comes from the C standard library, and calling it inside `unsafe` is fine."

[[level]]
id = "22.2"
title = "Dangerous globals"
kind = "predict"
book = ["20.1"]
xp = 30
goal = "A global counter counts the dives. Does this compile? If so, what does it print?"
lesson = '''
**Global variables** in Rust are `static`s:

```rust
static GREETING: &str = "Ahoy";       // read-only: safe to use anywhere
static mut DIVES: u32 = 0;            // changeable: dangerous
```

A `static` has one fixed address for the whole program (unlike a `const`, which is copied into every place it's used). Reading an ordinary `static` is safe.

A **`static mut`** is different: any thread could change it at any moment, which is a data race waiting to happen. So **every** read and write needs `unsafe`:

```rust
unsafe {
    DIVES += 1;
}
let n = unsafe { DIVES };   // copy the value out
```

Since the 2024 edition, Rust also refuses to make a **reference** to a `static mut` (`&DIVES`), even inside `unsafe`. Copy the value out instead. Better yet, avoid `static mut` entirely: use an atomic (`AtomicU32`) or a `Mutex`.

Two more unsafe features, in short:

- **Unsafe traits**: `unsafe impl Send for MyType {}` promises something the compiler can't check (here: that it's safe to send to another thread).
- **Unions**: like C unions, several fields sharing the same memory. Reading a field is `unsafe`, because Rust can't know which one was written last. They exist mostly to talk to C.
'''
c_compare = '''
A `static mut` is a C global. In C you can touch it from anywhere; in Rust every access is marked `unsafe`, so the risky spots are easy to find.
'''
py_compare = '''
Like a module-level variable changed with `global`, except Rust makes you mark every access as unsafe, because threads could race on it.
'''
starter = '''
static GREETING: &str = "Ahoy";
static mut DIVES: u32 = 0;

fn dive() {
    unsafe {
        DIVES += 1;
    }
}

fn main() {
    dive();
    dive();
    println!("{GREETING}! Dives so far: {}", DIVES);
}
'''
choices = [
    "Ahoy! Dives so far: 2",
    "Ahoy! Dives so far: 0",
    "It doesn't compile: reading GREETING needs unsafe",
    "It doesn't compile: reading DIVES needs an unsafe block",
]
answer = 3
compile_fails = true
explanation = "Writing `DIVES` inside `dive` is fine, but `main` reads the `static mut` outside any `unsafe` block: error E0133. Reading the plain `static GREETING` is safe. The fix: `let n = unsafe { DIVES };` and then print `n`."

[[level]]
id = "22.3"
title = "Trait wizardry"
kind = "fill"
book = ["20.2"]
xp = 60
goal = "Overload + for points and for millimeters plus meters, give a Vec a Display through a newtype, outline a point with a supertrait, and call the right fly method."
lesson = '''
Some deeper trait tools:

**Operator overloading.** `a + b` calls `std::ops::Add::add`. Implement `Add` and `+` works on your type:

```rust
use std::ops::Add;

impl Add for Point {
    type Output = Point;                       // an associated type
    fn add(self, other: Point) -> Point {
        Point { x: self.x + other.x, y: self.y + other.y }
    }
}
```

`Add` is really `trait Add<Rhs = Self>`: a **default type parameter**. To add a *different* type on the right, give it: `impl Add<Meters> for Millimeters`.

**The newtype pattern.** You may only implement a trait for a type if the trait **or** the type is yours (the *orphan rule*), so `impl Display for Vec<String>` isn't allowed. Wrap the type in a one-field struct, and it's yours:

```rust
struct Wrapper(Vec<String>);

impl fmt::Display for Wrapper {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "[{}]", self.0.join(", "))
    }
}
```

**Supertraits.** `trait OutlinePrint: fmt::Display` means "only types that are `Display` may implement `OutlinePrint`", so its methods can use `to_string()`.

**Same method name, several traits.** If `Human` has its own `fly` and also gets `fly` from `Pilot` and `Wizard`, then `person.fly()` picks Human's own. Pick another with `Pilot::fly(&person)`, or the fully qualified `<Human as Pilot>::fly(&person)`.
'''
c_compare = '''
C has no operator overloading at all. It's like C++'s `operator+`, but you only get `+` by implementing the `Add` trait, so the compiler always knows exactly which function runs.
'''
py_compare = '''
`impl Add` is `__add__`, and `impl Display` is `__str__`. The orphan rule has no Python equivalent: there, you can monkey-patch anything.
'''
check = "tests"
starter = '''
use std::fmt;
use std::ops::Add;

#[derive(Debug, Copy, Clone, PartialEq)]
struct Point {
    x: i32,
    y: i32,
}

// TODO: impl Add for Point (add the x's and the y's)

#[derive(Debug, PartialEq)]
struct Millimeters(u32);

#[derive(Debug, PartialEq)]
struct Meters(u32);

// TODO: impl Add<Meters> for Millimeters (the answer is in Millimeters)

struct Wrapper(Vec<String>);

// TODO: impl fmt::Display for Wrapper: "[hello, world]"

trait OutlinePrint: fmt::Display {
    /// The value inside a box of stars.
    fn outline_print(&self) -> String {
        let text = self.to_string();
        let len = text.len();
        let edge = "*".repeat(len + 4);
        let blank = format!("*{}*", " ".repeat(len + 2));
        format!("{edge}\n{blank}\n* {text} *\n{blank}\n{edge}")
    }
}

// TODO: make Point printable as "(x, y)", and implement OutlinePrint for it

trait Pilot {
    fn fly(&self) -> String;
}

