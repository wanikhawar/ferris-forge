    fn a_mixed_screen() {
        let screen = Screen {
            components: vec![
                Box::new(SelectBox { options: vec!["A".into(), "B".into()] }),
                Box::new(Button { width: 50, label: "Go".into() }),
                Box::new(Star),
            ],
