'''
solution = '''
pub trait Draw {
    fn draw(&self) -> String;
}

pub struct Button {
    pub width: u32,
    pub label: String,
}

pub struct SelectBox {
    pub options: Vec<String>,
}

impl Draw for Button {
    fn draw(&self) -> String {
        format!("[ {} ]", self.label)
    }
}

impl Draw for SelectBox {
    fn draw(&self) -> String {
        format!("<{}>", self.options.join("|"))
    }
}

pub struct Screen {
    pub components: Vec<Box<dyn Draw>>,
}

impl Screen {
    /// Each component's drawing, in order.
    pub fn run(&self) -> Vec<String> {
        self.components.iter().map(|c| c.draw()).collect()
    }
}

fn main() {
    let screen = Screen {
        components: vec![Box::new(Button { width: 50, label: String::from("OK") })],
    };
    println!("{:?}", screen.run());
}
'''
