solution = '''
pub struct Post {
    content: String,
}

pub struct DraftPost {
    content: String,
}

pub struct PendingReviewPost {
    content: String,
    approvals: u32,
}

pub enum Approval {
    Pending(PendingReviewPost),
    Published(Post),
}

impl Post {
    pub fn new() -> DraftPost {
        DraftPost { content: String::new() }
    }

    pub fn content(&self) -> &str {
        &self.content
    }
}

impl DraftPost {
    pub fn add_text(&mut self, text: &str) {
        self.content.push_str(text);
    }

    pub fn request_review(self) -> PendingReviewPost {
        PendingReviewPost { content: self.content, approvals: 0 }
    }
}

impl PendingReviewPost {
    /// Two approvals publish the post.
    pub fn approve(self) -> Approval {
        let approvals = self.approvals + 1;
        if approvals >= 2 {
            Approval::Published(Post { content: self.content })
        } else {
            Approval::Pending(PendingReviewPost { content: self.content, approvals })
        }
    }

    /// Back to a draft; the approvals so far are lost.
    pub fn reject(self) -> DraftPost {
        DraftPost { content: self.content }
    }
}

fn main() {
    let mut post = Post::new();
    post.add_text("I ate a salad for lunch today");
    let post = post.request_review();
    if let Approval::Pending(post) = post.approve() {
        if let Approval::Published(post) = post.approve() {
            println!("{}", post.content());
        }
    }
}
'''
tests = '''
#[cfg(test)]
mod ferris_tests {
    use super::*;

    fn pending(a: Approval) -> PendingReviewPost {
        match a {
            Approval::Pending(p) => p,
            Approval::Published(_) => panic!("published too early: it needs two approvals"),
        }
    }

    fn published(a: Approval) -> Post {
        match a {
            Approval::Published(p) => p,
            Approval::Pending(_) => panic!("still pending after two approvals"),
        }
    }

    #[test]
    fn two_approvals_publish() {
        let mut draft = Post::new();
        draft.add_text("I ate a salad");
        draft.add_text(" for lunch today");
        let review = draft.request_review();
        let review = pending(review.approve());
        let post = published(review.approve());
        assert_eq!(post.content(), "I ate a salad for lunch today");
    }

    #[test]
    fn rejecting_starts_over() {
        let mut draft = Post::new();
        draft.add_text("first try");
        let review = pending(draft.request_review().approve());
        let mut draft = review.reject();
        draft.add_text(", fixed");
        let review = draft.request_review();
        let review = pending(review.approve());
        let post = published(review.approve());
        assert_eq!(post.content(), "first try, fixed");
    }
}
'''
