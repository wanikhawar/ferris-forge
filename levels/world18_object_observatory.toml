[[level]]
id = "18.1"
title = "Is Rust object-oriented?"
kind = "quiz"
book = ["18.1"]
xp = 20
goal = "Rust has objects and hides their details. Which classic object-oriented feature does it leave out?"
lesson = '''
Is Rust an object-oriented language? It depends on what you mean. The usual checklist:

**1. Objects bundle data with behavior.** ✔ Structs and enums have methods in `impl` blocks.

**2. Encapsulation: hide the details.** ✔ Fields are private unless marked `pub`. Here only methods can touch the list, so the cached average can never be wrong:

```rust
pub struct AveragedCollection {
    list: Vec<i32>,      // private
    average: f64,        // private
}

impl AveragedCollection {
    pub fn add(&mut self, value: i32) {
        self.list.push(value);
        self.update_average();
    }
    pub fn average(&self) -> f64 {
        self.average
    }
    fn update_average(&mut self) { /* ... */ }
}
```

**3. Inheritance: a type reuses another type's fields and code.** ✘ There's no `class Dog extends Animal`. Rust offers other tools for the two reasons people use inheritance:

- **Reusing code**: a trait can have **default methods** that every implementor gets for free.
- **Polymorphism** (one piece of code working with many types): **generics** with trait bounds, or **trait objects** (`dyn Trait`), which are next.

Many languages have moved away from inheritance anyway: it tends to share more than you wanted, and makes designs rigid.
'''
c_compare = '''
C has none of the three built in; people fake objects with structs plus function pointers. Rust has the first two directly and replaces the third with traits.
'''
py_compare = '''
Python has all three, including multiple inheritance. In Rust, the shared behavior goes into traits instead of base classes.
'''
choices = [
    "Methods: functions attached to a type",
    "Encapsulation: private fields that only the type's own methods can touch",
    "Inheritance: a struct taking over the fields and methods of a parent struct",
    "Polymorphism: one function working with values of different types",
]
answer = 2
explanation = "Rust has methods (`impl`), encapsulation (`pub` vs private) and polymorphism (generics and trait objects). It has no inheritance: shared behavior comes from traits and their default methods instead."

[[level]]
id = "18.2"
title = "Many shapes, one list"
kind = "fill"
book = ["18.2"]
xp = 55
goal = "Let the Screen hold any mix of components (buttons, select boxes, ...), and draw them all."
lesson = '''
A `Vec` holds values of **one** type. So how do you keep a list of buttons, text boxes and pictures together, when you can't know every type a user of your library will invent?

With a **trait object**: `Box<dyn Draw>` means "some value, of any type that implements `Draw`".

```rust
pub trait Draw {
    fn draw(&self) -> String;
}

pub struct Screen {
    pub components: Vec<Box<dyn Draw>>,
}

impl Screen {
    pub fn run(&self) {
        for component in self.components.iter() {
            component.draw();   // calls Button's or SelectBox's draw
        }
    }
}

let screen = Screen {
    components: vec![
        Box::new(SelectBox { /* ... */ }),
        Box::new(Button { /* ... */ }),
    ],
};
```

Which `draw` runs is decided **while the program runs** (dynamic dispatch). The trait object is a pointer to the value plus a pointer to a table of its methods.

Compare with generics: `Vec<T>` where `T: Draw` would allow only **one** type per screen, but each call is resolved at compile time (static dispatch), which is a little faster.
'''
c_compare = '''
A trait object is the classic C trick of a struct with a pointer to a table of function pointers (a vtable), built and checked by the compiler.
'''
py_compare = '''
This is duck typing, but checked: anything in the list is guaranteed to have a `draw` method, or it doesn't compile.
'''
