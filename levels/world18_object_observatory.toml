[[level]]
id = "18.3"
title = "Draft, review, publish"
kind = "fill"
book = ["18.3"]
xp = 60
goal = "Finish the blog post's state machine: a post is a draft, then pending review, then published. Only published posts show their text."
lesson = '''
The **state pattern**: a value's behavior depends on its state, and each state is its own type that knows what comes next.

A blog post goes **Draft → PendingReview → Published**, and `content()` returns the text only once it's published.

```rust
pub struct Post {
    state: Option<Box<dyn State>>,
    content: String,
}

trait State {
    fn request_review(self: Box<Self>) -> Box<dyn State>;
    fn approve(self: Box<Self>) -> Box<dyn State>;
    fn content<'a>(&self, post: &'a Post) -> &'a str {
        ""                                   // default: show nothing
    }
}
```

Two new things:

- **`self: Box<Self>`**: the method takes ownership of the boxed state and returns the next one. The old state is used up, which is exactly what a state change means.
- **`Option` + `take()`**: Rust doesn't allow a struct field to be empty, even for a moment. `self.state.take()` moves the state out and leaves `None` behind, then we put the new state back in:

```rust
pub fn request_review(&mut self) {
    if let Some(s) = self.state.take() {
        self.state = Some(s.request_review())
    }
}
```

Each state decides what each action does. `Draft` is done for you; write `PendingReview` and `Published`, and `Post::approve`.
'''
c_compare = '''
In C you'd write an `enum state` and a `switch` in every function. Here each state's rules live together in one `impl`, and adding a state doesn't mean editing every switch.
'''
py_compare = '''
The classic "State" design pattern from object-oriented books: each state is a class, and the post delegates to its current state object.
'''
check = "tests"
starter = '''
