[[level]]
id = "18.4"
title = "Ownership Inventory #4"
kind = "predict"
book = ["18.4"]
xp = 30
goal = "Does this compile? If so, what does it print?"
lesson = '''
**Ownership Inventory #4**: the last checkpoint from the Brown edition of the Rust Book, about trait objects and what they're allowed to borrow.

A trait object hides the real type, so it also hides **what that type borrows**. Rust needs to know how long a `dyn Trait` value may live, so every trait object has a lifetime bound, written `dyn Trait + 'a`.

When you don't write one, Rust picks a default:

| Written | Means |
|---|---|
| `Box<dyn Fn()>` (in a function signature) | `Box<dyn Fn() + 'static>`: may not borrow anything temporary |
| `&'a dyn Fn()` | `&'a (dyn Fn() + 'a)` |
| `Box<dyn Fn() + '_>` | may borrow from the function's arguments |
'''
c_compare = '''
In C, a callback struct holding a pointer to the caller's data can easily outlive that data. Rust tracks the borrow even through the type-erased object.
'''
py_compare = '''
A Python closure keeps whatever it captures alive. A Rust closure that borrows must not outlive what it borrows, and the type says how long that is.
'''
starter = '''
fn make_greeter(name: &String) -> Box<dyn Fn() -> String> {
    Box::new(move || format!("Hello, {name}!"))
}

fn main() {
    let name = String::from("Ferris");
    let greet = make_greeter(&name);
    println!("{}", greet());
}
'''
choices = [
    "Hello, Ferris!",
    "It doesn't compile: `move` can't be used on a reference",
    "It doesn't compile: Box<dyn Fn() -> String> means 'static, but the closure holds a borrowed &String",
    "It compiles, but panics because name was moved into the closure",
]
answer = 2
compile_fails = true
explanation = "In a function signature, `Box<dyn Fn() -> String>` means `Box<dyn Fn() -> String + 'static>`. The closure captures `name`, a reference with a shorter lifetime, so it isn't `'static`. Rust doesn't look at `main` to see that `name` would live long enough; the signature must say so: `Box<dyn Fn() -> String + '_>`."

[[level]]
id = "18.5"
title = "Which design wins?"
kind = "quiz"
book = ["18.5"]
xp = 25
goal = "The blog post could also use a different type for each state. What does that design catch that the trait-object version can't?"
lesson = '''
The state pattern from 18.3 works, but the compiler can't help much: calling `content()` on a draft quietly returns `""`, and calling `approve()` on a draft quietly does nothing. Mistakes show up as wrong behavior at runtime.

There's a more Rust-flavored design: **encode the states as types**.

```rust
pub struct DraftPost { content: String }
pub struct PendingReviewPost { content: String }
pub struct Post { content: String }

impl DraftPost {
    pub fn add_text(&mut self, text: &str) { ... }
    pub fn request_review(self) -> PendingReviewPost { ... }   // consumes the draft
}

impl PendingReviewPost {
    pub fn approve(self) -> Post { ... }
}

impl Post {
    pub fn content(&self) -> &str { &self.content }   // only published posts have this
}
```

```rust
let mut post = Post::new();          // a DraftPost
post.add_text("I ate a salad");
let post = post.request_review();    // now a PendingReviewPost
let post = post.approve();           // now a Post
```

The trade-offs:

| | Trait objects (18.3) | States as types |
|---|---|---|
| Wrong action | silently ignored at runtime | **compile error** |
| Changing state | `post.approve()` changes it in place | `let post = post.approve();` makes a new value |
| Adding a state | add one struct and impl | change the methods that lead to and from it |

Object-oriented patterns work in Rust, but using the type system often catches more bugs.
'''
c_compare = '''
C programs often keep a `state` field and check it in every function. Making each state a separate type turns those runtime checks into compile-time ones.
'''
py_compare = '''
Python can't easily check this before running. In Rust, a draft simply has no `content` method, so the mistake can't be compiled.
'''
choices = [
    "Nothing: both designs behave the same and catch the same mistakes",
    "It frees memory sooner, because there are no Boxes",
    "Calling content() on a draft becomes a compile error instead of quietly returning an empty string",
    "It lets one post be a draft and published at the same time",
]
answer = 2
explanation = "With separate types, `DraftPost` simply has no `content` (or `approve`) method, so misuse doesn't compile. The trait-object version must accept every call at runtime and can only ignore the wrong ones."

[[level]]
id = "18.6"
title = "BOSS: The blog workflow"
kind = "boss"
book = ["18.2", "18.3", "18.5"]
xp = 120
goal = '''Build the blog workflow with states as types: drafts go to review, reviews can be
rejected back to drafts, and a post needs two approvals before it's published.'''
lesson = '''
**Boss fight!** The editors want a stricter workflow, built with the **states as types** design:

```text
DraftPost --request_review--> PendingReviewPost --approve--> (1 approval, still pending)
    ^                              |                --approve--> Post (published)
    └──────────reject──────────────┘
```

Write:

1. **`Post::new()`** → an empty `DraftPost`.
2. **`DraftPost::add_text(&mut self, text)`** and **`DraftPost::request_review(self)`** → a `PendingReviewPost` with 0 approvals.
3. **`PendingReviewPost::reject(self)`** → back to a `DraftPost` with the same text. Approvals are lost.
4. **`PendingReviewPost::approve(self)`** → an `Approval`: still `Pending` (with one more approval) after the first one, `Published` after the second.
5. **`Post::content(&self)`** → the text.

Since `approve` can lead to two different types, it returns an enum:

```rust
pub enum Approval {
    Pending(PendingReviewPost),
    Published(Post),
}
```

All the structs and signatures are there; fill in the bodies. Remember: a method that takes `self` uses up the old value, so a rejected or approved post can't be used by accident.
'''
