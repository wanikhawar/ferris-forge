id = 2
name = "Flow Forest"
blurb = "Paths that branch and loop: if, functions, loop, while and for."

[[level]]
id = "2.1"
title = "The fork in the path"
kind = "fix"
book = ["3.5"]
xp = 30
goal = "Make it print: Status: wounded"
lesson = '''
In Rust, **`if` is an expression**: it produces a value. So you can write:

```rust
let mood = if hungry { "grumpy" } else { "happy" };
```

The catch: both branches must give the **same type**, because `mood` can only have one type.
'''
c_compare = '''
This replaces C's ternary operator `cond ? a : b`. Rust has no `?:`, because `if` already does that job.
'''
py_compare = '''
Like Python's `"grumpy" if hungry else "happy"`. But Python lets the two branches return different types, and Rust doesn't.
'''
check = "output"
expected_output = "Status: wounded"
starter = '''
fn main() {
    let health = 30;
    let status = if health > 50 { "healthy" } else { 10 };
    println!("Status: {}", status);
}
'''
solution = '''
fn main() {
    let health = 30;
    let status = if health > 50 { "healthy" } else { "wounded" };
    println!("Status: {}", status);
}
'''
hints = [
    "Look at the types of the two branches of the `if`. Are they the same?",
    "One branch gives a string, the other a number. `status` can only have one type.",
    "Change the `else` branch to `{ \"wounded\" }`.",
]

[[level]]
id = "2.2"
title = "Your first function"
kind = "fill"
book = ["3.3"]
xp = 30
goal = "Write `square` so that it returns n × n. Ferris' tests will check it."
lesson = '''
Functions are declared with **`fn`**. Parameter types are required, and the return type comes after `->`:

```rust
fn add(a: i32, b: i32) -> i32 {
    a + b
}
```

Notice there's **no `return` and no semicolon** on the last line. The last *expression* in a function is its return value. (`return a + b;` also works, but idiomatic Rust leaves it out.)

`todo!()` is a placeholder that crashes if it runs. Replace it!
'''
c_compare = '''
Like `int add(int a, int b) { return a + b; }`, with the types after the names. Unlike C, the order you define functions in doesn't matter, and you never need prototypes.
'''
py_compare = '''
Like `def add(a, b): return a + b`, except the types are compulsory: `a: i32`. Think of Python type hints that the compiler actually enforces.
'''
check = "tests"
starter = '''
fn square(n: i32) -> i32 {
    todo!()
}

fn main() {
    println!("7 squared is {}", square(7));
}
'''
solution = '''
fn square(n: i32) -> i32 {
    n * n
}

fn main() {
    println!("7 squared is {}", square(7));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn squares_positive() {
        assert_eq!(square(3), 9);
    }

    #[test]
    fn squares_negative() {
        assert_eq!(square(-4), 16);
    }

    #[test]
    fn squares_zero() {
        assert_eq!(square(0), 0);
    }
}
'''
hints = [
    "Replace `todo!()` with an expression that uses `n`.",
    "The last expression in a function (without a `;`) is what it returns.",
    "The body should be just `n * n`.",
]

[[level]]
id = "2.3"
title = "The sneaky semicolon"
kind = "fix"
book = ["3.3"]
xp = 30
goal = "Make it print: 42"
lesson = '''
Here's a Rust rule that surprises everyone once:

- `n * 2` is an **expression**. It has a value.
- `n * 2;` is a **statement**. The semicolon throws the value away and leaves `()` (pronounced "unit", Rust's "nothing").

So a semicolon on a function's last line means it returns `()` instead of your number.
'''
c_compare = '''
In C, falling off the end of a non-void function is undefined behaviour (and maybe a warning). In Rust it's a hard type error: "expected `i32`, found `()`".
'''
py_compare = '''
It's like forgetting `return` in Python and getting `None` back. Rust catches it at compile time instead.
'''
check = "output"
expected_output = "42"
starter = '''
fn double(n: i32) -> i32 {
    n * 2;
}

fn main() {
    println!("{}", double(21));
}
'''
solution = '''
fn double(n: i32) -> i32 {
    n * 2
}

fn main() {
    println!("{}", double(21));
}
'''
hints = [
    "The error says the function returns `()`. Where does a function's value come from?",
    "A single character on line 2 is turning the expression into a statement.",
    "Remove the `;` after `n * 2`.",
]

[[level]]
id = "2.4"
title = "A loop that answers"
kind = "predict"
book = ["3.5"]
xp = 20
goal = "What does this print?"
lesson = '''
**`loop`** repeats forever, until you `break`. And `break` can **carry a value** out of the loop:

```rust
let found = loop {
    // ...
    break 42;
};
```
'''
starter = '''
fn main() {
    let mut counter = 0;
    let result = loop {
        counter += 1;
        if counter == 4 {
            break counter * 10;
        }
    };
    println!("{}", result);
}
'''
choices = ["4", "40", "30", "It doesn't compile: a loop has no value"]
answer = 1
expected_output = "40"
explanation = "The loop runs until `counter` is 4, then `break counter * 10` makes the whole `loop` expression equal 40, which goes into `result`."

[[level]]
id = "2.5"
title = "Counting the trees"
kind = "fill"
book = ["3.5"]
xp = 35
goal = "Write `sum_to(n)` that adds up 1 + 2 + … + n using a for loop."
lesson = '''
**`for`** loops over anything you can iterate. **Ranges** are the easiest:

```rust
for i in 0..3 { }    // 0, 1, 2       (end is excluded)
for i in 1..=3 { }   // 1, 2, 3       (=  includes the end)
```

To add things up, you need a variable that changes, so remember `mut`.
'''
c_compare = '''
`for i in 1..=n` replaces `for (int i = 1; i <= n; i++)`. There's no index bookkeeping to get wrong.
'''
py_compare = '''
`for i in 1..=n` is like `for i in range(1, n + 1)`. `1..n` is like `range(1, n)`.
'''
check = "tests"
starter = '''
fn sum_to(n: u32) -> u32 {
    todo!()
}

fn main() {
    println!("1 + 2 + ... + 10 = {}", sum_to(10));
}
'''
solution = '''
fn sum_to(n: u32) -> u32 {
    let mut total = 0;
    for i in 1..=n {
        total += i;
    }
    total
}

fn main() {
    println!("1 + 2 + ... + 10 = {}", sum_to(10));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn sum_to_one() {
        assert_eq!(sum_to(1), 1);
    }

    #[test]
    fn sum_to_ten() {
        assert_eq!(sum_to(10), 55);
    }

    #[test]
    fn sum_to_zero_is_zero() {
        assert_eq!(sum_to(0), 0);
    }
}
'''
hints = [
    "You'll need a running total that starts at 0 and changes inside the loop.",
    "Make `let mut total = 0;`, loop with `for i in 1..=n`, add `i` each time, then return `total` as the last expression.",
    "```rust\nlet mut total = 0;\nfor i in 1..=n {\n    total += i;\n}\ntotal\n```",
]

[[level]]
id = "2.6"
title = "Where the range ends"
kind = "predict"
book = ["3.5"]
xp = 20
goal = "What does this print?"
lesson = '''
`print!` is like `println!` but without the newline. Remember how ranges work: is the end included?
'''
starter = '''
fn main() {
    for i in 1..4 {
        print!("{} ", i);
    }
    println!();
}
'''
choices = ["1 2 3 4", "1 2 3", "0 1 2 3", "It doesn't compile: print! needs a newline"]
answer = 1
expected_output = "1 2 3"
explanation = "`1..4` stops *before* 4, so you get 1, 2, 3. Write `1..=4` to include the 4."

[[level]]
id = "2.7"
title = "The Collatz creek"
kind = "fill"
book = ["3.5"]
xp = 40
goal = "Write `collatz_steps(n)`: how many steps until n reaches 1?"
lesson = '''
**`while`** loops as long as a condition is true.

The **Collatz** rule: if `n` is even, halve it; if it's odd, make it `3n + 1`. Count the steps until `n` is 1. (Nobody has ever proved this always ends!)

Useful pieces:
- `n % 2 == 0` checks if `n` is even
- A parameter can be made mutable: `fn f(mut n: u64)`
'''
c_compare = '''
`while (n != 1) { ... }` translates directly. Rust has no `do { } while`, but `loop` + `break` covers it.
'''
py_compare = '''
Same as Python's `while n != 1:`, just with braces and no colon.
'''
check = "tests"
starter = '''
fn collatz_steps(n: u64) -> u32 {
    todo!()
}

fn main() {
    println!("27 takes {} steps", collatz_steps(27));
}
'''
solution = '''
fn collatz_steps(mut n: u64) -> u32 {
    let mut steps = 0;
    while n != 1 {
        n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };
        steps += 1;
    }
    steps
}

fn main() {
    println!("27 takes {} steps", collatz_steps(27));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn one_is_already_done() {
        assert_eq!(collatz_steps(1), 0);
    }

    #[test]
    fn six_takes_eight_steps() {
        // 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1
        assert_eq!(collatz_steps(6), 8);
    }

    #[test]
    fn twenty_seven_takes_a_while() {
        assert_eq!(collatz_steps(27), 111);
    }
}
'''
hints = [
    "You need a step counter and a loop that keeps going while `n` isn't 1. Can `n` change if it's not `mut`?",
    "Make the parameter `mut n: u64`, use `while n != 1`, and inside use `if n % 2 == 0` to pick the next value. Count each step.",
    "```rust\nfn collatz_steps(mut n: u64) -> u32 {\n    let mut steps = 0;\n    while n != 1 {\n        n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };\n        steps += 1;\n    }\n    steps\n}\n```",
]

[[level]]
id = "2.labels"
title = "Escape the maze of loops"
kind = "fill"
book = ["3.5"]
xp = 35
goal = '''Stop BOTH loops at the first match, so it prints:
3 x 4 = 12'''
lesson = '''
A plain `break` only leaves the **innermost** loop. To leave an outer loop, give it a **label** (a name starting with `'`):

```rust
'outer: for a in 1..=5 {
    for b in 1..=5 {
        if a * b == 6 {
            break 'outer; // leaves BOTH loops
        }
    }
}
```

`continue 'outer` works the same way.
'''
c_compare = '''
In C you'd need a `goto` or a flag variable. Labels are the safe, structured version.
'''
py_compare = '''
Python has no loop labels. You'd use a flag or a function with `return`.
'''
check = "output"
expected_output = "3 x 4 = 12"
starter = '''
fn main() {
    let mut found = (0, 0);
    for a in 1..=5 {
        for b in 1..=5 {
            if a * b == 12 {
                found = (a, b);
                // TODO: stop BOTH loops here
            }
        }
    }
    println!("{} x {} = 12", found.0, found.1);
}
'''
solution = '''
fn main() {
    let mut found = (0, 0);
    'outer: for a in 1..=5 {
        for b in 1..=5 {
            if a * b == 12 {
                found = (a, b);
                break 'outer;
            }
        }
    }
    println!("{} x {} = 12", found.0, found.1);
}
'''
hints = [
    "Right now the loops keep going and find another pair later. How do you stop the outer loop from inside the inner one?",
    "Put a label like `'outer:` before the first `for`, then use `break 'outer;`.",
    "Write `'outer: for a in 1..=5 {` and replace the TODO with `break 'outer;`.",
]

[[level]]
id = "2.8"
title = "BOSS: FizzBuzz Arena"
kind = "boss"
book = ["3.3", "3.5"]
xp = 70
goal = '''Write `fizzbuzz(n)` returning a String:
"FizzBuzz" if n is divisible by 3 and 5, "Fizz" if by 3, "Buzz" if by 5, otherwise the number itself.'''
lesson = '''
**Boss fight!** The classic interview question, Rust style.

For text you can *build and own*, Rust uses **`String`**:

```rust
let s = String::from("Fizz");   // text → String
let t = 42.to_string();         // number → String
```

(Plain `"Fizz"` is a `&str`, a borrowed view of text. The difference will make sense in the Ownership Caves and on Borrow Bridge.)

Tip: check the "divisible by both" case **first**. And remember that `if`/`else if`/`else` is an expression, so it can be the whole function body!
'''
c_compare = '''
In C you'd write into a `char` buffer and hope it's big enough. A `String` grows itself and frees itself.
'''
py_compare = '''
`String::from("Fizz")` is like a normal Python `str`, and `n.to_string()` is like `str(n)`.
'''
check = "tests"
starter = '''
fn fizzbuzz(n: u32) -> String {
    todo!()
}

fn main() {
    for n in 1..=15 {
        println!("{}", fizzbuzz(n));
    }
}
'''
solution = '''
fn fizzbuzz(n: u32) -> String {
    if n % 15 == 0 {
        String::from("FizzBuzz")
    } else if n % 3 == 0 {
        String::from("Fizz")
    } else if n % 5 == 0 {
        String::from("Buzz")
    } else {
        n.to_string()
    }
}

fn main() {
    for n in 1..=15 {
        println!("{}", fizzbuzz(n));
    }
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn plain_numbers() {
        assert_eq!(fizzbuzz(1), "1");
        assert_eq!(fizzbuzz(98), "98");
    }

    #[test]
    fn fizz() {
        assert_eq!(fizzbuzz(3), "Fizz");
        assert_eq!(fizzbuzz(9), "Fizz");
    }

    #[test]
    fn buzz() {
        assert_eq!(fizzbuzz(5), "Buzz");
        assert_eq!(fizzbuzz(20), "Buzz");
    }

    #[test]
    fn fizzbuzz_both() {
        assert_eq!(fizzbuzz(15), "FizzBuzz");
        assert_eq!(fizzbuzz(45), "FizzBuzz");
    }
}
'''
hints = [
    "There are four cases. In which order should you check them so that 15 doesn't get caught as just \"Fizz\"?",
    "Use `if n % 15 == 0 { ... } else if n % 3 == 0 { ... } else if ...`. Each branch must produce a `String`: use `String::from(\"Fizz\")` for words and `n.to_string()` for the number.",
    "```rust\nif n % 15 == 0 {\n    String::from(\"FizzBuzz\")\n} else if n % 3 == 0 {\n    String::from(\"Fizz\")\n} else if n % 5 == 0 {\n    String::from(\"Buzz\")\n} else {\n    n.to_string()\n}\n```",
]
