lesson = '''
**Boss fight!** A text adventure reads lines like these:

| Typed | Result |
|---|---|
| `look` or `l` | `Command::Look` |
| `go north` (or `n`, `south`/`s`, `east`/`e`, `west`/`w`) | `Command::Go(Dir::North)` |
| `take lamp` | `Command::Take { item: "lamp", count: 1 }` |
| `take 3 coins` | `Command::Take { item: "coins", count: 3 }` |
| `drop lamp` | `Command::Drop("lamp")` |
| `quit` or `q` | `Command::Quit` |

Errors: an empty line is `Empty`; a bad direction is `BadDirection(word)`; a count that isn't a number of at least 1 is `BadCount(word)`; anything else is `UnknownVerb(first word)`. Upper and lower case both work.

The new trick: **slice patterns**. Split the line into a `Vec<&str>` and match its shape:

```rust
let words: Vec<&str> = line.split_whitespace().collect();
match words.as_slice() {
    [] => ...,                       // no words
    ["look" | "l"] => ...,           // exactly one word
    ["go", dir] => ...,              // "go" plus one more word, named dir
    [verb, ..] => ...,               // anything else; verb is the first word
}
```

To check a count, match the parse result: `Ok(n @ 1..)` matches any number from 1 up.
'''
