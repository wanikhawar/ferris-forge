solution = '''
#[derive(Debug, PartialEq)]
enum Dir {
    North,
    South,
    East,
    West,
}

#[derive(Debug, PartialEq)]
enum Command {
    Look,
    Go(Dir),
    Take { item: String, count: u32 },
    Drop(String),
    Quit,
}

#[derive(Debug, PartialEq)]
enum ParseError {
    Empty,
    UnknownVerb(String),
    BadDirection(String),
    BadCount(String),
}

/// "north" or "n" -> Dir::North, and so on. Anything else is BadDirection.
fn direction(word: &str) -> Result<Dir, ParseError> {
    match word {
        "north" | "n" => Ok(Dir::North),
        "south" | "s" => Ok(Dir::South),
        "east" | "e" => Ok(Dir::East),
        "west" | "w" => Ok(Dir::West),
        other => Err(ParseError::BadDirection(other.to_string())),
    }
}

fn parse(line: &str) -> Result<Command, ParseError> {
    let line = line.to_lowercase();
    let words: Vec<&str> = line.split_whitespace().collect();
    match words.as_slice() {
        [] => Err(ParseError::Empty),
        ["look" | "l"] => Ok(Command::Look),
        ["go", dir] => Ok(Command::Go(direction(dir)?)),
        ["take", item] => Ok(Command::Take { item: item.to_string(), count: 1 }),
        ["take", count, item] => match count.parse::<u32>() {
            Ok(n @ 1..) => Ok(Command::Take { item: item.to_string(), count: n }),
            _ => Err(ParseError::BadCount(count.to_string())),
        },
        ["drop", item] => Ok(Command::Drop(item.to_string())),
        ["quit" | "q"] => Ok(Command::Quit),
        [verb, ..] => Err(ParseError::UnknownVerb(verb.to_string())),
    }
}

fn main() {
    for line in ["look", "go north", "take 3 coins", "dance"] {
        println!("{line:>12} -> {:?}", parse(line));
    }
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn take(item: &str, count: u32) -> Result<Command, ParseError> {
        Ok(Command::Take { item: item.to_string(), count })
    }

    #[test]
    fn simple_commands() {
        assert_eq!(parse("look"), Ok(Command::Look));
        assert_eq!(parse("l"), Ok(Command::Look));
        assert_eq!(parse("quit"), Ok(Command::Quit));
        assert_eq!(parse("q"), Ok(Command::Quit));
        assert_eq!(parse("  LOOK  "), Ok(Command::Look));
    }

    #[test]
    fn going_places() {
        assert_eq!(parse("go north"), Ok(Command::Go(Dir::North)));
        assert_eq!(parse("Go S"), Ok(Command::Go(Dir::South)));
        assert_eq!(parse("go e"), Ok(Command::Go(Dir::East)));
        assert_eq!(parse("go west"), Ok(Command::Go(Dir::West)));
        assert_eq!(parse("go up"), Err(ParseError::BadDirection("up".to_string())));
    }

    #[test]
    fn items() {
        assert_eq!(parse("take lamp"), take("lamp", 1));
        assert_eq!(parse("take 3 coins"), take("coins", 3));
        assert_eq!(parse("take 0 coins"), Err(ParseError::BadCount("0".to_string())));
        assert_eq!(parse("take many coins"), Err(ParseError::BadCount("many".to_string())));
        assert_eq!(parse("drop lamp"), Ok(Command::Drop("lamp".to_string())));
    }

    #[test]
    fn nonsense() {
        assert_eq!(parse(""), Err(ParseError::Empty));
        assert_eq!(parse("   "), Err(ParseError::Empty));
        assert_eq!(parse("dance wildly"), Err(ParseError::UnknownVerb("dance".to_string())));
        assert_eq!(parse("look around please"), Err(ParseError::UnknownVerb("look".to_string())));
    }
}
'''
