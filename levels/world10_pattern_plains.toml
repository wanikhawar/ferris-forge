    "```rust\nlet Some((name, score)) = line.split_once(':') else {\n    return None;\n};\nlet Ok(score) = score.parse::<u32>() else {\n    return None;\n};\nSome((name, score))\n```",
]

[[level]]
id = "10.3"
title = "Might not match"
kind = "fix"
book = ["19.2"]
xp = 40
goal = '''Some lines have no words. Handle that case, so it prints:
first word: hello
no words
first word: crab'''
lesson = '''
Patterns come in two flavors:

- **Irrefutable**: always matches. `x`, `(a, b)` for a pair, `Point { x, y }`.
- **Refutable**: might not match. `Some(x)` fails on `None`, `Ok(v)` fails on `Err`.

A plain `let` and a `for` loop need **irrefutable** patterns, because there's nothing sensible to do if the value doesn't fit:

```rust
let Some(word) = first_word(line);   // error[E0005]: refutable pattern in local binding
```

For a refutable pattern, say what happens when it fails, with `if let`, `let...else` or `match`. (The reverse, `if let x = 5`, compiles but warns: that `if` can never be false.)
'''
c_compare = '''
In C, forgetting the `NULL` case compiles and crashes later. Rust refuses to compile a `let` that might not match.
'''
py_compare = '''
Like `a, b = [1]` raising `ValueError` at runtime, except Rust catches it at compile time.
'''
check = "output"
expected_output = '''
first word: hello
no words
first word: crab
'''
starter = '''
fn first_word(text: &str) -> Option<&str> {
    text.split_whitespace().next()
}

fn main() {
    let lines = ["hello world", "", "  crab  "];
    for line in lines {
        let Some(word) = first_word(line);
        println!("first word: {word}");
    }
}
'''
solution = '''
fn first_word(text: &str) -> Option<&str> {
    text.split_whitespace().next()
}

fn main() {
    let lines = ["hello world", "", "  crab  "];
    for line in lines {
        let Some(word) = first_word(line) else {
            println!("no words");
            continue;
        };
        println!("first word: {word}");
    }
}
'''
hints = [
    "`Some(word)` doesn't match `None`, so a plain `let` can't use it. What should happen when the line is empty?",
    "Add an `else` block to that `let`: print `no words`, then `continue` to the next line. (`if let` / `else` works too.)",
    "```rust\nlet Some(word) = first_word(line) else {\n    println!(\"no words\");\n    continue;\n};\n```",
]

[[level]]
id = "10.4"
title = "The pattern toolkit"
kind = "fill"
book = ["19.3"]
xp = 45
goal = "Sort rocks by weight and characters by kind, using literals, | and ranges in match arms."
lesson = '''
A `match` arm can match much more than one value:

```rust
match n {
    0 => "zero",            // a literal
    1 | 2 => "a couple",    // | means "or"
    3..=9 => "a few",       // an inclusive range
    _ => "lots",            // anything else
}
```

Ranges work on numbers and on `char`s:

```rust
match c {
    'a'..='j' => "early letter",
    'k'..='z' => "late letter",
    _ => "something else",
}
```

Arms are tried **from top to bottom**, and the first that matches wins. That lets an early, specific arm (like the vowels) take priority over a later, wider one (all letters).
'''
c_compare = '''
Like a `switch` with case ranges and fallthrough lists built in, but no `break` to forget, and the compiler checks that every value is covered.
'''
py_compare = '''
Python's `match` has `|` (`case 1 | 2:`) but no ranges; you'd need a guard like `case n if 3 <= n <= 9:`.
'''
check = "tests"
starter = '''
/// 0 -> "dust", 1 or 2 -> "pebble", 3 to 9 -> "rock", anything bigger -> "boulder"
fn sort_rock(weight: u32) -> &'static str {
    todo!()
}

/// a e i o u -> "vowel", other lowercase letters -> "consonant",
/// '0' to '9' -> "digit", anything else -> "other"
fn kind_of(c: char) -> &'static str {
    todo!()
}

fn main() {
    println!("{} {}", sort_rock(5), kind_of('e'));
}
'''
solution = '''
/// 0 -> "dust", 1 or 2 -> "pebble", 3 to 9 -> "rock", anything bigger -> "boulder"
fn sort_rock(weight: u32) -> &'static str {
    match weight {
        0 => "dust",
        1 | 2 => "pebble",
        3..=9 => "rock",
        _ => "boulder",
    }
}

/// a e i o u -> "vowel", other lowercase letters -> "consonant",
/// '0' to '9' -> "digit", anything else -> "other"
fn kind_of(c: char) -> &'static str {
    match c {
        'a' | 'e' | 'i' | 'o' | 'u' => "vowel",
        'a'..='z' => "consonant",
        '0'..='9' => "digit",
        _ => "other",
    }
}

fn main() {
    println!("{} {}", sort_rock(5), kind_of('e'));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn rocks() {
        assert_eq!(sort_rock(0), "dust");
        assert_eq!(sort_rock(1), "pebble");
        assert_eq!(sort_rock(2), "pebble");
        assert_eq!(sort_rock(3), "rock");
        assert_eq!(sort_rock(9), "rock");
        assert_eq!(sort_rock(10), "boulder");
        assert_eq!(sort_rock(500), "boulder");
    }

    #[test]
    fn characters() {
        assert_eq!(kind_of('a'), "vowel");
        assert_eq!(kind_of('u'), "vowel");
        assert_eq!(kind_of('b'), "consonant");
        assert_eq!(kind_of('z'), "consonant");
        assert_eq!(kind_of('0'), "digit");
        assert_eq!(kind_of('9'), "digit");
        assert_eq!(kind_of('A'), "other");
        assert_eq!(kind_of('?'), "other");
    }
}
'''
