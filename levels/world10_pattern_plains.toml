    "Put the vowels arm (`'a' | 'e' | 'i' | 'o' | 'u'`) before the `'a'..='z'` arm, since the first matching arm wins.",
    "```rust\nmatch weight {\n    0 => \"dust\",\n    1 | 2 => \"pebble\",\n    3..=9 => \"rock\",\n    _ => \"boulder\",\n}\n```",
]

