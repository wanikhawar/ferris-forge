[[level]]
id = "10.1"
title = "Patterns everywhere"
kind = "predict"
book = ["19.1"]
xp = 25
goal = "What does this print?"
lesson = '''
You've used **patterns** since your first `match`, but they hide in many more places:

```rust
let (a, b) = (1, 2);                  // let takes a pattern, not just a name
for (i, ch) in "ab".chars().enumerate() { }   // so does for
while let Some(top) = stack.pop() { }  // loop while the pattern matches
fn show(&(x, y): &(i32, i32)) { }      // and so do function parameters
```

Even a plain `let x = 5;` is a pattern: `x` is a pattern that matches anything and gives it a name.

A pattern describes the **shape** of a value. If the value has that shape, the pattern's names get bound to its parts.
'''
c_compare = '''
C has nothing like it: you'd write `int a = t.first; int b = t.second;` by hand. Patterns pull a value apart in one step, and the compiler checks the shape.
'''
py_compare = '''
Like Python's unpacking (`a, b = 1, 2` and `for i, ch in enumerate("ab")`), but it works for structs and enums too, and the compiler checks the shape before the program runs.
'''
starter = '''
fn print_point(&(x, y): &(i32, i32)) {
    println!("({x}, {y})");
}

fn main() {
    let (a, b, c) = (1, 2, 3);
    println!("{a}{b}{c}");

    let mut stack = vec![1, 2, 3];
    while let Some(top) = stack.pop() {
        print!("{top}");
    }
    println!();

    for (i, ch) in "ab".chars().enumerate() {
        println!("{i}:{ch}");
    }

    print_point(&(5, -1));
}
'''
choices = [
    "123 / 123 / 0:a / 1:b / (5, -1)",
    "123 / 321 / 0:a / 1:b / (5, -1)",
    "It doesn't compile: function parameters can't be patterns",
    "123 / 321 / a:0 / b:1 / (5, -1)",
]
answer = 1
expected_output = '''
123
321
0:a
1:b
(5, -1)
'''
explanation = "`let (a, b, c)` unpacks the tuple. `pop` takes from the end, so `while let` sees 3, 2, 1 and stops at `None`. `enumerate` gives `(index, item)` pairs, and the parameter `&(x, y)` unpacks the borrowed tuple."

[[level]]
id = "10.2"
title = "If it fits: if let and let...else"
kind = "fill"
book = ["19.1"]
xp = 45
goal = "Write background (an if let / else if chain) and parse_score (two let...else checks)."
lesson = '''
When you care about just **one** shape, a full `match` is long. `if let` checks one pattern:

```rust
if let Some(color) = favorite {
    println!("using {color}");
} else if is_tuesday {
    println!("green day");
} else if let Ok(age) = age {
    println!("age {age}");
} else {
    println!("blue");
}
```

You can mix `if let`, `else if` and `else if let` freely.

**`let...else`** is the opposite: it says "this must match, otherwise leave":

```rust
let Some((name, score)) = line.split_once(':') else {
    return None;   // the else block must leave: return, break, continue or panic
};
// name and score are usable from here on
```
'''
c_compare = '''
`let...else` is the early-return guard you'd write in C (`if (!p) return NULL;`), except it also unpacks the value for the rest of the function.
'''
py_compare = '''
`if let Some(x) = value:` is like `if (x := value) is not None:`. `let...else` is a guard clause that also unpacks.
'''
check = "tests"
starter = '''
use std::num::ParseIntError;

/// Pick a background color:
/// - a favorite color, if there is one
/// - otherwise "green" on Tuesdays
/// - otherwise, if the age parsed: "purple" when over 30, else "orange"
/// - otherwise "blue"
fn background(favorite: Option<&str>, is_tuesday: bool, age: Result<u8, ParseIntError>) -> String {
    todo!()
}

/// "Ferris:7" -> Some(("Ferris", 7)). No ':' or a bad number -> None.
/// Use let...else for both checks.
fn parse_score(line: &str) -> Option<(&str, u32)> {
    todo!()
}

fn main() {
    println!("{}", background(None, false, "34".parse()));
    println!("{:?}", parse_score("Ferris:7"));
}
'''
solution = '''
use std::num::ParseIntError;

/// Pick a background color:
/// - a favorite color, if there is one
/// - otherwise "green" on Tuesdays
/// - otherwise, if the age parsed: "purple" when over 30, else "orange"
/// - otherwise "blue"
fn background(favorite: Option<&str>, is_tuesday: bool, age: Result<u8, ParseIntError>) -> String {
    if let Some(color) = favorite {
        color.to_string()
    } else if is_tuesday {
        "green".to_string()
    } else if let Ok(age) = age {
        if age > 30 { "purple".to_string() } else { "orange".to_string() }
    } else {
        "blue".to_string()
    }
}

/// "Ferris:7" -> Some(("Ferris", 7)). No ':' or a bad number -> None.
/// Use let...else for both checks.
fn parse_score(line: &str) -> Option<(&str, u32)> {
    let Some((name, score)) = line.split_once(':') else {
        return None;
    };
    let Ok(score) = score.parse::<u32>() else {
        return None;
    };
    Some((name, score))
}

fn main() {
    println!("{}", background(None, false, "34".parse()));
    println!("{:?}", parse_score("Ferris:7"));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn favorite_wins() {
        assert_eq!(background(Some("red"), true, "40".parse()), "red");
    }

    #[test]
    fn tuesday_then_age() {
        assert_eq!(background(None, true, "40".parse()), "green");
        assert_eq!(background(None, false, "34".parse()), "purple");
        assert_eq!(background(None, false, "12".parse()), "orange");
        assert_eq!(background(None, false, "old".parse()), "blue");
    }

    #[test]
    fn scores() {
        assert_eq!(parse_score("Ferris:7"), Some(("Ferris", 7)));
        assert_eq!(parse_score("Corro:0"), Some(("Corro", 0)));
        assert_eq!(parse_score("no colon"), None);
        assert_eq!(parse_score("Ferris:lots"), None);
    }
}
'''
