solution = '''
struct Point {
    x: i32,
    y: i32,
}

enum Color {
    Rgb(u8, u8, u8),
    Hsv(u16, u8, u8),
}

enum Message {
    Quit,
    Move { x: i32, y: i32 },
    Write(String),
    ChangeColor(Color),
}

/// "the origin", "on the x axis at 3", "on the y axis at -2", or "at (1, 2)"
fn locate(p: &Point) -> String {
    match p {
        Point { x: 0, y: 0 } => "the origin".to_string(),
        Point { x, y: 0 } => format!("on the x axis at {x}"),
        Point { x: 0, y } => format!("on the y axis at {y}"),
        Point { x, y } => format!("at ({x}, {y})"),
    }
}

/// "quit", "move to 3,4", "write: hi", "rgb 255 0 0" or "hsv 120 50 50"
fn describe(msg: &Message) -> String {
    match msg {
        Message::Quit => "quit".to_string(),
        Message::Move { x, y } => format!("move to {x},{y}"),
        Message::Write(text) => format!("write: {text}"),
        Message::ChangeColor(Color::Rgb(r, g, b)) => format!("rgb {r} {g} {b}"),
        Message::ChangeColor(Color::Hsv(h, s, v)) => format!("hsv {h} {s} {v}"),
    }
}

fn main() {
    println!("{}", locate(&Point { x: 3, y: 0 }));
    println!("{}", describe(&Message::Move { x: 3, y: 4 }));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn points() {
        assert_eq!(locate(&Point { x: 0, y: 0 }), "the origin");
        assert_eq!(locate(&Point { x: 3, y: 0 }), "on the x axis at 3");
        assert_eq!(locate(&Point { x: 0, y: -2 }), "on the y axis at -2");
        assert_eq!(locate(&Point { x: 1, y: 2 }), "at (1, 2)");
    }

    #[test]
    fn messages() {
        assert_eq!(describe(&Message::Quit), "quit");
        assert_eq!(describe(&Message::Move { x: 3, y: 4 }), "move to 3,4");
        assert_eq!(describe(&Message::Write("hi".to_string())), "write: hi");
        assert_eq!(describe(&Message::ChangeColor(Color::Rgb(255, 0, 0))), "rgb 255 0 0");
        assert_eq!(describe(&Message::ChangeColor(Color::Hsv(120, 50, 50))), "hsv 120 50 50");
    }
}
'''
hints = [
    "locate needs four arms, from most specific (both 0) to most general. describe needs one arm per variant, and two for ChangeColor.",
    "Mix literals and names in one pattern: `Point { x, y: 0 }` matches only when y is 0 and names x. Nest enums: `Message::ChangeColor(Color::Rgb(r, g, b))`.",
    "```rust\nmatch p {\n    Point { x: 0, y: 0 } => \"the origin\".to_string(),\n    Point { x, y: 0 } => format!(\"on the x axis at {x}\"),\n    Point { x: 0, y } => format!(\"on the y axis at {y}\"),\n    Point { x, y } => format!(\"at ({x}, {y})\"),\n}\n```",
]

[[level]]
id = "10.6"
title = "Ignore it, guard it, name it"
kind = "fill"
book = ["19.3"]
xp = 50
goal = "Use .., _, match guards and @ bindings to finish four small functions."
lesson = '''
Four more tools:

**Ignore** parts you don't need: `_` skips one value, `..` skips all the rest.

```rust
let (first, .., last) = (1, 2, 3, 4, 5);   // first = 1, last = 5
```

**Guard** an arm with an extra condition:

```rust
match n {
    Some(x) if x < 0 => "negative",
    Some(_) => "zero or more",
    None => "nothing",
}
```

**Name** a value while testing it with `@`:

```rust
match age {
    kid @ 0..=12 => format!("child ({kid})"),
    ...
}
```

Without `@` you could test the range *or* keep the value, but not both.
'''
c_compare = '''
A guard is an `if` folded into a `case`. `@` saves you from repeating the value you just switched on.
'''
py_compare = '''
Python has guards (`case x if x < 0:`), and `@` is like `case int(n) as age:` with the `as` name.
'''
check = "tests"
starter = '''
/// The first plus the last of five numbers. Use (first, .., last).
fn ends(numbers: (i32, i32, i32, i32, i32)) -> i32 {
    todo!()
}

/// 0-12 -> "child (7)", 13-19 -> "teen (15)", anything else -> "adult (40)". Use @.
fn ticket(age: u32) -> String {
    todo!()
}

/// None -> "nothing", negative -> "negative", even -> "even", odd -> "odd". Use guards.
fn parity(n: Option<i32>) -> &'static str {
    todo!()
}

/// A setting that is already set can't be overwritten: keep it.
/// Otherwise the new value wins (even if it is None). Use _ in the patterns.
fn update(current: Option<i32>, new: Option<i32>) -> Option<i32> {
    todo!()
}

fn main() {
    println!("{} {} {}", ends((1, 2, 3, 4, 5)), ticket(7), parity(Some(4)));
    println!("{:?}", update(Some(3), Some(5)));
}
'''
solution = '''
/// The first plus the last of five numbers. Use (first, .., last).
fn ends(numbers: (i32, i32, i32, i32, i32)) -> i32 {
    let (first, .., last) = numbers;
    first + last
}

/// 0-12 -> "child (7)", 13-19 -> "teen (15)", anything else -> "adult (40)". Use @.
fn ticket(age: u32) -> String {
    match age {
        kid @ 0..=12 => format!("child ({kid})"),
        teen @ 13..=19 => format!("teen ({teen})"),
        adult => format!("adult ({adult})"),
    }
}

/// None -> "nothing", negative -> "negative", even -> "even", odd -> "odd". Use guards.
fn parity(n: Option<i32>) -> &'static str {
    match n {
        None => "nothing",
        Some(x) if x < 0 => "negative",
        Some(x) if x % 2 == 0 => "even",
        Some(_) => "odd",
    }
}

/// A setting that is already set can't be overwritten: keep it.
/// Otherwise the new value wins (even if it is None). Use _ in the patterns.
fn update(current: Option<i32>, new: Option<i32>) -> Option<i32> {
    match (current, new) {
        (Some(_), Some(_)) => current,
        _ => new,
    }
}

fn main() {
    println!("{} {} {}", ends((1, 2, 3, 4, 5)), ticket(7), parity(Some(4)));
    println!("{:?}", update(Some(3), Some(5)));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn first_and_last() {
        assert_eq!(ends((1, 2, 3, 4, 5)), 6);
        assert_eq!(ends((10, 0, 0, 0, -3)), 7);
    }

    #[test]
    fn tickets() {
        assert_eq!(ticket(0), "child (0)");
        assert_eq!(ticket(12), "child (12)");
        assert_eq!(ticket(15), "teen (15)");
        assert_eq!(ticket(40), "adult (40)");
    }

    #[test]
    fn guards() {
        assert_eq!(parity(None), "nothing");
        assert_eq!(parity(Some(-3)), "negative");
        assert_eq!(parity(Some(4)), "even");
        assert_eq!(parity(Some(0)), "even");
        assert_eq!(parity(Some(7)), "odd");
    }

    #[test]
    fn settings() {
        assert_eq!(update(Some(3), Some(5)), Some(3));
        assert_eq!(update(None, Some(5)), Some(5));
        assert_eq!(update(Some(3), None), None);
        assert_eq!(update(None, None), None);
    }
}
'''
