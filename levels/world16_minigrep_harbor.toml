lesson = '''
Welcome to the harbor! Over this island you'll build **minigrep**, a small version of the classic `grep` tool: give it a word and a file, and it prints every line of the file that contains the word.

```text
$ minigrep frog poem.txt
How public, like a frog
```

Step one: read the **command-line arguments**. `std::env::args()` returns an iterator over them, and `collect` turns it into a `Vec<String>`:

```rust
use std::env;

let args: Vec<String> = env::args().collect();
```

The first item, `args[0]`, is the program's own name. The arguments the user typed come after it:

| Index | Value |
|---|---|
| `args[0]` | `minigrep` (the program) |
| `args[1]` | `frog` |
| `args[2]` | `poem.txt` |

`collect` can build many kinds of collections, so you have to say which one you want with the type annotation.

Here, the game passes the arguments for you (see the **Expected** tab under **Output**).
'''
c_compare = '''
Exactly `argc`/`argv` from `int main(int argc, char **argv)`, as a Vec of real Strings. `args[0]` is the program name, just like `argv[0]`.
'''
py_compare = '''
Like `sys.argv`: `sys.argv[0]` is the script, and the user's arguments follow.
'''
check = "output"
args = ["frog", "poem.txt"]
expected_output = '''
Searching for frog
In file poem.txt
'''
