**Boss fight!** Put the whole tool together, from an empty `main`:

1. **Arguments**: the query and the file path (`env::args()`). If one is missing, print an error with `eprintln!` and stop.
2. **Settings**: search case-insensitively when the `IGNORE_CASE` environment variable is set.
3. **Reading**: read the file with `fs::read_to_string`. If that fails, `eprintln!` the error and stop.
4. **Searching**: find the matching lines.
5. **Printing**: each match with its **line number** (counting from 1, blank lines count too), as `N: line`. Then a summary line: `N matching lines`.

The structure from this island is a good plan: a `Config` with `build`, a `run` function that returns `Result<(), Box<dyn Error>>`, and `search` functions written as iterator chains.

Line numbers: `contents.lines().enumerate()` gives `(index, line)` pairs, with the index counting from 0.

The harbor passes the arguments and sets `IGNORE_CASE` for you, and `poem.txt` is next to your program.
'''
