[[level]]
id = "16.3"
title = "Tidying the ship"
kind = "fix"
book = ["12.3"]
xp = 55
goal = "Make Config::build return a Result instead of panicking, and make run return a Result instead of calling expect."
lesson = '''
`main` is getting crowded. The usual shape for a Rust command-line program:

- **`main.rs`** only collects the arguments, calls the setup, and reports errors.
- A **`Config`** struct holds the settings, built by `Config::build`.
- A **`run`** function does the real work.

Both setup and work can fail, and neither should crash the program. They return a `Result` and let `main` decide what to do:

```rust
impl Config {
    fn build(args: &[String]) -> Result<Config, &'static str> {
        if args.len() < 3 {
            return Err("not enough arguments");
        }
        Ok(Config { query: args[1].clone(), file_path: args[2].clone() })
    }
}

fn run(config: Config) -> Result<(), Box<dyn Error>> {
    let contents = fs::read_to_string(config.file_path)?;   // ? passes the error up
    println!("With text:\n{contents}");
    Ok(())
}
```

`Box<dyn Error>` means "any kind of error". In `main`:

```rust
let config = Config::build(&args).unwrap_or_else(|err| {
    println!("Problem parsing arguments: {err}");
    process::exit(1);
});

if let Err(e) = run(config) {
    println!("Application error: {e}");
    process::exit(1);
}
```

`process::exit(1)` stops the program with a failure code, without the noisy panic message.
'''
c_compare = '''
Like returning an error code from `parse_args()` and `run()` instead of calling `abort()` deep inside them, except the compiler makes sure every caller deals with the error.
'''
py_compare = '''
Like raising a clear exception from `parse_args` and catching it once in `main` to print a friendly message and `sys.exit(1)`.
'''
check = "tests"
args = ["frog", "poem.txt"]
