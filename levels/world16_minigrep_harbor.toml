lesson = '''
Now that you know iterators, minigrep can lose some clutter.

**1. No more `clone`.** `build` borrowed a slice of Strings, so it had to clone each one to own it. Instead, give `build` the iterator from `env::args()` and let it take the Strings out one by one:

```rust
pub fn build(mut args: impl Iterator<Item = String>) -> Result<Config, &'static str> {
    args.next();   // skip the program name

    let query = match args.next() {
        Some(arg) => arg,
        None => return Err("Didn't get a query string"),
    };
    // ... same for file_path
}

// in main:
let config = Config::build(env::args()).unwrap_or_else(...);
```

`impl Iterator<Item = String>` means "any iterator that hands out Strings". It must be `mut`, because calling `next` changes where the iterator is.

**2. Search with a chain.** The loop with a temporary Vec becomes:

```rust
contents.lines().filter(|line| line.contains(query)).collect()
```
'''
c_compare = '''
Instead of copying each `argv[i]` into a new buffer, the strings are handed over: the iterator gives up ownership as it goes.
'''
py_compare = '''
Like `it = iter(sys.argv); next(it); query = next(it, None)`, but every missing value has to be handled.
'''
