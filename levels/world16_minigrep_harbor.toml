`env::var` is `getenv`, but it returns a Result instead of a possibly-NULL pointer, and the text is checked to be valid UTF-8.
'''
py_compare = '''
`env::var("IGNORE_CASE").is_ok()` is `"IGNORE_CASE" in os.environ`.
'''
