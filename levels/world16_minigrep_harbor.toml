goal = '''Add case-insensitive search, switched on when the IGNORE_CASE environment variable is set.
The harbor runs `IGNORE_CASE=1 minigrep to poem.txt`, which should print the four lines that contain "to" or "To".'''
lesson = '''
Users want to search without caring about capitals, but they don't want to type an extra flag every time. A good fit for an **environment variable**: set it once in the terminal, and it applies to every run.

```rust
use std::env;

let ignore_case = env::var("IGNORE_CASE").is_ok();
```

`env::var` returns `Ok(value)` if the variable is set, and `Err` if it isn't. We only care whether it exists, so `.is_ok()` is enough.

For the search itself, lowercase both sides before comparing:

```rust
let query = query.to_lowercase();          // a new String
for line in contents.lines() {
    if line.to_lowercase().contains(&query) {
        results.push(line);                // push the original line, not the lowercase copy
    }
}
```

`to_lowercase` makes a new `String`, so `query` is now a `String` and needs a `&` when passed to `contains`.

Here, the harbor sets `IGNORE_CASE=1` for you.
'''
