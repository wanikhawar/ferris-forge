lesson = '''
Time for the heart of minigrep: the `search` function. Let's build it **test first** (test-driven development, or TDD):

1. Write a test that fails, because the feature doesn't exist yet.
2. Write just enough code to make it pass.
3. Tidy up, and repeat.

```rust
pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
    let mut results = Vec::new();
    for line in contents.lines() {
        if line.contains(query) {
            results.push(line);
        }
    }
    results
}
```

Notice the lifetime `'a`: the lines returned are slices **of `contents`**, so they can live as long as `contents` does. They have nothing to do with `query`.

Useful String methods: `contents.lines()` gives each line, and `line.contains(query)` checks for the word.
'''
c_compare = '''
The results are pointers into the original buffer, like `strstr` results, but the lifetime `'a` makes sure the buffer outlives them.
'''
py_compare = '''
Like `[line for line in contents.splitlines() if query in line]`, but without copying the lines: each result points into `contents`.
'''
