lesson = '''
A program has two output streams:

| Stream | Macro | For |
|---|---|---|
| standard output | `println!` | the results |
| standard error | `eprintln!` | error messages and warnings |

Why bother? Because users **redirect** output:

```text
$ minigrep frog poem.txt > results.txt
```

Everything printed with `println!` goes into `results.txt`. If your error messages go there too, the user sees nothing in the terminal and finds garbage in their file. `eprintln!` messages still show up on the screen.

This version of minigrep searches several files. One of them doesn't exist, and that complaint is printed to the wrong place.
'''
c_compare = '''
`println!` is `printf` (stdout) and `eprintln!` is `fprintf(stderr, ...)`.
'''
py_compare = '''
`eprintln!(...)` is `print(..., file=sys.stderr)`.
'''
