[[level]]
id = "7.7"
title = "Counting words"
kind = "fill"
book = ["8.3"]
xp = 50
goal = "Write count_words: how many times does each word appear?"
lesson = '''
Updating a map value based on the old one is so common that HashMap has the **entry API**:

```rust
let count = map.entry(word).or_insert(0);  // get the value, inserting 0 if missing
*count += 1;                               // count is a &mut, so change it through *
```

`entry(...).or_insert(...)` returns a mutable reference to the value in the map.
'''
c_compare = '''
In C this would be a lookup, then an insert if missing, then an update: three separate steps and three chances for a bug.
'''
py_compare = '''
Like `counts[w] = counts.get(w, 0) + 1`, or a `collections.Counter`.
'''
check = "tests"
starter = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<String, u32> {
    todo!()
}

fn main() {
    let counts = count_words("the crab saw the sea");
    println!("the: {}", counts["the"]);
}
'''
solution = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<String, u32> {
    let mut counts = HashMap::new();
    for word in text.split_whitespace() {
        let count = counts.entry(word.to_string()).or_insert(0);
        *count += 1;
    }
    counts
}

fn main() {
    let counts = count_words("the crab saw the sea");
    println!("the: {}", counts["the"]);
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_each_word() {
        let c = count_words("the crab saw the sea the end");
        assert_eq!(c["the"], 3);
        assert_eq!(c["crab"], 1);
        assert_eq!(c.len(), 5);
    }

    #[test]
    fn empty_text() {
        assert!(count_words("").is_empty());
    }
}
'''
