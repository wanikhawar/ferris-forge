solution = '''
use std::collections::HashMap;

struct Gradebook {
    scores: HashMap<String, Vec<u32>>,
}

impl Gradebook {
    fn new() -> Self {
        Gradebook { scores: HashMap::new() }
    }

    fn add(&mut self, name: &str, score: u32) {
        self.scores.entry(name.to_string()).or_default().push(score);
    }

    fn average(&self, name: &str) -> Option<f64> {
        let list = self.scores.get(name)?;
        if list.is_empty() {
            return None;
        }
        let mut sum = 0;
        for s in list {
            sum += s;
        }
        Some(sum as f64 / list.len() as f64)
    }

    fn best_student(&self) -> Option<String> {
        let mut best: Option<(String, f64)> = None;
        for name in self.names() {
            let avg = self.average(&name).unwrap_or(0.0);
            let better = match &best {
                None => true,
                Some((_, best_avg)) => avg > *best_avg,
            };
            if better {
                best = Some((name, avg));
            }
        }
        best.map(|(name, _)| name)
    }

    fn names(&self) -> Vec<String> {
        let mut names: Vec<String> = Vec::new();
        for name in self.scores.keys() {
            names.push(name.clone());
        }
        names.sort();
        names
    }
}

fn main() {
    let mut book = Gradebook::new();
    book.add("Ferris", 90);
    book.add("Corro", 70);
    println!("{:?}", book.best_student());
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    fn sample() -> Gradebook {
        let mut b = Gradebook::new();
        b.add("Ferris", 90);
        b.add("Ferris", 70);
        b.add("Corro", 85);
        b.add("Ana", 60);
        b
    }

    #[test]
    fn averages() {
        let b = sample();
        assert_eq!(b.average("Ferris"), Some(80.0));
        assert_eq!(b.average("Nobody"), None);
    }

    #[test]
    fn best() {
        assert_eq!(sample().best_student(), Some(String::from("Corro")));
        assert_eq!(Gradebook::new().best_student(), None);
    }

    #[test]
    fn ties_go_to_the_first_name() {
        let mut b = Gradebook::new();
        b.add("Zed", 50);
        b.add("Bea", 50);
        assert_eq!(b.best_student(), Some(String::from("Bea")));
    }

    #[test]
    fn sorted_names() {
        assert_eq!(sample().names(), vec!["Ana", "Corro", "Ferris"]);
    }
}
'''
