[[level]]
id = "7.1"
title = "A growing backpack: Vec"
kind = "fill"
book = ["8.1"]
xp = 40
goal = "Write backpack (make a Vec of three items) and safe_get (read an item without crashing)."
lesson = '''
A **`Vec<T>`** is a list that can grow:

```rust
let mut v: Vec<i32> = Vec::new();
v.push(5);
v.push(6);
let w = vec![1, 2, 3];    // the vec! macro builds one with items
```

Two ways to read item `i`:
- `v[i]` gives the item, but **crashes** if `i` is out of range
- `v.get(i)` gives an **`Option<&T>`**: `Some(&item)` or `None`
'''
c_compare = '''
A `Vec` is a growable array: pointer, length and capacity, like the dynamic array you'd write with `realloc`. It frees itself.
'''
py_compare = '''
Like a Python `list`, but every item has the same type, and `.get(i)` lets you avoid `IndexError`.
'''
check = "tests"
starter = '''
fn backpack() -> Vec<String> {
    // TODO: make an empty Vec, push "rope", "lamp" and "map" (in that order), return it
    todo!()
}

fn safe_get(items: &Vec<String>, i: usize) -> String {
    // TODO: use items.get(i): return a copy of the item, or "nothing" if i is out of range
    todo!()
}

fn main() {
    let bag = backpack();
    println!("{} / {}", safe_get(&bag, 1), safe_get(&bag, 9));
}
'''
solution = '''
fn backpack() -> Vec<String> {
    let mut bag = Vec::new();
    bag.push(String::from("rope"));
    bag.push(String::from("lamp"));
    bag.push(String::from("map"));
    bag
}

fn safe_get(items: &Vec<String>, i: usize) -> String {
    match items.get(i) {
        Some(item) => item.clone(),
        None => String::from("nothing"),
    }
}

fn main() {
    let bag = backpack();
    println!("{} / {}", safe_get(&bag, 1), safe_get(&bag, 9));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn packs_three_things() {
        assert_eq!(backpack(), vec!["rope", "lamp", "map"]);
    }

    #[test]
    fn safe_get_never_crashes() {
        let bag = backpack();
        assert_eq!(safe_get(&bag, 0), "rope");
        assert_eq!(safe_get(&bag, 2), "map");
        assert_eq!(safe_get(&bag, 3), "nothing");
    }
}
'''
hints = [
    "backpack: start with `let mut bag = Vec::new();`. safe_get: `items.get(i)` is an Option, so match on it.",
    "Push each item with `bag.push(String::from(\"rope\"))`. In safe_get, `Some(item) => item.clone()` and `None => String::from(\"nothing\")`.",
    "```rust\nfn safe_get(items: &Vec<String>, i: usize) -> String {\n    match items.get(i) {\n        Some(item) => item.clone(),\n        None => String::from(\"nothing\"),\n    }\n}\n```",
]

[[level]]
id = "7.2"
title = "Don't hold it while it moves"
kind = "fix"
book = ["8.1"]
xp = 40
goal = "Make it print: first: 1, len: 4"
lesson = '''
Why can't you keep a reference into a Vec while pushing?

When a Vec runs out of room, `push` moves **all** the items to a bigger block of memory. Any reference into the old block would point at freed memory. So while `&v[0]` is in use, `v` can't be changed.

The fix is usually to **copy** the value out (numbers are `Copy`), clone it, or finish using the reference before pushing.
'''
c_compare = '''
This is exactly the C bug where you keep `int *p = &arr[0]`, call `realloc`, and then `p` dangles. Rust stops it at compile time.
'''
py_compare = '''
Python lists also reallocate, but Python references point to objects, not into the list's memory, so it can't break there.
'''
check = "output"
expected_output = "first: 1, len: 4"
starter = '''
fn main() {
    let mut v = vec![1, 2, 3];
    let first = &v[0];
    v.push(4);
    println!("first: {}, len: {}", first, v.len());
}
'''
solution = '''
fn main() {
    let mut v = vec![1, 2, 3];
    let first = v[0];
    v.push(4);
    println!("first: {}, len: {}", first, v.len());
}
'''
hints = [
    "`first` borrows from `v`, and it's still in use after the push.",
    "A number is cheap to copy. Do you need a reference at all?",
    "`let first = v[0];` copies the 1 out, so `v` is free to change.",
]

[[level]]
id = "7.3"
title = "Walking the shelves"
kind = "fill"
book = ["8.1"]
xp = 45
goal = "Write double_all (change every item) and total (add them up)."
lesson = '''
Looping over a Vec:

```rust
for x in &v {        // read each item (x is &i32)
    println!("{x}");
}

for x in &mut v {    // change each item (x is &mut i32)
    *x += 1;         // * follows the reference to the item
}
```

A Vec can only hold one type, but that type can be an **enum**, so one list can hold several kinds of things.
'''
c_compare = '''
`for x in &mut v` is like walking a pointer over an array and writing through it, but without any chance of going out of bounds.
'''
py_compare = '''
Python's `for x in items: x *= 2` doesn't change the list. In Rust, `for x in &mut v { *x *= 2 }` does.
'''
check = "tests"
starter = '''
fn double_all(v: &mut Vec<i32>) {
    todo!()
}

fn total(v: &Vec<i32>) -> i32 {
    todo!()
}

fn main() {
    let mut v = vec![1, 2, 3];
    double_all(&mut v);
    println!("{:?} total {}", v, total(&v));
}
'''
solution = '''
fn double_all(v: &mut Vec<i32>) {
    for x in v.iter_mut() {
        *x *= 2;
    }
}

fn total(v: &Vec<i32>) -> i32 {
    let mut sum = 0;
    for x in v {
        sum += x;
    }
    sum
}

fn main() {
    let mut v = vec![1, 2, 3];
    double_all(&mut v);
    println!("{:?} total {}", v, total(&v));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn doubles() {
        let mut v = vec![1, 2, 3];
        double_all(&mut v);
        assert_eq!(v, vec![2, 4, 6]);
    }

    #[test]
    fn totals() {
        assert_eq!(total(&vec![2, 4, 6]), 12);
        assert_eq!(total(&vec![]), 0);
    }
}
'''
hints = [
    "double_all needs to change each item through a mutable reference. total just reads.",
    "In double_all: `for x in v.iter_mut() { *x *= 2; }`. In total, keep a running sum.",
    "```rust\nfn double_all(v: &mut Vec<i32>) { for x in v.iter_mut() { *x *= 2; } }\nfn total(v: &Vec<i32>) -> i32 { let mut sum = 0; for x in v { sum += x; } sum }\n```",
]

