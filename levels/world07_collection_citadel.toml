[[level]]
id = "7.5"
title = "Why can't I write s[0]?"
kind = "predict"
book = ["8.2"]
xp = 25
goal = "What does this print?"
lesson = '''
Rust strings are **UTF-8**. Plain English letters take 1 byte each, but letters like `é`, `ñ` or `你` take 2 to 4 bytes.

- `s.len()` counts **bytes**
- `s.chars().count()` counts **characters**

That's why Rust doesn't let you write `s[0]`: "the first byte" might be half a letter! Use `s.chars()` to walk letters, or slices on byte positions you know are safe.
'''
c_compare = '''
`strlen` also counts bytes, not characters, but C will happily let you index into the middle of a multi-byte letter.
'''
py_compare = '''
Python's `len("héllo")` is 5 because Python counts characters. Rust's `.len()` counts bytes.
'''
starter = '''
fn main() {
    let s = String::from("héllo");
    println!("{} {}", s.len(), s.chars().count());
}
'''
choices = ["5 5", "6 5", "5 6", "It doesn't compile: é isn't allowed"]
answer = 1
expected_output = "6 5"
explanation = "`é` takes 2 bytes in UTF-8, so the string is 6 bytes long but has only 5 characters."

