name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Players compile with their own (usually latest) rustc, so check every week that a new
  # Rust release hasn't broken a level, even when nothing here changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # Every starter fails, every solution passes, every predict answer is right, and the
      # whole Rust Book is covered.
      - name: Verify levels
        run: cargo run -- verify
