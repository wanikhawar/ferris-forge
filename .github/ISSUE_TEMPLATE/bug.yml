name: Something else is broken
description: The game won't start, a button doesn't work, progress was lost, Ferris or Vim mode misbehaves…
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: terminal
    attributes:
      label: Terminal output
      description: Anything the game printed in the terminal where you ran `cargo run`.
      render: text
  - type: input
    id: os
    attributes:
      label: OS and browser
      placeholder: Arch Linux, Firefox 140
    validations:
      required: true
  - type: input
    id: rustc
    attributes:
      label: rustc version
      description: Output of `rustc --version`.
  - type: checkboxes
    id: modes
    attributes:
      label: Settings in use
      options:
        - label: Vim mode
        - label: Ferris in offline mode
